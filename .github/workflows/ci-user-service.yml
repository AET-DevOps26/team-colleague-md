name: CI - User Service

on:
  pull_request:
    branches:
      - dev
    paths:
      - "backend/user-service/**"
      - ".github/workflows/ci-user-service.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Temurin is the recommended Eclipse distribution for Spring Boot projects
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: backend/user-service

      # bootJar is skipped; 'build' compiles, runs tests, and assembles the jar
      - name: Build and test
        run: ./gradlew build
        working-directory: backend/user-service
