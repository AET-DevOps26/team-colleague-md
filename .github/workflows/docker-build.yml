name: Docker Build and Publish

on:
  pull_request:
    branches:
      - dev
    paths:
      - "backend/**"
      - "frontend/**"
      - "genai-service/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  push:
    branches:
      - dev
    paths:
      - "backend/**"
      - "frontend/**"
      - "genai-service/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ github.event_name == 'push' && 'Build and Push' || 'Build' }} — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: user-service
            context: ./backend/user-service
          - name: content-service
            context: ./backend/content-service
          - name: recommendation-service
            context: ./backend/recommendation-service
          - name: genai-service
            context: ./genai-service
          - name: frontend
            context: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr

      - name: Build (PR) or Build and Push (merge to dev)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
