name: CI - GenAI Service

on:
  pull_request:
    branches:
      - dev
    paths:
      - "genai-service/**"
      - ".github/workflows/ci-genai-service.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: genai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: genai-service

      # Verifies that FastAPI app object is importable; catches missing deps and syntax errors
      - name: Verify application imports
        run: python -c "from app.main import app"
        working-directory: genai-service

      - name: Run tests
        run: pytest -q
        working-directory: genai-service
