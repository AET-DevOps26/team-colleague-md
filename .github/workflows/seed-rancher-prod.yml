name: Seed Rancher Production Demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-verita-prod
  cancel-in-progress: false

jobs:
  seed:
    name: Seed verita-prod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install seed dependencies
        run: npm ci

      - name: Set up kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          test -n "$KUBECONFIG_CONTENT"
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_CONTENT" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Preflight and seed production demo
        env:
          RANCHER_ENV: prod
          USER_DB_PASSWORD: ${{ secrets.USER_DB_PASSWORD }}
          CONTENT_DB_PASSWORD: ${{ secrets.CONTENT_DB_PASSWORD }}
          RECOMMENDATION_DB_PASSWORD: ${{ secrets.RECOMMENDATION_DB_PASSWORD }}
          USER_STORAGE_S3_SECRET_KEY: ${{ secrets.USER_SERVICE_S3_SECRET_KEY }}
          CONTENT_STORAGE_S3_SECRET_KEY: ${{ secrets.CONTENT_SERVICE_S3_SECRET_KEY }}
        run: npm run seed:rancher
