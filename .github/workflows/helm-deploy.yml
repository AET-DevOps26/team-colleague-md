name: Helm Deploy

on:
  workflow_run:
    workflows: ["Docker Build and Publish"]
    branches: [main, dev]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Kubernetes (${{ github.event.workflow_run.head_branch }})
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Deploy Umbrella Chart via Helm
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            DEPLOY_ENV="prod"
          else
            DEPLOY_ENV="dev"
          fi

          echo "Deploying to environment: $DEPLOY_ENV"

          helm upgrade --install verita-$DEPLOY_ENV ./infra/helm/verita \
            -f ./infra/helm/verita/values-$DEPLOY_ENV.yaml \
            --namespace verita-$DEPLOY_ENV \
            --create-namespace \
            --set frontend.image.rolloutId=${{ github.event.workflow_run.run_id }} \
            --set content.image.rolloutId=${{ github.event.workflow_run.run_id }} \
            --set user.image.rolloutId=${{ github.event.workflow_run.run_id }} \
            --set recommendation.image.rolloutId=${{ github.event.workflow_run.run_id }} \
            --set genai.image.rolloutId=${{ github.event.workflow_run.run_id }}
