name: Helm Deploy

on:
  workflow_run:
    workflows: ["Docker Build and Publish"]
    branches: [main, dev]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Kubernetes (${{ github.event.workflow_run.head_branch }})
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.environment == 'prod' && 'main' || github.ref_name) || github.event.workflow_run.head_sha }}

      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Add Helm repositories and update dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm dependency update ./infra/helm/verita

      - name: Deploy Umbrella Chart via Helm
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEPLOY_ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            DEPLOY_ENV="prod"
          else
            DEPLOY_ENV="dev"
          fi

          echo "Deploying to environment: $DEPLOY_ENV"

          # workflow_run runs always carry main's ref/SHA in the run header (GitHub
          # runs the workflow file from the default branch for trust reasons), so the
          # UI's branch label is NOT the deployed branch. Surface the real source
          # branch + target in the run summary so it's visible without digging logs.
          SRC_BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          {
            echo "### Helm deploy"
            echo "- Source branch: \`$SRC_BRANCH\`"
            echo "- Target environment: \`$DEPLOY_ENV\` (namespace \`verita-$DEPLOY_ENV\`)"
          } >> "$GITHUB_STEP_SUMMARY"

          # Real secrets are injected for prod only. Dev keeps the committed insecure
          # defaults (values.yaml) so verita-dev stays reproducible without secret access.
          # A prod deploy against an existing postgres PVC will CrashLoop on auth — the
          # Bitnami password is only honoured on first init of an empty data dir.
          PROD_SECRETS=()
          if [ "$DEPLOY_ENV" = "prod" ]; then
            PROD_SECRETS=(
              --set global.jwtSecret="${{ secrets.JWT_SECRET }}"
              --set global.internalServiceToken="${{ secrets.INTERNAL_SERVICE_TOKEN }}"
              --set minio.rootPassword="${{ secrets.MINIO_ROOT_PASSWORD }}"
              --set user-postgresql.auth.password="${{ secrets.USER_DB_PASSWORD }}"
              --set content-postgresql.auth.password="${{ secrets.CONTENT_DB_PASSWORD }}"
              --set recommendation-postgresql.auth.password="${{ secrets.RECOMMENDATION_DB_PASSWORD }}"
              --set minio.users[0].secretKey="${{ secrets.USER_SERVICE_S3_SECRET_KEY }}"
              --set minio.users[1].secretKey="${{ secrets.CONTENT_SERVICE_S3_SECRET_KEY }}"
              # Brevo SMTP for the user-service password-reset mail. Renders secret-mail.yaml and
              # the MAIL_* env block (deployment.yaml); overrides the placeholder sender in values-prod.
              --set global.mailUsername="${{ secrets.MAIL_USERNAME }}"
              --set global.mailPassword="${{ secrets.MAIL_PASSWORD }}"
              --set services.user.mail.from="${{ secrets.MAIL_FROM }}"
            )
          fi

          # GenAI credentials are deployed to both demo environments so the daily-digest path can
          # be exercised in dev as well as prod. They are kept in GitHub Secrets, never Helm values.
          GENAI_SECRETS=(
            --set-string services.genai.llm.nvidiaNimApiKey="${{ secrets.NVIDIA_NIM_API_KEY }}"
            --set-string services.genai.llm.logosApiKey="${{ secrets.LOGOS_API_KEY }}"
            --set-string services.genai.llm.gnewsApiKey="${{ secrets.GNEWS_API_KEY }}"
          )

          helm upgrade --install verita \
            ./infra/helm/verita \
            -f ./infra/helm/verita/values.yaml \
            -f ./infra/helm/verita/values-$DEPLOY_ENV.yaml \
            --namespace verita-$DEPLOY_ENV \
            --create-namespace \
            "${PROD_SECRETS[@]}" \
            "${GENAI_SECRETS[@]}" \
            --set services.frontend.rolloutId=${{ github.event.workflow_run.id || github.run_id }} \
            --set services.content.rolloutId=${{ github.event.workflow_run.id || github.run_id }} \
            --set services.user.rolloutId=${{ github.event.workflow_run.id || github.run_id }} \
            --set services.recommendation.rolloutId=${{ github.event.workflow_run.id || github.run_id }} \
            --set services.genai.rolloutId=${{ github.event.workflow_run.id || github.run_id }}
