name: Helm Deploy

on:
  workflow_run:
    workflows: ["Docker Build and Publish"]
    branches: [main, dev]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Kubernetes (${{ github.event.workflow_run.head_branch }})
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.environment == 'prod' && 'main' || 'dev') || github.event.workflow_run.head_sha }}

      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Add Helm repositories and update dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm dependency update ./infra/helm/verita

      - name: Deploy Umbrella Chart via Helm
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEPLOY_ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            DEPLOY_ENV="prod"
          else
            DEPLOY_ENV="dev"
          fi

          echo "Deploying to environment: $DEPLOY_ENV"

          helm upgrade --install verita \
            ./infra/helm/verita \
            -f ./infra/helm/verita/values.yaml \
            -f ./infra/helm/verita/values-$DEPLOY_ENV.yaml \
            --namespace verita-$DEPLOY_ENV \
            --create-namespace \
            --set minio.rootPassword=${{ secrets.MINIO_ROOT_PASSWORD }} \
            --set services.frontend.rolloutId=${{ github.event.workflow_run.id || github.run_id }} \
            --set services.content.rolloutId=${{ github.event.workflow_run.id || github.run_id }} \
            --set services.user.rolloutId=${{ github.event.workflow_run.id || github.run_id }} \
            --set services.recommendation.rolloutId=${{ github.event.workflow_run.id || github.run_id }} \
            --set services.genai.rolloutId=${{ github.event.workflow_run.id || github.run_id }}
