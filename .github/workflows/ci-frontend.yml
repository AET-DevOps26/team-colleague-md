name: CI - Frontend

on:
  pull_request:
    branches:
      - dev
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # 'npm ci' installs exact versions from package-lock.json, faster and stricter than 'npm install'
      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      # 'build' script runs tsc -b (type check) then vite build (bundle)
      - name: Build
        run: npm run build
        working-directory: frontend
