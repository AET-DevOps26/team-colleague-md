name: Deploy API Docs

on:
  push:
    branches:
      - main  # Runs only when you merge to main
    paths:
      - "**/openapi.yaml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli

      - name: Build User Service Docs
        # Matches your structure: backend/user-service/api/openapi.yaml
        run: redocly build-docs backend/user-service/api/openapi.yaml --output=index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Uploads the folder containing index.html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4