name: Docker Build and Publish

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "genai-service/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-publish.yml"
  push:
    branches:
      - dev
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "genai-service/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-publish.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && format('Build and Push (:latest) — {0}', matrix.service.name) || (github.event_name == 'push' && github.ref == 'refs/heads/dev') && format('Build and Push (:dev) — {0}', matrix.service.name) || format('Build — {0}', matrix.service.name) }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: user-service
            context: ./backend/user-service
          - name: content-service
            context: ./backend/content-service
          - name: recommendation-service
            context: ./backend/recommendation-service
          - name: genai-service
            context: ./genai-service
          - name: frontend
            context: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}



  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Connect to your TUM Kubernetes Cluster
      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      # 2. Install Helm CLI
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      # 3. Dynamically deploy based on which branch was merged
      - name: Deploy Umbrella Chart via Helm
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="prod"
          else
            ENV="dev"
          fi
          
          echo "Target Environment determined: $ENV"
          
          helm upgrade --install verita-$ENV ./ \
            -f values-$ENV.yaml \
            --namespace verita-$ENV \
            --create-namespace \
            --set frontend.image.rolloutId=${{ github.run_id }} \
            --set content.image.rolloutId=${{ github.run_id }} \
            --set user.image.rolloutId=${{ github.run_id }} \
            --set recommendation.image.rolloutId=${{ github.run_id }} \
            --set genai.image.rolloutId=${{ github.run_id }}