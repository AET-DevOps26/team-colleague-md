name: Deploy API Docs Hub

on:
  push:
    branches:
      - main
    paths:
      - "**/openapi.yaml"
      - "index.html"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli

      - name: Create Build Directory
        run: mkdir public_docs

      # 1. Copy the index file to the build folder
      - name: Prepare Index
        run: cp index.html public_docs/

      # 2. Build User Service (referenced from backend/user-service/api/openapi.yaml)
      - name: Build User Service Docs
        run: redocly build-docs backend/user-service/api/openapi.yaml --output=public_docs/user-service.html

      # 3. Build Content Service (referenced from backend/content-service/api/openapi.yaml)
      - name: Build Content Service Docs
        run: redocly build-docs backend/content-service/api/openapi.yaml --output=public_docs/content-service.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public_docs' # Upload only the generated folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
