name: Ansible Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Docker Build and Publish"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    name: Deploy Verita to Azure VM
    # For workflow_run: only deploy after a push to main (not a PR build); always run for manual triggers
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install ansible

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AZURE_PRIVATE_KEY }}" > ~/.ssh/verita_key
          chmod 600 ~/.ssh/verita_key

      - name: Generate inventory from AZURE_PUBLIC_IP variable
        run: |
          cat > infra/ansible/inventory.ini << EOF
          [verita]
          verita-vm ansible_host=${{ vars.AZURE_PUBLIC_IP }} ansible_user=${{ vars.AZURE_USER }} ansible_ssh_private_key_file=~/.ssh/verita_key ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          EOF

      - name: Run Ansible playbook
        run: |
          ansible-playbook \
            -i infra/ansible/inventory.ini \
            infra/ansible/deploy.yml \
            --extra-vars "github_actor=${{ github.actor }} github_token=${{ secrets.GITHUB_TOKEN }} user_db_password=${{ secrets.USER_DB_PASSWORD }} content_db_password=${{ secrets.CONTENT_DB_PASSWORD }} recommendation_db_password=${{ secrets.RECOMMENDATION_DB_PASSWORD }} jwt_secret=${{ secrets.JWT_SECRET }} minio_root_password=${{ secrets.MINIO_ROOT_PASSWORD }} user_service_s3_access_key=${{ secrets.USER_SERVICE_S3_ACCESS_KEY }} user_service_s3_secret_key=${{ secrets.USER_SERVICE_S3_SECRET_KEY }} content_service_s3_access_key=${{ secrets.CONTENT_SERVICE_S3_ACCESS_KEY }} content_service_s3_secret_key=${{ secrets.CONTENT_SERVICE_S3_SECRET_KEY }} internal_service_token=${{ secrets.INTERNAL_SERVICE_TOKEN }} mail_username=${{ secrets.MAIL_USERNAME }} mail_password=${{ secrets.MAIL_PASSWORD }} mail_from=${{ secrets.MAIL_FROM }} nvidia_nim_api_key=${{ secrets.NVIDIA_NIM_API_KEY }} logos_api_key=${{ secrets.LOGOS_API_KEY }} gnews_api_key=${{ secrets.GNEWS_API_KEY }}"
