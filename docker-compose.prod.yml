# Production compose file — uses pre-built images from ghcr.io.
# Uploaded to the VM by Ansible; requires prior docker login to ghcr.io.
services:
  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${USER_DB_NAME:-verita_users}
      POSTGRES_USER: ${USER_DB_USER:-svc_user}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${USER_DB_USER:-svc_user} -d ${USER_DB_NAME:-verita_users}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  content-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CONTENT_DB_NAME:-verita_contents}
      POSTGRES_USER: ${CONTENT_DB_USER:-svc_content}
      POSTGRES_PASSWORD: ${CONTENT_DB_PASSWORD}
    volumes:
      - content-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${CONTENT_DB_USER:-svc_content} -d ${CONTENT_DB_NAME:-verita_contents}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  recommendation-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${RECOMMENDATION_DB_NAME:-verita_recommendations}
      POSTGRES_USER: ${RECOMMENDATION_DB_USER:-svc_recommendation}
      POSTGRES_PASSWORD: ${RECOMMENDATION_DB_PASSWORD}
    volumes:
      - recommendation-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${RECOMMENDATION_DB_USER:-svc_recommendation} -d ${RECOMMENDATION_DB_NAME:-verita_recommendations}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-verita_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-verita_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_USER_PORTRAITS_BUCKET: ${STORAGE_USER_PORTRAITS_BUCKET:-verita-user-portraits}
      MINIO_POST_PHOTOS_BUCKET: ${STORAGE_POST_PHOTOS_BUCKET:-verita-post-photos}
      USER_SERVICE_S3_ACCESS_KEY: ${USER_SERVICE_S3_ACCESS_KEY:?USER_SERVICE_S3_ACCESS_KEY is required}
      USER_SERVICE_S3_SECRET_KEY: ${USER_SERVICE_S3_SECRET_KEY:?USER_SERVICE_S3_SECRET_KEY is required}
      CONTENT_SERVICE_S3_ACCESS_KEY: ${CONTENT_SERVICE_S3_ACCESS_KEY:?CONTENT_SERVICE_S3_ACCESS_KEY is required}
      CONTENT_SERVICE_S3_SECRET_KEY: ${CONTENT_SERVICE_S3_SECRET_KEY:?CONTENT_SERVICE_S3_SECRET_KEY is required}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2
        done

        mc mb --ignore-existing "local/$${MINIO_USER_PORTRAITS_BUCKET}"
        mc mb --ignore-existing "local/$${MINIO_POST_PHOTOS_BUCKET}"

        cat > /tmp/user-service-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"],
              "Resource": ["arn:aws:s3:::$${MINIO_USER_PORTRAITS_BUCKET}"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
              "Resource": ["arn:aws:s3:::$${MINIO_USER_PORTRAITS_BUCKET}/*"]
            }
          ]
        }
        EOF

        cat > /tmp/content-service-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"],
              "Resource": ["arn:aws:s3:::$${MINIO_POST_PHOTOS_BUCKET}"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
              "Resource": ["arn:aws:s3:::$${MINIO_POST_PHOTOS_BUCKET}/*"]
            }
          ]
        }
        EOF

        mc admin policy create local user-service-portraits-rw /tmp/user-service-policy.json || true
        mc admin policy create local content-service-posts-rw /tmp/content-service-policy.json || true

        mc admin user info local "$${USER_SERVICE_S3_ACCESS_KEY}" >/dev/null 2>&1 ||
          mc admin user add local "$${USER_SERVICE_S3_ACCESS_KEY}" "$${USER_SERVICE_S3_SECRET_KEY}"
        mc admin user info local "$${CONTENT_SERVICE_S3_ACCESS_KEY}" >/dev/null 2>&1 ||
          mc admin user add local "$${CONTENT_SERVICE_S3_ACCESS_KEY}" "$${CONTENT_SERVICE_S3_SECRET_KEY}"

        mc admin policy attach local user-service-portraits-rw --user "$${USER_SERVICE_S3_ACCESS_KEY}"
        mc admin policy attach local content-service-posts-rw --user "$${CONTENT_SERVICE_S3_ACCESS_KEY}"

        mc anonymous set download "local/$${MINIO_USER_PORTRAITS_BUCKET}"
        mc anonymous set download "local/$${MINIO_POST_PHOTOS_BUCKET}"

  user-service:
    image: ghcr.io/aet-devops26/team-colleague-md/user-service:latest
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required — set to http://<VM_IP>}
      # Shared HS256 secret — all backend services must receive the SAME value (token interop).
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required — must be identical across all services}
      # ADR-0007 shared service-to-service secret — must be identical across all backend services.
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required — must be identical across all services}
      - DB_HOST=user-db
      - DB_PORT=5432
      - DB_NAME=${USER_DB_NAME:-verita_users}
      - DB_USER=${USER_DB_USER:-svc_user}
      - DB_PASSWORD=${USER_DB_PASSWORD}
      - STORAGE_S3_ENDPOINT=${STORAGE_S3_ENDPOINT:-http://minio:9000}
      - STORAGE_S3_PUBLIC_ENDPOINT=${STORAGE_S3_PUBLIC_ENDPOINT:?STORAGE_S3_PUBLIC_ENDPOINT is required — set to http://<VM_IP>/storage}
      - STORAGE_S3_REGION=${STORAGE_S3_REGION:-us-east-1}
      - STORAGE_S3_ACCESS_KEY=${USER_SERVICE_S3_ACCESS_KEY:?USER_SERVICE_S3_ACCESS_KEY is required}
      - STORAGE_S3_SECRET_KEY=${USER_SERVICE_S3_SECRET_KEY:?USER_SERVICE_S3_SECRET_KEY is required}
      - STORAGE_S3_PATH_STYLE_ACCESS=true
      - STORAGE_USER_PORTRAITS_BUCKET=${STORAGE_USER_PORTRAITS_BUCKET:-verita-user-portraits}
      - CONTENT_SERVICE_BASE_URL=http://content-service:8082
      # Password-reset mail via Brevo SMTP. Host/port carry committed defaults; the SMTP login,
      # SMTP key, and verified sender are required secrets injected from .env (see Ansible deploy).
      - MAIL_HOST=${MAIL_HOST:-smtp-relay.brevo.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:?MAIL_USERNAME is required — Brevo SMTP login}
      - MAIL_PASSWORD=${MAIL_PASSWORD:?MAIL_PASSWORD is required — Brevo SMTP key}
      - MAIL_FROM=${MAIL_FROM:?MAIL_FROM is required — a Brevo-verified sender address}
      - MAIL_SMTP_AUTH=true
      - MAIL_SMTP_STARTTLS=true
    depends_on:
      user-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  content-service:
    image: ghcr.io/aet-devops26/team-colleague-md/content-service:latest
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # Shared HS256 secret — must match user-service / recommendation-service.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required — must be identical across all services}
      # ADR-0007 shared service-to-service secret — must be identical across all backend services.
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required — must be identical across all services}
      # Cross-service calls (Clients.java): reach peers by compose service name, not localhost.
      - USER_SERVICE_BASE_URL=http://user-service:8081
      - RECOMMENDATION_SERVICE_BASE_URL=http://recommendation-service:8083
      - GENAI_SERVICE_BASE_URL=http://genai-service:8000
      - DB_HOST=content-db
      - DB_PORT=5432
      - DB_NAME=${CONTENT_DB_NAME:-verita_contents}
      - DB_USER=${CONTENT_DB_USER:-svc_content}
      - DB_PASSWORD=${CONTENT_DB_PASSWORD}
      - STORAGE_S3_ENDPOINT=${STORAGE_S3_ENDPOINT:-http://minio:9000}
      - STORAGE_S3_PUBLIC_ENDPOINT=${STORAGE_S3_PUBLIC_ENDPOINT:?STORAGE_S3_PUBLIC_ENDPOINT is required — set to http://<VM_IP>/storage}
      - STORAGE_S3_REGION=${STORAGE_S3_REGION:-us-east-1}
      - STORAGE_S3_ACCESS_KEY=${CONTENT_SERVICE_S3_ACCESS_KEY:?CONTENT_SERVICE_S3_ACCESS_KEY is required}
      - STORAGE_S3_SECRET_KEY=${CONTENT_SERVICE_S3_SECRET_KEY:?CONTENT_SERVICE_S3_SECRET_KEY is required}
      - STORAGE_S3_PATH_STYLE_ACCESS=true
      - STORAGE_POST_PHOTOS_BUCKET=${STORAGE_POST_PHOTOS_BUCKET:-verita-post-photos}
    depends_on:
      content-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  recommendation-service:
    image: ghcr.io/aet-devops26/team-colleague-md/recommendation-service:latest
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # Shared HS256 secret — must match user-service / content-service.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required — must be identical across all services}
      # ADR-0007 shared service-to-service secret — must be identical across all backend services.
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required — must be identical across all services}
      # Cross-service calls (ContentClient): reach content-service by compose service name.
      - CONTENT_SERVICE_BASE_URL=http://content-service:8082
      - DB_HOST=recommendation-db
      - DB_PORT=5432
      - DB_NAME=${RECOMMENDATION_DB_NAME:-verita_recommendations}
      - DB_USER=${RECOMMENDATION_DB_USER:-svc_recommendation}
      - DB_PASSWORD=${RECOMMENDATION_DB_PASSWORD}
    depends_on:
      recommendation-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  genai-service:
    image: ghcr.io/aet-devops26/team-colleague-md/genai-service:latest
    environment:
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required — must be identical across all services}
      - LLM_PROVIDER=${LLM_PROVIDER:-logos}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-120b}
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY:-}
      - LOGOS_API_KEY=${LOGOS_API_KEY:-}
      - GNEWS_API_KEY=${GNEWS_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: ghcr.io/aet-devops26/team-colleague-md/frontend:latest
    ports:
      - "80:80"
    environment:
      - USER_SERVICE_URL=http://user-service:8081
      - CONTENT_SERVICE_URL=http://content-service:8082
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:8083
      - GENAI_SERVICE_URL=http://genai-service:8000
      - MINIO_URL=http://minio:9000
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  user-db-data:
  content-db-data:
  recommendation-db-data:
  minio-data:
