openapi: 3.1.0

info:
  title: Verita GenAI Service API
  description: |
    AI-powered service for post summarization, tag suggestions, and daily digest
    text generation. For daily digests, callers provide subscribed topics and
    the GenAI service fetches relevant external sources for the requested day.
  version: 1.1.0
  license:
    name: Proprietary

servers:
  - url: http://api.verita.local/genai
    description: Production-style internal URL
  - url: http://localhost:8000
    description: Local development

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      tags: [Health]
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: GenAI Service

  /api/v1/genai/digests/generate:
    post:
      operationId: generateDailyDigest
      summary: Generate a one-day text digest for subscribed topics
      description: |
        Generates a personalized text digest for a user's subscribed topics over
        a one-day period. Recommendation Service owns the subscription list and
        supplies the subscribed topics. GenAI Service fetches relevant external
        sources for those topics during the requested period and summarizes what
        newly happened.

        The service does not persist the digest. The caller is responsible for
        storing the response, exposing historical digests, and delivering
        notifications.
      tags: [Digests]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DigestGenerateRequest'
            examples:
              personalizedDailyDigest:
                summary: Daily digest for a subscribed user
                value:
                  userId: 123e4567-e89b-12d3-a456-426614174000
                  digestDate: '2026-06-03'
                  periodStart: '2026-06-02T00:00:00Z'
                  periodEnd: '2026-06-03T00:00:00Z'
                  timezone: Europe/Berlin
                  topics:
                    - id: 7f7d0f5a-9f75-4971-9624-89a01c3439d6
                      name: LLMs
                    - id: 1ff86b78-d1ef-4fb2-8eec-4f8931f22f1a
                      name: AI Agents
                  sourcePolicy: trusted
                  maxSourcesPerTopic: 5
                  maxEvents: 8
      responses:
        '200':
          description: Digest generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigestGenerateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/LlmError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Request is syntactically valid but violates digest generation rules
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request body failed schema validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    LlmError:
      description: LLM provider was unavailable or returned an error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    DigestGenerateRequest:
      type: object
      description: |
        Request for generating a daily digest. In OpenAPI, `required` lists only
        the fields the caller must send; each field's datatype and format are
        defined under `properties`. Fields with defaults are optional request
        controls used when the caller wants to override GenAI's normal behavior.
      required: [digestDate, periodStart, periodEnd, timezone, topics]
      properties:
        userId:
          type: string
          format: uuid
          description: User receiving the personalized digest. Omit only for anonymous community digests.
        digestDate:
          type: string
          format: date
          description: Calendar date represented by the digest in the requested timezone.
          example: '2026-06-03'
        periodStart:
          type: string
          format: date-time
          description: Inclusive start of the one-day content window.
        periodEnd:
          type: string
          format: date-time
          description: Exclusive end of the one-day content window. Must be after periodStart and no more than 24 hours later.
        timezone:
          type: string
          description: IANA timezone used to interpret digestDate and the one-day window.
          example: Europe/Berlin
        topics:
          type: array
          minItems: 1
          maxItems: 50
          description: Topics the user is subscribed to, supplied by Recommendation Service.
          items:
            $ref: '#/components/schemas/DigestTopic'
        sourcePolicy:
          type: string
          enum: [default, trusted, broad]
          default: default
          description: Optional external source selection strategy used by GenAI when fetching source material.
        preferredSourceUrls:
          type: array
          maxItems: 20
          description: Optional trusted domains or feed URLs the caller wants GenAI to prioritize.
          items:
            type: string
            format: uri
        maxSourcesPerTopic:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          description: Optional limit for the maximum number of external sources to fetch per subscribed topic.
        maxEvents:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
          description: Optional limit for the maximum number of digest events to return.
        tone:
          type: string
          enum: [concise, technical, executive]
          default: technical
          description: Optional writing style for the generated digest text.

    DigestTopic:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80

    DigestGenerateResponse:
      type: object
      required:
        - digestDate
        - periodStart
        - periodEnd
        - title
        - topStorySubtitle
        - summary
        - topics
        - events
        - eventCount
        - sourceCount
        - readTimeMinutes
        - generatedAt
        - model
      properties:
        digestId:
          type: string
          format: uuid
          description: Optional ID supplied by the caller or generated by an outer persistence layer.
        userId:
          type: string
          format: uuid
        digestDate:
          type: string
          format: date
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        title:
          type: string
          example: Your Wednesday AI Digest
        topStorySubtitle:
          type: string
          description: One-sentence headline for the most important new development.
        summary:
          type: string
          description: Text-based overview paragraph of what newly happened across the subscribed topics.
        topics:
          type: array
          items:
            $ref: '#/components/schemas/DigestTopic'
        events:
          type: array
          description: Structured digest sections rendered as the individual event blocks in the digest post.
          items:
            $ref: '#/components/schemas/DigestEvent'
        eventCount:
          type: integer
          minimum: 0
        sourceCount:
          type: integer
          minimum: 0
          description: Number of external sources used for the generated digest.
        readTimeMinutes:
          type: integer
          minimum: 1
        generatedAt:
          type: string
          format: date-time
        model:
          type: string
          description: LLM model used for generation.
        usage:
          $ref: '#/components/schemas/TokenUsage'

    DigestEvent:
      type: object
      description: |
        One newly observed development in the daily digest. The frontend can render
        each event as a headline with bullets and external source links, while the
        caller can trace which subscribed topics caused the event to appear.
      required: [headline, summaryBullets, topicIds, sourceUrls]
      properties:
        headline:
          type: string
          description: Short event headline suitable for the digest post.
        summaryBullets:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
          description: Concise bullets explaining what changed and why it matters.
        topicIds:
          type: array
          description: Subscribed topic IDs that this event is relevant to.
          items:
            type: string
            format: uuid
        sourceUrls:
          type: array
          items:
            type: string
            format: uri
          description: External source URLs used to support this digest event.
        occurredAt:
          type: string
          format: date-time
          description: Best available event time, usually the newest source post timestamp.

    TokenUsage:
      type: object
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: llm_error
        message:
          type: string
          example: Failed to generate digest.
        details:
          type: string
