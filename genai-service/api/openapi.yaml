openapi: 3.1.0

info:
  title: Verita GenAI Service API
  description: |
    AI-powered service for post summarization, tag suggestions, and daily digest
    generation. Daily digest generation is asynchronous: internal callers submit
    a job, poll its status, and persist the final digest when the job succeeds.
  version: 1.2.0
  license:
    name: Proprietary

servers:
  - url: http://api.verita.local/genai
    description: Production-style internal URL
  - url: http://localhost:8000
    description: Local development

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      tags: [Health]
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: GenAI Service

  /api/v1/genai/summarize:
    post:
      operationId: summarizePost
      summary: Summarize post content
      description: |
        Accepts post content and an optional post title, then returns exactly
        three concise bullet summaries generated by the configured LLM. This
        endpoint is called by the Content Service when a user requests summary
        generation for a post.
      tags: [GenAI]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SummarizeRequest'
            examples:
              postSummary:
                summary: Post content summary request
                value:
                  postId: 123e4567-e89b-12d3-a456-426614174000
                  title: 'GPT-5 Released: First Impressions and Benchmarks'
                  content: OpenAI just released GPT-5 with significant improvements in reasoning, code generation, and multimodal understanding. The model shows 40% improvement on HumanEval benchmarks and introduces a new thinking mode that makes its reasoning process transparent. Early benchmarks suggest it outperforms Claude and Gemini on most coding tasks, though it struggles with very long context windows. Pricing is set at $10/1M input tokens.
      responses:
        '200':
          description: Successfully generated summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummarizeResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/LlmError'

  /api/v1/genai/digests/generate:
    post:
      operationId: createDailyDigestJob
      summary: Start daily digest generation
      description: |
        Creates an asynchronous in-memory job that generates a personalized text
        digest for the supplied topics and one-day period. The caller does not
        provide source items. GenAI fetches external sources internally from the
        MVP provider set: GitHub, GNews, and Hugging Face models/datasets.

        The endpoint returns `202 Accepted` because digest generation continues
        after the HTTP response. The caller must poll `statusUrl` until the job is
        `SUCCEEDED` or `FAILED`, then persist the result outside GenAI.

        MVP limitations: job state is in-memory, lost on restart, and local to one
        GenAI service instance. Redis/Postgres or a queue-backed worker should
        replace this for production.
      tags: [Digests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DigestGenerateRequest'
            examples:
              personalizedDailyDigest:
                summary: Daily digest job for a subscribed user
                value:
                  requestId: recommendation-2026-06-04-user-123
                  userId: 123e4567-e89b-12d3-a456-426614174000
                  digestDate: '2026-06-04'
                  periodStart: '2026-06-03T00:00:00Z'
                  periodEnd: '2026-06-04T00:00:00Z'
                  timezone: Europe/Berlin
                  topics:
                    - id: 7f7d0f5a-9f75-4971-9624-89a01c3439d6
                      name: LLMs
                    - id: 1ff86b78-d1ef-4fb2-8eec-4f8931f22f1a
                      name: AI Agents
                  maxSourcesPerTopic: 5
                  maxEvents: 8
                  tone: technical
      security:
        - bearerAuth: []
      responses:
        '202':
          description: |
            Digest generation job accepted. Provider and LLM failures that occur
            after acceptance are reported through `GET /api/v1/genai/digests/jobs/{jobId}`
            as a `FAILED` job with `error.code` such as `llm_error` or `llm_parse_error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigestJobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/genai/digests/jobs/{jobId}:
    get:
      operationId: getDailyDigestJob
      summary: Get daily digest job status
      description: |
        Returns the current state of an asynchronous digest generation job. When
        the job status is `SUCCEEDED`, the response includes the generated digest
        result. When the job status is `FAILED`, the response includes an error;
        LLM provider failures are represented here with `error.code = llm_error`
        instead of an immediate `502` from the job creation endpoint.
      tags: [Digests]
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Digest job status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigestJobStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Request is syntactically valid but violates digest generation rules
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request body failed schema validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    LlmError:
      description: LLM service unavailable or returned an error
      content:
        application/json:
          schema:
            type: object
            required: [detail]
            properties:
              detail:
                $ref: '#/components/schemas/ErrorResponse'
          example:
            detail:
              error: llm_error
              message: Failed to generate summary. The LLM service may be unavailable.
              details: Upstream provider timeout

  schemas:
    SummarizeRequest:
      type: object
      description: Request body for summarizing post content into three concise bullets.
      required: [postId, content]
      properties:
        postId:
          type: string
          description: ID of the post being summarized.
          example: 123e4567-e89b-12d3-a456-426614174000
        content:
          type: string
          minLength: 50
          maxLength: 50000
          description: Full post content to summarize.
        title:
          type:
            - string
            - 'null'
          maxLength: 300
          description: Optional post title for additional context.

    SummarizeResponse:
      type: object
      description: Three-bullet LLM summary response for a post.
      required: [postId, summary, model]
      properties:
        postId:
          type: string
          description: ID of the summarized post.
          example: 123e4567-e89b-12d3-a456-426614174000
        summary:
          type: array
          description: Exactly three bullet summaries parsed from the LLM output.
          minItems: 3
          maxItems: 3
          items:
            type: string
          example:
            - GPT-5 introduces improved reasoning, code generation, and multimodal understanding for AI practitioners.
            - Early benchmarks show stronger coding performance, though long-context behavior remains a limitation.
            - Premium pricing positions the model as a higher-cost option for production LLM workloads.
        model:
          type: string
          description: LLM model used for generation.
          example: gemini-2.0-flash
        usage:
          anyOf:
            - $ref: '#/components/schemas/TokenUsage'
            - type: 'null'
          description: Token usage statistics when reported by the provider.

    DigestGenerateRequest:
      type: object
      description: |
        Request for starting a daily digest job. In OpenAPI, `required` lists only
        the fields the caller must send; each field's datatype and format are
        defined under `properties`. GenAI owns external source fetching and uses
        internal prompt limits: snippets are trimmed to 400 characters and at most
        30 selected sources are sent to the LLM.
      required: [digestDate, periodStart, periodEnd, timezone, topics]
      properties:
        requestId:
          type: string
          maxLength: 120
          description: Optional caller correlation ID. Echoed in job responses, but not treated as an idempotency key.
        userId:
          type: string
          format: uuid
          description: Optional user receiving the personalized digest. The caller owns durable user-to-digest mapping.
        digestDate:
          type: string
          format: date
          description: Calendar date represented by the digest in the requested timezone.
          example: '2026-06-04'
        periodStart:
          type: string
          format: date-time
          description: Inclusive start of the one-day content window.
        periodEnd:
          type: string
          format: date-time
          description: Exclusive end of the one-day content window. Must be after periodStart and no more than 24 hours later.
        timezone:
          type: string
          description: IANA timezone used to interpret digestDate and the one-day window.
          example: Europe/Berlin
        topics:
          type: array
          minItems: 1
          maxItems: 50
          description: Topics the user is subscribed to, supplied by the internal caller.
          items:
            $ref: '#/components/schemas/DigestTopic'
        maxSourcesPerTopic:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          description: Optional final selected source limit per topic across all internal providers.
        maxEvents:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
          description: Optional maximum number of digest events to return.
        tone:
          type: string
          enum: [concise, technical, executive]
          default: technical
          description: Optional writing style for the generated digest text.

    DigestTopic:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80

    DigestJobAccepted:
      type: object
      required: [jobId, status, statusUrl, submittedAt]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/DigestJobStatusValue'
        statusUrl:
          type: string
          example: /api/v1/genai/digests/jobs/8df7f6e0-6c3f-4b82-8d90-7d3d5b8dc8e8
        requestId:
          type: string
        userId:
          type: string
          format: uuid
        submittedAt:
          type: string
          format: date-time

    DigestJobStatus:
      type: object
      required: [jobId, status, submittedAt, warnings]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/DigestJobStatusValue'
        requestId:
          type: string
          description: Echoed caller correlation ID when provided.
        userId:
          type: string
          format: uuid
        submittedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        warnings:
          type: array
          description: Non-fatal provider or topic issues. Warnings can appear on succeeded jobs.
          items:
            $ref: '#/components/schemas/DigestJobWarning'
        result:
          $ref: '#/components/schemas/DigestGenerateResponse'
        error:
          $ref: '#/components/schemas/DigestJobError'

    DigestJobStatusValue:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]

    DigestJobWarning:
      type: object
      required: [provider, code, message]
      properties:
        provider:
          type: string
          enum: [github, gnews, huggingface, all]
          description: Source provider related to the warning, or `all` for topic-level warnings.
        topicId:
          type: string
          format: uuid
          description: Topic related to the warning. Omitted for provider-level warnings.
        code:
          type: string
          enum: [missing_credentials, provider_error, no_sources_for_topic]
        message:
          type: string

    DigestJobError:
      type: object
      description: Fatal job error. Provider-level non-fatal issues are reported as warnings instead.
      required: [code, message]
      properties:
        code:
          type: string
          enum: [no_sources_found, llm_error, llm_parse_error, job_not_found, unexpected_error]
          description: |
            `llm_error` means the LLM provider failed during background generation.
            `llm_parse_error` means the LLM returned invalid digest JSON.
        message:
          type: string
        details:
          type: string

    DigestGenerateResponse:
      type: object
      required:
        - digestDate
        - periodStart
        - periodEnd
        - title
        - topStorySubtitle
        - summary
        - topics
        - events
        - eventCount
        - sourceCount
        - readTimeMinutes
        - generatedAt
        - model
      properties:
        digestDate:
          type: string
          format: date
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        title:
          type: string
          example: Your Thursday AI Digest
        topStorySubtitle:
          type: string
          description: One-sentence headline for the most important new development.
        summary:
          type: string
          description: Text-based overview paragraph of what newly happened across the subscribed topics.
        topics:
          type: array
          items:
            $ref: '#/components/schemas/DigestTopic'
        events:
          type: array
          description: |
            Structured digest sections rendered as individual event blocks. Each
            event is one digest-worthy development synthesized from one or more
            selected external sources.
          items:
            $ref: '#/components/schemas/DigestEvent'
        eventCount:
          type: integer
          minimum: 0
        sourceCount:
          type: integer
          minimum: 0
          description: Number of selected external sources used for the generated digest.
        readTimeMinutes:
          type: integer
          minimum: 1
        generatedAt:
          type: string
          format: date-time
        model:
          type: string
          description: LLM model used for generation.
        usage:
          $ref: '#/components/schemas/TokenUsage'

    DigestEvent:
      type: object
      description: |
        One newly observed development in the daily digest. The frontend can render
        each event as a headline with bullets and external source links, while the
        caller can trace which subscribed topics caused the event to appear.
      required: [headline, summaryBullets, topicIds, sourceUrls]
      properties:
        headline:
          type: string
          description: Short event headline suitable for the digest post.
        summaryBullets:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
          description: Concise bullets explaining what changed and why it matters.
        topicIds:
          type: array
          description: |
            Subscribed topic IDs that this event is relevant to. GenAI validates
            the LLM-facing topic mapping before storing the job result.
          items:
            type: string
            format: uuid
        sourceUrls:
          type: array
          items:
            type: string
            format: uri
          description: External source URLs used to support this digest event.

    TokenUsage:
      type: object
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: validation_error
        message:
          type: string
          example: Request body failed schema validation.
        details:
          type: string
