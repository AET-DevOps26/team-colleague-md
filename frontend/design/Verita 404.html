<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>Verita — 404</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
<style>
  :root {
  --bg-base:      #FFFFFF;
  --bg-surface:   #F9F9F9;
  --bg-elevated:  #F0F0F0;
  --text-primary:   #0A0A0A;
  --text-secondary: #6B6B6B;
  --text-tertiary:  #ABABAB;
  --border-subtle:  #EBEBEB;
  --border-default: #D4D4D4;
  --accent:       #0A0A0A;
  --accent-hover: #333333;
  --success:      #16A34A;
  --success-bg:   #F0FDF4;
  --warning:      #CA8A04;
  --warning-bg:   #FEFCE8;
  --danger:       #DC2626;
  --danger-bg:    #FEF2F2;
  --radius-card:  10px;
  --radius-btn:   8px;
  --sidebar-w:    220px;
  --topbar-h:     56px;
  --font-sans:  "Inter", system-ui, -apple-system, sans-serif;
  --font-mono:  "JetBrains Mono", ui-monospace, monospace;
  --font-serif: "Newsreader", "Iowan Old Style", Georgia, serif;
}

  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  .page {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 48px 24px;
  }

  .card {
    width: 100%;
    max-width: 520px;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 48px 52px 44px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .kicker {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    margin: 0 0 20px;
  }

  .numeral {
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 600;
    font-size: clamp(72px, 12vw, 120px);
    line-height: 0.9;
    letter-spacing: -0.03em;
    color: var(--text-primary);
    margin: 0 0 28px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--border-subtle);
    width: 100%;
  }

  .headline {
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 500;
    font-size: 22px;
    line-height: 1.35;
    letter-spacing: -0.01em;
    color: var(--text-primary);
    margin: 0 0 10px;
  }

  .body {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-secondary);
    margin: 0 0 32px;
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: #fff;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: background 120ms ease-out;
  }
  .btn-primary:hover { background: var(--accent-hover); }

  .btn-ghost {
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    text-decoration: none;
    padding: 9px 4px;
    transition: color 120ms ease-out;
  }
  .btn-ghost:hover { color: var(--text-primary); }

  .arrow {
    width: 14px; height: 14px;
    stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    flex-shrink: 0;
  }

  .wordmark {
    margin-top: 24px;
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: -0.02em;
    color: var(--text-primary);
  }
</style>
</head>
<body>

<main class="page">
  <div class="card">
    <p class="kicker">route not found &middot; error 404</p>

    <div class="numeral">404</div>

    <h1 class="headline">This page has gone off the record.</h1>

    <p class="body">
      It may have moved, been removed, or never existed in the first place —
      much like the sources behind a poorly-cited claim.
    </p>

    <div class="actions">
      <a href="javascript:history.back()" class="btn-primary">
        <svg class="arrow" viewBox="0 0 16 16">
          <polyline points="10 3 5 8 10 13" />
        </svg>
        Go back
      </a>
      <a href="Verita Home.html" class="btn-ghost">Back to Home</a>
    </div>
  </div>

  <span class="wordmark">Verita</span>
</main>

</body>
</html>
