<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>Verita — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
<style>
  :root {
  --bg-base:      #FFFFFF;
  --bg-surface:   #F9F9F9;
  --bg-elevated:  #F0F0F0;
  --text-primary:   #0A0A0A;
  --text-secondary: #6B6B6B;
  --text-tertiary:  #ABABAB;
  --border-subtle:  #EBEBEB;
  --border-default: #D4D4D4;
  --accent:       #0A0A0A;
  --accent-hover: #333333;
  --success:      #16A34A;
  --success-bg:   #F0FDF4;
  --warning:      #CA8A04;
  --warning-bg:   #FEFCE8;
  --danger:       #DC2626;
  --danger-bg:    #FEF2F2;
  --radius-card:  10px;
  --radius-btn:   8px;
  --sidebar-w:    220px;
  --topbar-h:     56px;
  --font-sans:  "Inter", system-ui, -apple-system, sans-serif;
  --font-mono:  "JetBrains Mono", ui-monospace, monospace;
  --font-serif: "Newsreader", "Iowan Old Style", Georgia, serif;
}
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg-base); color: var(--text-primary); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  body { font-size: 13px; line-height: 1.5; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }

  /* ── Sidebar ── */
  .sidebar {
    position: sticky; top: 0; height: 100vh;
    background: var(--bg-surface);
    border-right: 1px solid var(--border-subtle);
    display: flex; flex-direction: column;
    padding: 18px 12px 14px;
  }
  .brand { display: flex; align-items: center; gap: 8px; padding: 6px 10px 22px; margin-bottom: 4px; }
  .brand-word { font-family: var(--font-serif); font-style: italic; font-weight: 500; font-size: 22px; letter-spacing: -0.02em; color: var(--text-primary); }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    position: relative;
    display: flex; align-items: center; gap: 11px;
    padding: 8px 12px; border-radius: 8px;
    color: var(--text-secondary); font-size: 13.5px; font-weight: 500;
    transition: background 120ms ease-out, color 120ms ease-out;
    cursor: pointer; width: 100%; text-align: left;
  }
  .nav-item:hover { background: var(--bg-elevated); color: var(--text-primary); }
  .nav-item.active { color: var(--text-primary); background: var(--bg-elevated); }
  .nav-item.active::before {
    content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px;
    width: 3px; background: var(--accent); border-radius: 0 2px 2px 0;
  }
  .nav-item .ico { width: 18px; height: 18px; flex-shrink: 0; stroke-width: 1.75; }
  .nav-item .badge {
    margin-left: auto; background: var(--accent); color: #fff;
    font-size: 10.5px; font-weight: 600; line-height: 1;
    padding: 3px 6px; border-radius: 999px; min-width: 16px; text-align: center;
  }
  .nav-item.disabled { color: var(--text-tertiary); cursor: default; pointer-events: none; }
  .nav-spacer { flex: 1; }

  /* Auth toggle */
  .sidebar-auth-toggle { display: flex; flex-direction: column; gap: 4px; padding: 12px 4px 0; }
  .sidebar-auth-toggle-label { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-tertiary); padding: 0 8px; }
  .sidebar-auth-toggle-row { display: flex; border: 1px solid var(--border-default); border-radius: 8px; overflow: hidden; }
  .sidebar-auth-btn { flex: 1; padding: 7px 0; font-size: 12px; font-weight: 500; color: var(--text-tertiary); background: transparent; text-align: center; transition: background 120ms ease-out, color 120ms ease-out; }
  .sidebar-auth-btn:first-child { border-right: 1px solid var(--border-default); }
  .sidebar-auth-btn.active { background: var(--accent); color: #fff; }
  .sidebar-auth-btn:not(.active):hover { background: var(--bg-elevated); color: var(--text-primary); }

  .nav-bottom { display: flex; flex-direction: column; gap: 2px; padding-top: 10px; border-top: 1px solid var(--border-subtle); margin-top: 10px; }
  .nav-cta { margin: 6px 4px 10px; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--accent); color: #fff; padding: 9px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; transition: background 120ms ease-out; }
  .nav-cta:hover { background: var(--accent-hover); }
  .nav-signin { margin: 6px 4px 10px; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--accent); color: #fff; padding: 9px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; transition: background 120ms ease-out; }
  .nav-signin:hover { background: var(--accent-hover); }

  /* ── Main ── */
  .main { min-width: 0; }
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,0.85);
    backdrop-filter: saturate(160%) blur(10px);
    -webkit-backdrop-filter: saturate(160%) blur(10px);
    border-bottom: 1px solid var(--border-subtle);
  }
  .topbar-row1 { display: flex; align-items: center; gap: 12px; padding: 14px 24px 14px 28px; }
  .search {
    flex: 1; min-width: 0; height: 44px; border-radius: 10px;
    background: var(--bg-elevated); border: 1px solid var(--border-subtle);
    display: flex; align-items: center; gap: 10px; padding: 0 14px;
    transition: border-color 120ms ease-out, box-shadow 120ms ease-out, background 120ms ease-out;
  }
  .search:focus-within { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(10,10,10,0.06); }
  .search svg { color: var(--text-tertiary); flex-shrink: 0; }
  .search input { flex: 1; background: none; border: 0; outline: 0; font: 400 13.5px var(--font-sans); color: var(--text-primary); }
  .search input::placeholder { color: var(--text-tertiary); }
  .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .avatar-btn {
    width: 44px; height: 44px; border-radius: 12px; overflow: hidden;
    background: linear-gradient(135deg, #c0a4ff 0%, #ff8a8a 45%, #ffc28a 100%);
    position: relative; border: 1px solid var(--border-subtle);
    transition: transform 160ms ease-out, box-shadow 160ms ease-out;
  }
  .avatar-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px -6px rgba(0,0,0,0.25); }
  .avatar-btn::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 30% 35%, #fff 0 7px, transparent 8px),
      radial-gradient(circle at 65% 32%, #fff 0 7px, transparent 8px),
      radial-gradient(ellipse at 50% 70%, #0a0a0a 0 9px, transparent 10px),
      linear-gradient(135deg, #c0a4ff 0%, #ff8a8a 45%, #ffc28a 100%);
  }
  .avatar-btn::after {
    content: ""; position: absolute; left: 30%; top: 35%; width: 3px; height: 3px;
    background: #0a0a0a; border-radius: 50%; box-shadow: 25px 0 0 #0a0a0a;
  }

  .signin-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 16px; border-radius: 8px;
    background: var(--accent); color: #fff;
    font-size: 13px; font-weight: 600;
    transition: background 120ms;
  }
  .signin-btn:hover { background: var(--accent-hover); }

  .tagbar {
    display: flex; align-items: center; gap: 0;
    padding: 16px 32px 14px; overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none; border-top: 1px solid var(--border-subtle);
    background: rgba(255,255,255,0.85);
  }
  .tagbar::-webkit-scrollbar { display: none; }
  .tagbar .chip { display: inline-flex; align-items: center; padding: 4px 14px; font-size: 13.5px; color: var(--text-tertiary); font-weight: 500; white-space: nowrap; transition: color 120ms ease-out; }
  .tagbar .chip:first-child { padding-left: 0; }
  .tagbar .chip:hover { color: var(--text-primary); }
  .tagbar .chip.active { color: var(--text-primary); font-weight: 600; }

  .auth-banner { display: flex; align-items: center; justify-content: space-between; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 14px 18px; margin-bottom: 20px; gap: 16px; }
  .auth-banner-text { font-size: 13px; color: var(--text-secondary); line-height: 1.45; }
  .auth-banner-text strong { color: var(--text-primary); font-weight: 600; }
  .auth-banner-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn-primary { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 7px; background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 600; transition: background 120ms; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-ghost { display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--border-default); color: var(--text-secondary); font-size: 12.5px; font-weight: 500; transition: background 120ms, color 120ms; }
  .btn-ghost:hover { background: var(--bg-elevated); color: var(--text-primary); }

  .feed-wrap { padding: 20px 32px 96px; max-width: 1600px; margin: 0 auto; }

  .refresh-fab {
    position: fixed; right: 28px; bottom: 28px; z-index: 50;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--accent); color: #fff;
    width: 52px; height: 52px; padding: 0; border-radius: 14px;
    box-shadow: 0 10px 24px -8px rgba(0,0,0,0.35), 0 2px 4px rgba(0,0,0,0.12);
    transition: transform 160ms ease-out, box-shadow 160ms ease-out, background 120ms ease-out;
  }
  .refresh-fab:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 16px 32px -10px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.14); }
  .refresh-fab svg { transition: transform 600ms cubic-bezier(0.4, 0, 0.2, 1); }
  .refresh-fab.spinning svg { transform: rotate(360deg); }

  .masonry { column-count: 4; column-gap: 14px; }
  @media (max-width: 1440px) { .masonry { column-count: 3; } }
  @media (max-width: 1024px) { .masonry { column-count: 2; } }
  @media (max-width: 768px)  { .masonry { column-count: 1; } }

  .card { break-inside: avoid; background: #fff; border: 0.5px solid var(--border-subtle); border-radius: 10px; margin: 0 0 14px; overflow: hidden; transition: transform 160ms ease-out, border-color 120ms ease-out, box-shadow 160ms ease-out; cursor: pointer; display: block; }
  .card:hover { border-color: var(--border-default); transform: translateY(-1px); box-shadow: 0 6px 20px -10px rgba(0,0,0,0.12); }
  .cover { position: relative; aspect-ratio: 3 / 2; overflow: hidden; border-bottom: 1px solid var(--border-subtle); }
  .cover .badge-tl, .cover .badge-tr { position: absolute; top: 8px; font: 600 10.5px var(--font-sans); letter-spacing: 0.02em; background: rgba(255,255,255,0.92); color: var(--text-primary); padding: 4px 8px; border-radius: 999px; backdrop-filter: blur(6px); }
  .cover .badge-tl { left: 8px; }
  .cover .badge-tr { right: 8px; }
  .cover .badge-tl.dark, .cover .badge-tr.dark { background: rgba(10,10,10,0.72); color: #fff; }
  .card-body { padding: 10px 12px 12px; }
  .card-title { font-size: 15px; font-weight: 600; line-height: 1.35; color: var(--text-primary); margin: 2px 0 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-wrap: pretty; }
  .ai-summary { display: flex; gap: 8px; font-size: 12.5px; line-height: 1.5; color: var(--text-secondary); font-style: italic; margin-bottom: 10px; }
  .ai-summary .spark { flex-shrink: 0; color: var(--text-tertiary); margin-top: 2px; }
  .ai-summary .txt { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-wrap: pretty; }
  .ai-summary.clamp-2 .txt { -webkit-line-clamp: 2; }
  .card-text-only { background: #FAF8F4; }
  .card-text-only .card-title { font-size: 15.5px; -webkit-line-clamp: 3; }
  .card-text-only .ai-summary .txt { -webkit-line-clamp: 4; }
  .pull-quote { font-family: var(--font-serif); font-style: italic; font-weight: 500; font-size: 19px; line-height: 1.3; color: var(--text-primary); letter-spacing: -0.01em; margin: 6px 0 10px; text-wrap: balance; }
  .meta-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .tag-pill { font-size: 10.5px; font-weight: 500; color: var(--text-secondary); background: var(--bg-elevated); padding: 3px 7px; border-radius: 4px; }
  .tag-pill.accent { background: var(--text-primary); color: #fff; }
  .author-row { display: flex; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px solid var(--border-subtle); margin-top: 8px; }
  .meta-tags + .author-row { margin-top: 0; }
  .author-row .av { width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg, #ccc, #888); display: grid; place-items: center; color: #fff; font-size: 9px; font-weight: 700; flex-shrink: 0; }
  .author-row .name { font-size: 12px; font-weight: 500; color: var(--text-primary); display: flex; align-items: center; gap: 4px; min-width: 0; }
  .author-row .name .verified { color: var(--accent); width: 12px; height: 12px; flex-shrink: 0; }
  .author-row .dot-sep { color: var(--text-tertiary); }
  .author-row .ago { font-size: 11.5px; color: var(--text-tertiary); }
  .author-row .likes { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .author-row .likes svg { color: var(--text-tertiary); }
  .code-preview { background: #0A0A0A; color: #F0F0F0; border-radius: 8px; font: 400 11.5px/1.55 var(--font-mono); padding: 12px 12px 14px; margin: 4px 0 10px; overflow: hidden; position: relative; }
  .code-preview::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: linear-gradient(180deg, transparent, #0A0A0A); pointer-events: none; }
  .code-preview .ln { color: #6B6B6B; display: inline-block; width: 18px; }
  .code-preview .kw { color: #c5a3ff; }
  .code-preview .st { color: #9ce0a0; }
  .code-preview .cm { color: #6B6B6B; font-style: italic; }
  .code-preview .fn { color: #f0c674; }
  .digest-card { background: #0A0A0A; color: #fff; padding: 18px 16px 14px; }
  .digest-card .label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #ababab; margin-bottom: 10px; display: inline-flex; align-items: center; gap: 6px; }
  .digest-card .label::before { content: ""; width: 6px; height: 6px; background: #fff; border-radius: 50%; box-shadow: 0 0 0 4px rgba(255,255,255,0.08); }
  .digest-card .title { font-family: var(--font-serif); font-style: italic; font-weight: 500; font-size: 22px; line-height: 1.2; letter-spacing: -0.01em; margin: 0 0 10px; text-wrap: balance; }
  .digest-card .bullets { list-style: none; padding: 0; margin: 0 0 12px; display: flex; flex-direction: column; gap: 6px; }
  .digest-card .bullets li { display: flex; gap: 7px; font-size: 12.5px; color: #d4d4d4; line-height: 1.45; text-wrap: pretty; }
  .digest-card .bullets li::before { content: "•"; flex-shrink: 0; font-size: 11px; line-height: 1.45; color: #6b6b6b; }
  .digest-card .cta { display: inline-flex; align-items: center; gap: 6px; background: #fff; color: #0A0A0A; padding: 7px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .digest-gate { background: #0A0A0A; color: #fff; padding: 18px 16px 16px; }
  .digest-gate .label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #ababab; margin-bottom: 10px; display: inline-flex; align-items: center; gap: 6px; }
  .digest-gate .label::before { content: ""; width: 6px; height: 6px; background: #fff; border-radius: 50%; box-shadow: 0 0 0 4px rgba(255,255,255,0.08); }
  .digest-gate .title { font-family: var(--font-serif); font-style: italic; font-weight: 500; font-size: 22px; line-height: 1.2; letter-spacing: -0.01em; margin: 0 0 10px; text-wrap: balance; }
  .digest-gate .teaser { font-size: 12.5px; color: #a8a8a8; line-height: 1.5; margin-bottom: 14px; }
  .digest-gate .gate-cta { display: inline-flex; align-items: center; gap: 6px; background: #fff; color: #0A0A0A; padding: 8px 14px; border-radius: 6px; font-size: 12.5px; font-weight: 600; }
  .cv { width: 100%; height: 100%; display: block; }
  .stat-card .card-body { padding: 14px 14px 12px; }
  .stat-big { font-family: var(--font-serif); font-style: italic; font-weight: 500; font-size: 56px; line-height: 1; letter-spacing: -0.03em; color: var(--text-primary); margin: 4px 0 2px; }
  .stat-sub { font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; }
  .spark-line { width: 100%; height: 36px; margin: 6px 0; }
  .thread { padding: 4px 0 4px; }
  .thread-line { display: flex; gap: 8px; padding: 6px 0; font-size: 12px; color: var(--text-secondary); line-height: 1.4; }
  .thread-line .av { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; background: linear-gradient(135deg,#aaa,#555); color: #fff; font-size: 8px; font-weight: 700; display: grid; place-items: center; }
  .thread-line .who { color: var(--text-primary); font-weight: 600; }
  .thread-more { font-size: 11.5px; color: var(--text-tertiary); padding-left: 24px; }
  .topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px; background: linear-gradient(180deg, rgba(0,0,0,0.04), transparent); opacity: 0; transition: opacity 200ms; pointer-events: none; }
  .topbar.scrolled::after { opacity: 1; }

  /* ── Settings modal ── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.28);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 500;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 160ms ease-out;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--bg-base);
    border-radius: 14px;
    border: 1px solid var(--border-subtle);
    width: 440px;
    max-width: calc(100vw - 32px);
    box-shadow: 0 24px 64px -16px rgba(0,0,0,0.18);
    transform: translateY(8px) scale(0.98);
    transition: transform 160ms ease-out;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-backdrop.open .modal { transform: translateY(0) scale(1); }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border-subtle);
    position: sticky; top: 0; background: var(--bg-base);
    border-radius: 14px 14px 0 0;
    z-index: 1;
  }
  .modal-title { font-size: 14.5px; font-weight: 600; }
  .modal-close { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; color: var(--text-tertiary); transition: background 120ms ease-out, color 120ms ease-out; }
  .modal-close:hover { background: var(--bg-elevated); color: var(--text-primary); }
  .modal-close svg { width: 16px; height: 16px; stroke-width: 2; }
  .modal-body { padding: 0 0 8px; }
  .settings-section { padding: 20px 20px 4px; }
  .settings-section + .settings-section { border-top: 1px solid var(--border-subtle); padding-top: 16px; }
  .section-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 12px; }
  .account-field { display: flex; flex-direction: column; gap: 2px; margin-bottom: 12px; }
  .account-field-label { font-size: 11.5px; font-weight: 500; color: var(--text-secondary); }
  .account-field-value { font-size: 13.5px; font-weight: 500; color: var(--text-primary); }
  .settings-link { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; margin-bottom: 4px; color: var(--text-primary); font-size: 13.5px; font-weight: 500; border-radius: 6px; transition: color 120ms ease-out; cursor: pointer; width: 100%; }
  .settings-link:hover { color: var(--accent-hover); }
  .settings-link:hover .link-arrow { color: var(--text-secondary); }
  .settings-link-text { display: flex; flex-direction: column; gap: 1px; }
  .settings-link-desc { font-size: 11.5px; font-weight: 400; color: var(--text-tertiary); }
  .link-arrow { color: var(--text-tertiary); transition: color 120ms ease-out; }
  .link-arrow svg { width: 14px; height: 14px; stroke-width: 2; display: block; }
  .freq-control { display: flex; border: 1px solid var(--border-default); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
  .freq-btn { flex: 1; padding: 8px 0; font-size: 12.5px; font-weight: 500; color: var(--text-tertiary); background: transparent; text-align: center; transition: background 120ms ease-out, color 120ms ease-out; border-right: 1px solid var(--border-default); }
  .freq-btn:last-child { border-right: 0; }
  .freq-btn.active { background: var(--accent); color: #fff; }
  .freq-btn:not(.active):hover { background: var(--bg-elevated); color: var(--text-primary); }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; gap: 16px; }
  .toggle-row + .toggle-row { border-top: 1px solid var(--border-subtle); }
  .toggle-info { display: flex; flex-direction: column; gap: 2px; }
  .toggle-label { font-size: 13.5px; font-weight: 500; color: var(--text-primary); }

// ── Card rendering ──
function renderTags(tags, max) {
  const shown = max ? tags.slice(0, max) : tags;
  return shown.map((t, i) => `<span class="tag-pill${i===0?' accent':''}">${i===0?'#':''}${t}</span>`).join('');
}

function renderAuthorRow(p) {
  const verified = p.author?.verified
    ? `<svg class="verified" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5 14.2 4l3.3-.5.8 3.2L21 9l-1.4 3 1 3.1-3 1.7-.6 3.3-3.3-.4-2.7 2-2.7-2-3.3.4L4.4 17 1.4 15l1-3.1L1 9l2.7-1.3.8-3.2L7.8 4 12 1.5z"/><path d="m8.5 12 2.5 2.5 4.5-5" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`
    : '';
  return `<div class="author-row"><span class="av">${p.author.initials}</span><span class="name">${p.author.name}${verified}</span><span class="dot-sep">·</span><span class="ago">${p.ago}</span><span class="likes"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>${p.likes.toLocaleString()}</span></div>`;
}

function renderCover(p) {
  if (!p.cover) return '';
  const badge = p.badge || {}, dark = p.cover==='terminal'||p.cover==='network'||p.cover==='orbit';
  const tl = badge.tl ? `<span class="badge-tl ${dark?'dark':''}">${badge.tl}</span>` : '';
  const tr = badge.tr ? `<span class="badge-tr ${dark?'dark':''}">${badge.tr}</span>` : '';
  return `<div class="cover">${Covers[p.cover]()}${tl}${tr}</div>`;
}

function renderCard(p) {
  if (p.type === 'digest') {
    return `<article class="card digest-card"><div class="label">Today's Digest · May 13</div><h2 class="title">${p.title}</h2><ul class="bullets">${p.bullets.map(b=>`<li>${b}</li>`).join('')}</ul><a class="cta" href="#">${p.cta}<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></article>`;
  }
  if (p.type === 'digest-gate') {
    return `<article class="card digest-gate"><div class="label">Today's Digest · May 13</div><h2 class="title">${p.title}</h2><p class="teaser">${p.teaser}</p><a class="gate-cta" href="#">Sign in to read<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></article>`;
  }
  if (p.type === 'stat') {
    return `<article class="card stat-card"><div class="card-body"><div style="font-size:11px;color:var(--text-tertiary);font-weight:600;letter-spacing:0.06em;text-transform:uppercase;">Trend</div><div class="stat-big">${p.big}</div><div class="stat-sub">${p.sub}</div><svg class="spark-line" viewBox="0 0 200 36" preserveAspectRatio="none"><polyline points="0,30 20,28 40,25 60,26 80,20 100,18 120,12 140,15 160,8 180,5 200,3" fill="none" stroke="#0a0a0a" stroke-width="1.8"/><polyline points="0,30 20,28 40,25 60,26 80,20 100,18 120,12 140,15 160,8 180,5 200,3 200,36 0,36" fill="rgba(10,10,10,0.06)" stroke="none"/></svg><div style="font-size:12px;color:var(--text-secondary);line-height:1.45;margin-bottom:8px;">${p.detail}</div><div class="meta-tags">${renderTags(p.tags)}</div><div class="author-row" style="border-top:0;padding-top:0;margin-top:0;"><span class="ago" style="margin-left:0;">${p.ago}</span></div></div></article>`;
  }

  const hasCover = !!p.cover, isTextOnly = !p.cover && !p.code, hasQuote = !!p.quote, hasThread = !!p.threadPreview;
  let body = '';
  if (p.code) {
    const ch = p.codeLines.map(l=>`<div><span class="ln">${l.ln}</span>${l.tokens.map(t=>{const k=Object.keys(t)[0]; return `<span class="${k}">${t[k]}</span>`;}).join('')}</div>`).join('');
    body += `<div class="code-preview">${ch}</div>`;
  }
  if (hasQuote) body += `<div class="pull-quote">${p.quote}</div>`;
  else if (p.title) body += `<h2 class="card-title">${p.title}</h2>`;
  if (!hasCover) {
    if (p.summary && !hasThread) body += `<div class="ai-summary${isTextOnly?' clamp-2':''}"><svg class="spark" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg><span class="txt">${p.summary}</span></div>`;
  }
  if (hasThread) {
    body += `<div class="thread">`;
    p.threadPreview.forEach(t => { body+=`<div class="thread-line"><span class="av">${t.who}</span><div><span class="who">${t.name}</span> <span class="txt">${t.txt}</span></div></div>`; });
    body += `<div class="thread-more">${p.moreThread} →</div></div>`;
  }
  if (p.tags && p.tags.length) body += `<div class="meta-tags">${renderTags(p.tags, 1)}</div>`;
  body += renderAuthorRow(p);

  return `<article class="card${isTextOnly?' card-text-only':''}">${renderCover(p)}<div class="card-body">${body}</div></article>`;
}

// ── Auth state ──
function applyAuthState() {
  const posts = isLoggedIn ? POSTS_LOGGEDIN : POSTS_LOGGEDOUT;
  document.getElementById('masonry').innerHTML = posts.map(renderCard).join('');

  document.getElementById('sidebar-cta').innerHTML = isLoggedIn
    ? `<a class="nav-cta" href="#"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>New post</a>`
    : `<a class="nav-signin" href="#"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>Sign in</a>`;

  document.getElementById('topbar-auth').innerHTML = isLoggedIn
    ? `<button class="avatar-btn" type="button" aria-label="Profile"></button>`
    : `<button class="signin-btn" type="button">Sign in</button>`;

  document.getElementById('auth-banner-slot').innerHTML = isLoggedIn
    ? ''
    : `<div class="auth-banner"><div class="auth-banner-text">Browsing as guest. <strong>Sign in</strong> to get a personalised feed, save bookmarks, and join the discussion.</div><div class="auth-banner-actions"><button class="btn-ghost" type="button">Log in</button><button class="btn-primary" type="button">Create account</button></div></div>`;

  document.getElementById('chip-first').textContent = isLoggedIn ? 'For you' : 'Trending';
  document.getElementById('digest-badge').style.display = isLoggedIn ? '' : 'none';

  document.getElementById('btn-loggedin').classList.toggle('active', isLoggedIn);
  document.getElementById('btn-loggedout').classList.toggle('active', !isLoggedIn);

  // Settings nav-item: enabled only when logged in
  const settingsBtn = document.getElementById('settings-nav-btn');
  if (isLoggedIn) {
    settingsBtn.classList.remove('disabled');
  } else {
    settingsBtn.classList.add('disabled');
    closeSettingsModal();
  }
}

document.getElementById('btn-loggedin').addEventListener('click', () => { isLoggedIn = true; applyAuthState(); });
document.getElementById('btn-loggedout').addEventListener('click', () => { isLoggedIn = false; applyAuthState(); });

// ── Settings modal ──
function openSettingsModal() {
  if (!isLoggedIn) return;
  document.getElementById('settingsModal').classList.add('open');
  document.addEventListener('keydown', handleSettingsEsc);
}

function closeSettingsModal() {
  document.getElementById('settingsModal').classList.remove('open');
  document.removeEventListener('keydown', handleSettingsEsc);
}

function handleSettingsEsc(e) {
  if (e.key === 'Escape') closeSettingsModal();
}

function handleBackdropClick(e) {
  if (e.target === document.getElementById('settingsModal')) closeSettingsModal();
}

// Digest frequency
let currentFreq = 'daily';
function setFreq(val) {
  if (currentFreq === val) return;
  document.getElementById('freq-' + currentFreq).classList.remove('active');
  document.getElementById('freq-' + val).classList.add('active');
  currentFreq = val;
}

// Settings navigation links
function navigateSettings(dest) {
  const labels = { 'user-profile': 'User Profile', 'digest-management': 'Digest Management' };
  const btn = event.currentTarget;
  const nameEl = btn.querySelector('.settings-link-text span:first-child');
  const orig = nameEl.textContent;
  nameEl.textContent = '→ ' + labels[dest] + '…';
  setTimeout(() => { nameEl.textContent = orig; }, 1200);
}

// ── Refresh FAB ──
const fab = document.getElementById('refresh-fab');
fab.addEventListener('click', () => {
  fab.classList.add('spinning');
  const posts = isLoggedIn ? POSTS_LOGGEDIN : POSTS_LOGGEDOUT;
  const shuffled = posts.slice().sort(() => Math.random() - 0.5);
  setTimeout(() => { document.getElementById('masonry').innerHTML = shuffled.map(renderCard).join(''); window.scrollTo({top:0,behavior:'smooth'}); }, 250);
  setTimeout(() => fab.classList.remove('spinning'), 700);
});

// ── Topbar scroll shadow ──
const topbar = document.getElementById('topbar');
window.addEventListener('scroll', () => { topbar.classList.toggle('scrolled', window.scrollY > 6); });

// ── Tag chips ──
document.querySelectorAll('.tagbar .chip').forEach(c => {
  c.addEventListener('click', () => { document.querySelectorAll('.tagbar .chip').forEach(x => x.classList.remove('active')); c.classList.add('active'); });
});

applyAuthState();
</script>
