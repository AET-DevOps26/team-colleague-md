<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verita — Auth Modal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-base: #FFFFFF;
    --bg-surface: #F9F9F9;
    --bg-elevated: #F0F0F0;
    --text-primary: #0A0A0A;
    --text-secondary: #6B6B6B;
    --text-tertiary: #ABABAB;
    --border-subtle: #EBEBEB;
    --border-default: #D4D4D4;
    --accent: #0A0A0A;
    --accent-hover: #333333;
    --success: #16A34A;
    --warning: #CA8A04;
    --danger:  #DC2626;
    --font-sans:  "Inter", system-ui, -apple-system, sans-serif;
    --font-mono:  "JetBrains Mono", ui-monospace, monospace;
    --font-serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #f4f4f4;
    color: var(--text-primary); font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  input { font-family: inherit; }

  @keyframes caret {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="auth-modal.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const { useEffect } = React;

    function Frame({ children }) {
      return (
        <Scene>
          <ModalShell>{children}</ModalShell>
        </Scene>
      );
    }

    function App() {
      return (
        <DesignCanvas title="Verita · Auth Modal" subtitle="AUTH-01 / AUTH-02 · global modal overlay">
          <DCSection id="primary" title="Primary states (per spec)">
            <DCArtboard id="ab-login" label="Log in — default" width={680} height={720}>
              <Frame><LoginPanel /></Frame>
            </DCArtboard>

            <DCArtboard id="ab-signup" label="Sign up — default" width={680} height={780}>
              <Frame><SignupPanel /></Frame>
            </DCArtboard>

            <DCArtboard id="ab-login-error" label="Log in — invalid credentials" width={680} height={720}>
              <Frame><LoginPanel error="Email or password is incorrect" /></Frame>
            </DCArtboard>

            <DCArtboard id="ab-signup-error" label="Sign up — username taken" width={680} height={780}>
              <Frame><SignupPanel usernameError="That username is already taken" /></Frame>
            </DCArtboard>
          </DCSection>

          <DCSection id="optional" title="Optional panels (forgot password · email verify)">
            <DCArtboard id="ab-forgot" label="Forgot password" width={680} height={720}>
              <Frame><ForgotPanel /></Frame>
            </DCArtboard>

            <DCArtboard id="ab-sent" label="Reset link sent" width={680} height={720}>
              <Frame><SentPanel /></Frame>
            </DCArtboard>

            <DCArtboard id="ab-otp" label="Verify email — OTP" width={680} height={720}>
              <Frame><OtpPanel /></Frame>
            </DCArtboard>
          </DCSection>

          <DCSection id="alt" title="Alt visual — serif headline treatment">
            <DCArtboard id="ab-alt-login" label="Alt · Log in" width={680} height={780}>
              <Frame><LoginPanelAlt /></Frame>
            </DCArtboard>

            <DCArtboard id="ab-alt-signup" label="Alt · Sign up" width={680} height={820}>
              <Frame><SignupPanelAlt /></Frame>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
