<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>Verita — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../tokens/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg-base); color: var(--text-primary); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  body { font-size: 13px; line-height: 1.5; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  .app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }

  .sidebar {
    position: sticky; top: 0; height: 100vh;
    background: var(--bg-surface);
    border-right: 1px solid var(--border-subtle);
    display: flex; flex-direction: column;
    padding: 0 14px 16px;
  }
  .brand { display: flex; align-items: flex-end; justify-content: center; gap: 1px; height: 88px; padding: 0 0 16px; margin: 0; }
  .brand-word { font-family: var(--font-serif); font-style: italic; font-weight: 500; font-size: 32px; letter-spacing: -0.025em; color: var(--text-primary); line-height: 1; }
  .brand-word .lead { font-size: 38px; font-weight: 600; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    position: relative;
    display: flex; align-items: center; gap: 13px;
    padding: 16px 14px; border-radius: 8px;
    color: var(--text-secondary); font-size: 15px; font-weight: 500;
    transition: background 120ms ease-out, color 120ms ease-out;
    cursor: pointer; width: 100%; text-align: left;
  }
  .nav-item:hover { background: var(--bg-elevated); color: var(--text-primary); }
  .nav-item.active { color: var(--text-primary); background: var(--bg-elevated); }
  .nav-item.active::before {
    content: ""; position: absolute; left: -14px; top: 10px; bottom: 10px;
    width: 3px; background: var(--accent); border-radius: 0 2px 2px 0;
  }
  .nav-item .ico { width: 24px; height: 24px; flex-shrink: 0; stroke-width: 1.75; }
  .nav-item .badge {
    margin-left: auto; background: var(--accent); color: #fff;
    font-size: 10.5px; font-weight: 600; line-height: 1;
    padding: 3px 6px; border-radius: 999px; min-width: 16px; text-align: center;
  }
  .nav-spacer { flex: 1; }
  .nav-item.disabled { opacity: 0.38; pointer-events: none; cursor: default; }

  /* Auth toggle — lives in the sidebar spacer area */
  .sidebar-auth-toggle {
    display: flex; flex-direction: column; gap: 4px;
    padding: 12px 4px 0;
  }
  .sidebar-auth-toggle-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-tertiary); padding: 0 8px;
  }
  .sidebar-auth-toggle-row {
    display: flex; border: 1px solid var(--border-default); border-radius: 8px; overflow: hidden;
  }
  .sidebar-auth-btn {
    flex: 1; padding: 7px 0; font-size: 12px; font-weight: 500; color: var(--text-tertiary);
    background: transparent; text-align: center;
    transition: background 120ms ease-out, color 120ms ease-out;
  }
  .sidebar-auth-btn:first-child { border-right: 1px solid var(--border-default); }
  .sidebar-auth-btn.active { background: var(--accent); color: #fff; }
  .sidebar-auth-btn:not(.active):hover { background: var(--bg-elevated); color: var(--text-primary); }

  .nav-bottom { display: flex; flex-direction: column; gap: 2px; padding-top: 10px; border-top: 1px solid var(--border-subtle); margin-top: 10px; }

  /* New post CTA (logged-in) */
  .nav-cta {
    margin: 6px 4px 10px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--accent); color: #fff;
    padding: 9px 12px; border-radius: 8px;
    font-size: 13px; font-weight: 600;
    transition: background 120ms ease-out;
  }
  .nav-cta:hover { background: var(--accent-hover); }

  /* Sign-in CTA (logged-out) — black background matching v3 */
  .nav-signin {
    margin: 6px 4px 10px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--accent); color: #fff;
    padding: 9px 12px; border-radius: 8px;
    font-size: 13px; font-weight: 600;
    transition: background 120ms ease-out;
  }
  .nav-signin:hover { background: var(--accent-hover); }

  .main { min-width: 0; }
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,0.85);
    backdrop-filter: saturate(160%) blur(10px);
    -webkit-backdrop-filter: saturate(160%) blur(10px);
    border-bottom: 1px solid var(--border-subtle);
  }
  .topbar-row1 { display: flex; align-items: center; gap: 12px; padding: 14px 24px 14px 28px; }
  .search {
    flex: 1; min-width: 0; height: 44px; border-radius: 10px;
    background: var(--bg-elevated); border: 1px solid var(--border-subtle);
    display: flex; align-items: center; gap: 10px; padding: 0 14px;
    transition: border-color 120ms ease-out, box-shadow 120ms ease-out, background 120ms ease-out;
  }
  .search:focus-within { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(10,10,10,0.06); }
  .search svg { color: var(--text-tertiary); flex-shrink: 0; }
  .search input { flex: 1; background: none; border: 0; outline: 0; font: 400 13.5px var(--font-sans); color: var(--text-primary); }
  .search input::placeholder { color: var(--text-tertiary); }
  .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  /* Avatar */
  .avatar-btn {
    width: 44px; height: 44px; border-radius: 12px; overflow: hidden;
    background: linear-gradient(135deg, #c0a4ff 0%, #ff8a8a 45%, #ffc28a 100%);
    position: relative; border: 1px solid var(--border-subtle);
    transition: transform 160ms ease-out, box-shadow 160ms ease-out;
  }
  .avatar-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px -6px rgba(0,0,0,0.25); }
  .avatar-btn::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 30% 35%, #fff 0 7px, transparent 8px),
      radial-gradient(circle at 65% 32%, #fff 0 7px, transparent 8px),
      radial-gradient(ellipse at 50% 70%, #0a0a0a 0 9px, transparent 10px),
      linear-gradient(135deg, #c0a4ff 0%, #ff8a8a 45%, #ffc28a 100%);
  }
  .avatar-btn::after {
    content: ""; position: absolute; left: 30%; top: 35%; width: 3px; height: 3px;
    background: #0a0a0a; border-radius: 50%; box-shadow: 25px 0 0 #0a0a0a;
  }

  /* Sign-in button (topbar, logged-out) */
  .signin-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 16px; border-radius: 8px;
    background: var(--accent); color: #fff;
    font-size: 13px; font-weight: 600;
    transition: background 120ms;
  }
  .signin-btn:hover { background: var(--accent-hover); }

  /* Tagbar */
  .tagbar {
    display: flex; align-items: center; gap: 0;
    padding: 16px 32px 14px; overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none; border-top: 1px solid var(--border-subtle);
    background: rgba(255,255,255,0.85);
  }
  .tagbar::-webkit-scrollbar { display: none; }
  .tagbar .chip {
    display: inline-flex; align-items: center; padding: 4px 14px;
    font-size: 13.5px; color: var(--text-tertiary); font-weight: 500;
    white-space: nowrap; transition: color 120ms ease-out;
  }
  .tagbar .chip:first-child { padding-left: 0; }
  .tagbar .chip:hover { color: var(--text-primary); }
  .tagbar .chip.active { color: var(--text-primary); font-weight: 600; }

  /* Auth banner (v3 style — inside feed-wrap, rounded card) */
  .auth-banner {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 20px;
    gap: 16px;
  }
  .auth-banner-text { font-size: 13px; color: var(--text-secondary); line-height: 1.45; }
  .auth-banner-text strong { color: var(--text-primary); font-weight: 600; }
  .auth-banner-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 6px;
    height: 34px; padding: 0 14px; border-radius: 7px;
    background: var(--accent); color: #fff;
    font-size: 12.5px; font-weight: 600; transition: background 120ms;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-ghost {
    display: inline-flex; align-items: center;
    height: 34px; padding: 0 14px; border-radius: 7px;
    border: 1px solid var(--border-default);
    color: var(--text-secondary); font-size: 12.5px; font-weight: 500;
    transition: background 120ms, color 120ms;
  }
  .btn-ghost:hover { background: var(--bg-elevated); color: var(--text-primary); }

  .feed-wrap { padding: 20px clamp(24px, 4vw, 80px) 96px; max-width: 1920px; margin: 0 auto; }

  .refresh-fab {
    position: fixed; right: 28px; bottom: 28px; z-index: 50;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--accent); color: #fff;
    width: 52px; height: 52px; padding: 0; border-radius: 14px;
    box-shadow: 0 10px 24px -8px rgba(0,0,0,0.35), 0 2px 4px rgba(0,0,0,0.12);
    transition: transform 160ms ease-out, box-shadow 160ms ease-out, background 120ms ease-out;
  }
  .refresh-fab:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 16px 32px -10px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.14); }
  .refresh-fab svg { transition: transform 600ms cubic-bezier(0.4, 0, 0.2, 1); }
  .refresh-fab.spinning svg { transform: rotate(360deg); }

  /* True masonry via CSS columns — short text cards hug content, no row-stretch voids */
  .masonry { column-count: 3; column-gap: 32px; max-width: 1144px; margin: 0 auto; }
  @media (max-width: 1143px) { .masonry { column-count: 2; column-gap: 28px; max-width: 760px; } }
  @media (max-width: 760px)  { .masonry { column-count: 1; max-width: 480px; } }

  .card {
    break-inside: avoid; -webkit-column-break-inside: avoid; page-break-inside: avoid;
    display: inline-block; width: 100%;
    margin: 0 0 24px;
    transition: transform 160ms ease-out;
    cursor: pointer;
  }
  .card:hover { transform: translateY(-1px); }
  /* Option 3 — frameless everywhere. Image cards = standalone rounded photo + plain title.
     Text cards = serif italic editorial treatment, no cream block. Differentiation by typography, not chrome. */
  .card:not(.is-text):not(.digest-card) { transition: transform 160ms ease-out; }
  .card:not(.is-text):not(.digest-card):hover .cover { box-shadow: 0 8px 24px -14px rgba(0,0,0,0.16); }
  .card.is-text { transition: transform 160ms ease-out; }

  /* Subtle organic offset — first card in every triplet drops a beat (works inside CSS columns) */
  @media (min-width: 1144px) {
    .masonry > .card:nth-child(5n+2) { margin-top: 10px; }
    .masonry > .card:nth-child(7n+4) { margin-top: 16px; }
  }

  .cover { position: relative; aspect-ratio: 16 / 10; overflow: hidden; border-radius: 12px; transition: box-shadow 220ms ease-out; }
  .cover > svg, .cover > img { display: block; width: 100%; height: 100%; }
  .cover .badge-tl, .cover .badge-tr {
    position: absolute; top: 12px;
    font: 600 11px var(--font-sans); letter-spacing: 0.02em;
    background: rgba(255,255,255,0.92); color: var(--text-primary);
    padding: 5px 10px; border-radius: 999px; backdrop-filter: blur(6px);
  }
  .cover .badge-tl { left: 12px; }
  .cover .badge-tr { right: 12px; }
  .cover .badge-tl.dark, .cover .badge-tr.dark { background: rgba(10,10,10,0.72); color: #fff; }

  .card-body { padding: 12px 8px 4px; }
  .card.is-text .card-body { padding: 12px 8px 4px; }
  .card-title {
    font-size: 16px; font-weight: 700; line-height: 1.3; color: var(--text-primary);
    letter-spacing: -0.018em;
    margin: 0 0 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
    text-wrap: pretty;
    hyphens: auto;
    -webkit-hyphens: auto;
    hyphenate-limit-chars: 8 4 3;
  }
  .meta-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .tag-pill { font-size: 10.5px; font-weight: 500; color: var(--text-secondary); background: var(--bg-elevated); padding: 3px 7px; border-radius: 4px; }
  .tag-pill.accent { background: var(--text-primary); color: #fff; }
  .author-row { display: flex; align-items: center; gap: 8px; padding-top: 0; margin-top: 0; }
  .card.is-text .author-row { padding-top: 0; margin-top: 0; }
  .meta-tags + .author-row { margin-top: 0; }
  .author-row .av { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, #ccc, #888); display: grid; place-items: center; color: #fff; font-size: 9.5px; font-weight: 700; flex-shrink: 0; }
  .author-row .name { font-size: 12.5px; font-weight: 500; color: var(--text-primary); display: flex; align-items: center; gap: 5px; min-width: 0; }
  .author-row .name .verified { color: var(--accent); width: 12px; height: 12px; flex-shrink: 0; }
  .author-row .dot-sep { color: var(--text-tertiary); font-size: 11.5px; }
  .author-row .ago { font-size: 11.5px; color: var(--text-tertiary); }
  .author-row .likes { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; font-weight: 500; }
  .author-row .likes svg { color: var(--text-tertiary); width: 13px; height: 13px; }
  /* Text-only card — cream block functions as the "cover" holding eyebrow + quote.
     Title + author row sit BELOW the block as bare text — exact parity with image cards. */
  .card-text {
    position: relative;
    background: oklch(97% 0.012 80);
    border-radius: 12px;
    padding: 14px 28px 14px 16px;
    overflow: hidden;
    transition: box-shadow 220ms ease-out;
  }
  .card.is-text:hover .card-text { box-shadow: 0 8px 24px -14px rgba(0,0,0,0.12); }
  .card-text .eyebrow {
    font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-secondary); margin: 0 0 10px;
    display: inline-flex; align-items: center; gap: 0;
  }
  .card-text .eyebrow::before { content: none; }
  .card-text .pull-quote {
    font-family: var(--font-serif); font-style: italic; font-weight: 500; font-size: 16px; line-height: 1.7;
    color: var(--text-primary); border-left: 2px solid var(--border-default);
    padding-left: 12px; margin: 0;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    text-wrap: pretty;
  }
  .card-text .pull-quote.is-short { -webkit-line-clamp: 3; }

  .digest-card { background: #0A0A0A; color: #fff; padding: 24px 26px 20px; border-radius: 12px; aspect-ratio: 5 / 6; display: flex; flex-direction: column; }
  /* no overflow:hidden — let content grow past the aspect-ratio when narrow widths force bullets to wrap */
  .digest-card-link { display: flex; flex-direction: column; flex: 1; color: inherit; text-decoration: none; }
  .digest-card-link:hover .cta { color: #fff; }
  .digest-card-link:hover .cta-arrow { transform: translateX(3px); }
  .digest-card .label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #ababab; margin-bottom: 6px; display: inline-flex; align-items: center; gap: 6px; }
  .digest-card .label::before { content: ""; width: 6px; height: 6px; background: #fff; border-radius: 50%; box-shadow: 0 0 0 4px rgba(255,255,255,0.08); }
  .digest-card .sublabel { font-size: 11px; color: #6b6b6b; margin: 0 0 14px; font-variant-numeric: tabular-nums; }
  .digest-card .title { font-family: var(--font-serif); font-style: italic; font-weight: 500; font-size: 22px; line-height: 1.22; letter-spacing: -0.01em; margin: 0 0 14px; text-wrap: balance; padding-right: 8px; }
  .digest-card .divider { height: 1px; background: rgba(255,255,255,0.08); margin: 0 0 14px; }
  .digest-card .bullets { list-style: none; padding: 0; margin: 0 0 18px; display: flex; flex-direction: column; gap: 8px; }
  .digest-card .bullets li { display: flex; gap: 9px; font-size: 12.5px; color: #d4d4d4; line-height: 1.5; text-wrap: pretty; padding-right: 6px; }
  .digest-card .bullets li::before { content: "•"; flex-shrink: 0; font-size: 12px; line-height: 1.5; color: #6b6b6b; }
  .digest-card .cta { display: inline-flex; align-items: center; gap: 8px; color: #ababab; padding: 12px 0 0; border-top: 1px solid rgba(255,255,255,0.08); font-size: 12px; font-weight: 500; letter-spacing: 0.02em; margin-top: auto; transition: color 200ms; }
  .digest-card .cta-arrow { transition: transform 200ms; display: inline-flex; }
  .topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px; background: linear-gradient(180deg, rgba(0,0,0,0.04), transparent); opacity: 0; transition: opacity 200ms; pointer-events: none; }
  .topbar.scrolled::after { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="brand" href="#" aria-label="Verita"><div class="brand-word"><span class="lead">V</span>erita</div></a>
    <nav class="nav" aria-label="Primary">
      <button class="nav-item active" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m14.5 9.5-2 5-5 2 2-5 5-2z" fill="currentColor" stroke="none"/></svg>
        Explore
      </button>
      <button class="nav-item" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>
        Digest
        <span class="badge" id="digest-badge">3</span>
      </button>
    </nav>
    <div class="nav-spacer">
      <!-- Auth state toggle -->
      <div class="sidebar-auth-toggle">
        <span class="sidebar-auth-toggle-label">Preview state</span>
        <div class="sidebar-auth-toggle-row" role="group" aria-label="Auth state">
          <button class="sidebar-auth-btn" id="btn-loggedout" type="button">Logged out</button>
          <button class="sidebar-auth-btn" id="btn-loggedin" type="button">Logged in</button>
        </div>
      </div>
    </div>
    <div id="sidebar-cta"></div>
    <div class="nav-bottom">
      <button class="nav-item" id="settings-nav-item" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Settings
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar" id="topbar">
      <div class="topbar-row1">
        <div class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="text" placeholder="Search Verita — papers, people, tags, ideas…" />
        </div>
        <div class="topbar-right">
          <div id="topbar-auth"></div>
        </div>
      </div>
      <div class="tagbar" id="tagbar">
        <button class="chip active" id="chip-first" type="button">For you</button>
        <button class="chip" type="button">alignment</button>
        <button class="chip" type="button">agents</button>
        <button class="chip" type="button">mech-interp</button>
        <button class="chip" type="button">rag</button>
        <button class="chip" type="button">eval</button>
        <button class="chip" type="button">reasoning</button>
        <button class="chip" type="button">open-source</button>
      </div>
    </header>
    <section class="feed-wrap">
      <div id="auth-banner-slot"></div>
      <div class="masonry" id="masonry"></div>
    </section>
  </main>
</div>

<button class="refresh-fab" id="refresh-fab" type="button" aria-label="Refresh feed">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/><path d="M3 21v-5h5"/></svg>
</button>

function renderTags(tags, max) {
  const shown = max ? tags.slice(0, max) : tags;
  return shown.map((t, i) => `<span class="tag-pill${i===0?' accent':''}">${i===0?'#':''}${t}</span>`).join('');
}

  return `<div class="author-row"><span class="av">${p.author.initials}</span><span class="name">${p.author.name}${verified}</span><span class="dot-sep">·</span><span class="ago">${p.ago}</span><span class="likes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>${p.likes.toLocaleString()}</span></div>`;

function renderCover(p) {
  if (!p.cover) return '';
  const badge = p.badge || {}, dark = p.cover==='network'||p.cover==='orbit';
  const tl = badge.tl ? `<span class="badge-tl ${dark?'dark':''}">${badge.tl}</span>` : '';
  const tr = badge.tr ? `<span class="badge-tr ${dark?'dark':''}">${badge.tr}</span>` : '';
  return `<div class="cover">${Covers[p.cover]()}${tl}${tr}</div>`;
}

function renderCard(p, i) {
  if (p.type === 'digest') {
    return `<article class="card digest-card"><a class="digest-card-link" href="#"><div class="label">${p.label || "Today's Digest · May 13"}</div>${p.sublabel ? `<div class="sublabel">${p.sublabel}</div>` : ''}<h2 class="title">${p.title}</h2><div class="divider"></div><ul class="bullets">${p.bullets.map(b=>`<li>${b}</li>`).join('')}</ul><div class="cta"><span>${p.cta}</span><span class="cta-arrow"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span></div></a></article>`;
  }

  if (p.type === 'text') {
    const eyebrow = (p.tags && p.tags[0]) ? p.tags[0] : 'Essay';
    const quoteCls = (p.quote && p.quote.length < 110) ? 'pull-quote is-short' : 'pull-quote';
    return `<article class="card is-text"><div class="card-text"><div class="eyebrow">${eyebrow}</div><blockquote class="${quoteCls}">${p.quote}</blockquote></div><div class="card-body"><h2 class="card-title">${p.title}</h2>${renderAuthorRow(p)}</div></article>`;
  }

  let body = `<h2 class="card-title">${p.title}</h2>`;
  body += renderAuthorRow(p);

  return `<article class="card">${renderCover(p)}<div class="card-body">${body}</div></article>`;
}

function applyAuthState() {
  const posts = isLoggedIn ? POSTS_LOGGEDIN : POSTS_LOGGEDOUT;
  document.getElementById('masonry').innerHTML = posts.map(renderCard).join('');

  document.getElementById('sidebar-cta').innerHTML = isLoggedIn
    ? `<a class="nav-cta" href="#"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>New post</a>`
    : `<a class="nav-signin" href="#"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>Sign in</a>`;

  document.getElementById('topbar-auth').innerHTML = isLoggedIn
    ? `<button class="avatar-btn" type="button" aria-label="Profile"></button>`
    : `<button class="signin-btn" type="button">Sign in</button>`;

  document.getElementById('auth-banner-slot').innerHTML = isLoggedIn
    ? ''
    : `<div class="auth-banner"><div class="auth-banner-text">Browsing as guest. <strong>Sign in</strong> to get a personalised feed, save bookmarks, and join the discussion.</div><div class="auth-banner-actions"><button class="btn-ghost" type="button">Log in</button><button class="btn-primary" type="button">Create account</button></div></div>`;

  document.getElementById('chip-first').textContent = isLoggedIn ? 'For you' : 'Trending';
  document.getElementById('digest-badge').style.display = isLoggedIn ? '' : 'none';

  document.getElementById('btn-loggedin').classList.toggle('active', isLoggedIn);
  document.getElementById('btn-loggedout').classList.toggle('active', !isLoggedIn);

  document.getElementById('settings-nav-item').classList.toggle('disabled', !isLoggedIn);
}

document.getElementById('btn-loggedin').addEventListener('click', () => { isLoggedIn = true; try { localStorage.setItem('verita.auth', 'signed-in'); } catch (e) {} applyAuthState(); });
document.getElementById('btn-loggedout').addEventListener('click', () => { isLoggedIn = false; try { localStorage.setItem('verita.auth', 'signed-out'); } catch (e) {} applyAuthState(); });

const fab = document.getElementById('refresh-fab');
fab.addEventListener('click', () => {
  fab.classList.add('spinning');
  const posts = isLoggedIn ? POSTS_LOGGEDIN : POSTS_LOGGEDOUT;
  const shuffled = posts.slice().sort(() => Math.random() - 0.5);
  setTimeout(() => { document.getElementById('masonry').innerHTML = shuffled.map(renderCard).join(''); window.scrollTo({top:0,behavior:'smooth'}); }, 250);
  setTimeout(() => fab.classList.remove('spinning'), 700);
});

const topbar = document.getElementById('topbar');
window.addEventListener('scroll', () => { topbar.classList.toggle('scrolled', window.scrollY > 6); });

document.querySelectorAll('.tagbar .chip').forEach(c => {
  c.addEventListener('click', () => { document.querySelectorAll('.tagbar .chip').forEach(x => x.classList.remove('active')); c.classList.add('active'); });
});

applyAuthState();

// ── Demo navigation intercept ──
(function() {
  function nav(page) {
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'verita-navigate', page }, '*');
    } else {
      window.location.href = page;
    }
  }

  document.addEventListener('click', function(e) {
    const el = e.target.closest('a, button');
    if (!el) return;

    // Brand → Home
    if (el.closest('.brand')) { e.preventDefault(); nav('Verita Home.html'); return; }

    // Sidebar nav items
    const navItem = el.closest('.nav-item');
    if (navItem) {
      const label = navItem.textContent.trim().toLowerCase();
      if (label.startsWith('explore')) { e.preventDefault(); nav('Verita Home.html'); return; }
      if (label.startsWith('digest')) { e.preventDefault(); nav('Verita Digest Management.html'); return; }
      if (label.startsWith('settings')) { e.preventDefault(); nav('Verita Settings.html'); return; }
    }

    // Sign in buttons → Auth modal
    if (el.classList.contains('nav-signin') || el.closest('.nav-signin')) { e.preventDefault(); nav('Verita Auth.html'); return; }
    if (el.classList.contains('signin-btn') || el.closest('.signin-btn')) { e.preventDefault(); nav('Verita Auth.html'); return; }
    if (el.classList.contains('btn-ghost') || el.classList.contains('btn-primary')) {
      const banner = el.closest('.auth-banner');
      if (banner) { e.preventDefault(); nav('Verita Auth.html'); return; }
    }

    // New Post CTA
    if (el.closest('.nav-cta')) { e.preventDefault(); nav('Verita Post Editor.html'); return; }

    // Avatar / profile
    if (el.closest('.avatar-btn')) { e.preventDefault(); nav('Verita User Profile.html'); return; }

    // Digest card → Digest Post
    if (el.closest('.digest-card')) { e.preventDefault(); nav('Verita Digest Post.html'); return; }

    // Article cards → Post Detail
    if (el.closest('.card') && !el.closest('.tag-pill') && !el.closest('.author-row')) {
      e.preventDefault(); nav('Verita Post Detail.html'); return;
    }
  }, true);

  // Search bar → Search Results
  const searchInput = document.querySelector('.search input');
  if (searchInput) {
    searchInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && this.value.trim()) nav('Verita Search Results.html');
    });
    searchInput.closest('.search')?.addEventListener('click', function() {
      // clicking the search area focuses it; pressing enter navigates
    });
  }
})();
</script>
</body>
</html>
