<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>Verita — Search Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../tokens/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg-base); color: var(--text-primary); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  body { font-size: 13px; line-height: 1.5; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  .app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }

  /* ── Sidebar ── */
  .sidebar {
    position: sticky; top: 0; height: 100vh;
    background: var(--bg-surface);
    border-right: 1px solid var(--border-subtle);
    display: flex; flex-direction: column;
    padding: 0 14px 16px;
  }
  .brand {
    display: flex; align-items: flex-end; justify-content: center; gap: 1px;
    height: 88px; padding: 0 0 16px; margin: 0;
    white-space: nowrap; overflow: hidden;
  }
  .brand-word { font-family: var(--font-serif); font-style: italic; font-weight: 500; font-size: 32px; letter-spacing: -0.025em; color: var(--text-primary); line-height: 1; }
  .brand-word .lead { font-size: 38px; font-weight: 600; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    position: relative;
    display: flex; align-items: center; gap: 13px;
    padding: 16px 14px; border-radius: 8px;
    color: var(--text-secondary); font-size: 15px; font-weight: 500;
    transition: background 120ms ease-out, color 120ms ease-out;
    cursor: pointer; width: 100%; text-align: left;
  }
  .nav-item:hover { background: var(--bg-elevated); color: var(--text-primary); }
  .nav-item.active { color: var(--text-primary); background: var(--bg-elevated); }
  .nav-item.active::before {
    content: ""; position: absolute; left: -14px; top: 10px; bottom: 10px;
    width: 3px; background: var(--accent); border-radius: 0 2px 2px 0;
  }
  .nav-item .ico { width: 24px; height: 24px; flex-shrink: 0; stroke-width: 1.75; }
  .nav-item .badge {
    margin-left: auto; background: var(--accent); color: #fff;
    font-size: 10.5px; font-weight: 600; line-height: 1;
    padding: 3px 6px; border-radius: 999px; min-width: 16px; text-align: center;
  }
  .nav-item.disabled { opacity: 0.38; pointer-events: none; cursor: default; }
  .nav-spacer { flex: 1; }

  /* Sidebar toggles */
  .sidebar-toggle-group { display: flex; flex-direction: column; gap: 4px; padding: 12px 4px 0; }
  .sidebar-toggle-label { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-tertiary); padding: 0 8px; }
  .sidebar-toggle-row { display: flex; border: 1px solid var(--border-default); border-radius: 8px; overflow: hidden; }
  .sidebar-toggle-btn { flex: 1; padding: 7px 0; font-size: 12px; font-weight: 500; color: var(--text-tertiary); background: transparent; text-align: center; transition: background 120ms ease-out, color 120ms ease-out; }
  .sidebar-toggle-btn:not(:last-child) { border-right: 1px solid var(--border-default); }
  .sidebar-toggle-btn.active { background: var(--accent); color: #fff; }
  .sidebar-toggle-btn:not(.active):hover { background: var(--bg-elevated); color: var(--text-primary); }

  .nav-bottom { display: flex; flex-direction: column; gap: 2px; padding-top: 10px; border-top: 1px solid var(--border-subtle); margin-top: 10px; }
  .nav-cta { margin: 6px 4px 10px; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--accent); color: #fff; padding: 9px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; transition: background 120ms ease-out; }
  .nav-cta:hover { background: var(--accent-hover); }
  .nav-signin { margin: 6px 4px 10px; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--accent); color: #fff; padding: 9px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; transition: background 120ms ease-out; }
  .nav-signin:hover { background: var(--accent-hover); }

  /* ── Main ── */
  .main { min-width: 0; }
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,0.85);
    backdrop-filter: saturate(160%) blur(10px);
    -webkit-backdrop-filter: saturate(160%) blur(10px);
    border-bottom: 1px solid var(--border-subtle);
  }
  .topbar-row1 { display: flex; align-items: center; gap: 12px; padding: 14px 24px 14px 28px; }
  .search {
    flex: 1; min-width: 0; height: 44px; border-radius: 10px;
    background: var(--bg-elevated); border: 1px solid var(--border-subtle);
    display: flex; align-items: center; gap: 10px; padding: 0 14px;
    transition: border-color 120ms ease-out, box-shadow 120ms ease-out, background 120ms ease-out;
  }
  .search:focus-within { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(10,10,10,0.06); }
  .search svg { color: var(--text-tertiary); flex-shrink: 0; }
  .search input { flex: 1; background: none; border: 0; outline: 0; font: 400 13.5px var(--font-sans); color: var(--text-primary); }
  .search input::placeholder { color: var(--text-tertiary); }
  .search-clear {
    display: flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--border-default); color: var(--text-secondary);
    flex-shrink: 0; transition: background 120ms ease-out, color 120ms ease-out;
  }
  .search-clear:hover { background: var(--text-secondary); color: #fff; }
  .search-clear svg { width: 10px; height: 10px; stroke-width: 2.5; }
  .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .avatar-btn {
    width: 44px; height: 44px; border-radius: 12px; overflow: hidden;
    background: linear-gradient(135deg, #c0a4ff 0%, #ff8a8a 45%, #ffc28a 100%);
    position: relative; border: 1px solid var(--border-subtle);
    transition: transform 160ms ease-out, box-shadow 160ms ease-out;
  }
  .avatar-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px -6px rgba(0,0,0,0.25); }
  .avatar-btn::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 30% 35%, #fff 0 7px, transparent 8px),
      radial-gradient(circle at 65% 32%, #fff 0 7px, transparent 8px),
      radial-gradient(ellipse at 50% 70%, #0a0a0a 0 9px, transparent 10px),
      linear-gradient(135deg, #c0a4ff 0%, #ff8a8a 45%, #ffc28a 100%);
  }
  .avatar-btn::after {
    content: ""; position: absolute; left: 30%; top: 35%; width: 3px; height: 3px;
    background: #0a0a0a; border-radius: 50%; box-shadow: 25px 0 0 #0a0a0a;
  }

  .signin-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 16px; border-radius: 8px;
    background: var(--accent); color: #fff;
    font-size: 13px; font-weight: 600;
    transition: background 120ms;
  }
  .signin-btn:hover { background: var(--accent-hover); }

  .auth-banner { display: flex; align-items: center; justify-content: space-between; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 14px 18px; margin-bottom: 20px; gap: 16px; }
  .auth-banner-text { font-size: 13px; color: var(--text-secondary); line-height: 1.45; }
  .auth-banner-text strong { color: var(--text-primary); font-weight: 600; }
  .auth-banner-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn-primary { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 7px; background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 600; transition: background 120ms; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-ghost { display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--border-default); color: var(--text-secondary); font-size: 12.5px; font-weight: 500; transition: background 120ms, color 120ms; }
  .btn-ghost:hover { background: var(--bg-elevated); color: var(--text-primary); }

  .feed-wrap { padding: 20px clamp(24px, 4vw, 80px) 96px; max-width: 1920px; margin: 0 auto; }

  /* ── Search results header ── */
  .results-header {
    display: flex; align-items: baseline; gap: 10px;
    margin-bottom: 20px; padding-bottom: 16px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .results-count { font-size: 13.5px; font-weight: 600; color: var(--text-primary); }
  .results-query { font-size: 13.5px; font-weight: 400; color: var(--text-secondary); }
  .results-query em { font-style: normal; font-family: var(--font-mono); font-size: 12.5px; color: var(--text-primary); background: var(--bg-elevated); padding: 1px 6px; border-radius: 4px; }

  /* ── Masonry (true CSS columns) ── */
  .masonry { column-count: 3; column-gap: 20px; max-width: 1280px; margin: 0 auto; }
  @media (max-width: 1279px) { .masonry { column-count: 2; max-width: 880px; } }
  @media (max-width: 880px)  { .masonry { column-count: 1; max-width: 560px; } }

  .card {
    break-inside: avoid; -webkit-column-break-inside: avoid; page-break-inside: avoid;
    display: inline-block; width: 100%;
    margin: 0 0 24px;
    transition: transform 160ms ease-out;
    cursor: pointer;
  }
  .card:hover { transform: translateY(-1px); }
  .card:not(.is-text):not(.stat-card):hover .cover { box-shadow: 0 8px 24px -14px rgba(0,0,0,0.16); }

  /* Subtle organic offset */
  @media (min-width: 1280px) {
    .masonry > .card:nth-child(5n+2) { margin-top: 16px; }
    .masonry > .card:nth-child(7n+4) { margin-top: 24px; }
  }

  .cover { position: relative; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 12px; transition: box-shadow 220ms ease-out; }
  .cover > svg, .cover > img { display: block; width: 100%; height: 100%; }
  .cover .badge-tl, .cover .badge-tr {
    position: absolute; top: 12px;
    font: 600 11px var(--font-sans); letter-spacing: 0.02em;
    background: rgba(255,255,255,0.92); color: var(--text-primary);
    padding: 5px 10px; border-radius: 999px; backdrop-filter: blur(6px);
  }
  .cover .badge-tl { left: 12px; }
  .cover .badge-tr { right: 12px; }
  .cover .badge-tl.dark, .cover .badge-tr.dark { background: rgba(10,10,10,0.72); color: #fff; }

  .card-body { padding: 12px 2px 4px; }
  .card.is-text .card-body { padding: 12px 2px 4px; }
  .card-title {
    font-size: 19px; font-weight: 700; line-height: 1.3; color: var(--text-primary);
    letter-spacing: -0.015em;
    margin: 0 0 10px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; text-wrap: pretty;
  }
  .ai-summary { display: flex; gap: 8px; font-size: 12.5px; line-height: 1.5; color: var(--text-secondary); font-style: italic; margin-bottom: 10px; }
  .ai-summary .spark { flex-shrink: 0; color: var(--text-tertiary); margin-top: 2px; }
  .ai-summary .txt { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-wrap: pretty; }
  .ai-summary.clamp-2 .txt { -webkit-line-clamp: 2; }
  .meta-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .tag-pill { font-size: 10.5px; font-weight: 500; color: var(--text-secondary); background: var(--bg-elevated); padding: 3px 7px; border-radius: 4px; }
  .tag-pill.accent { background: var(--text-primary); color: #fff; }
  .author-row { display: flex; align-items: center; gap: 9px; padding-top: 4px; margin-top: 4px; }
  .card.is-text .author-row { padding-top: 4px; margin-top: 4px; }
  .meta-tags + .author-row { margin-top: 0; }
  .author-row .av { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #ccc, #888); display: grid; place-items: center; color: #fff; font-size: 10.5px; font-weight: 700; flex-shrink: 0; }
  .author-row .name { font-size: 13px; font-weight: 500; color: var(--text-primary); display: flex; align-items: center; gap: 5px; min-width: 0; }
  .author-row .name .verified { color: var(--accent); width: 13px; height: 13px; flex-shrink: 0; }
  .author-row .dot-sep { color: var(--text-tertiary); font-size: 12px; }
  .author-row .ago { font-size: 12px; color: var(--text-tertiary); }
  .author-row .likes { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; font-weight: 500; }
  .author-row .likes svg { color: var(--text-tertiary); width: 14px; height: 14px; }

  /* Text card: cream block holds eyebrow + quote, title + author below */
  .card-text {
    position: relative;
    background: oklch(97% 0.012 80);
    border-radius: 12px;
    padding: 18px 18px 20px;
    overflow: hidden;
    transition: box-shadow 220ms ease-out;
  }
  .card.is-text:hover .card-text { box-shadow: 0 8px 24px -14px rgba(0,0,0,0.12); }
  .card-text .eyebrow {
    font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-secondary); margin: 0 0 14px;
    display: inline-flex; align-items: center; gap: 0;
  }
  .card-text .pull-quote {
    font-family: var(--font-serif); font-style: italic; font-weight: 500; font-size: 16px; line-height: 1.55;
    color: var(--text-primary); border-left: 2px solid var(--border-default);
    padding-left: 12px; margin: 0;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    text-wrap: pretty;
  }
  .card-text .pull-quote.is-short { -webkit-line-clamp: 3; }

  /* Code preview as standalone block (parallel to cream block) */
  .code-preview { background: #0A0A0A; color: #F0F0F0; border-radius: 12px; font: 400 11.5px/1.55 var(--font-mono); padding: 14px 14px 16px; margin: 0; overflow: hidden; position: relative; }
  .code-preview::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: linear-gradient(180deg, transparent, #0A0A0A); pointer-events: none; }
  .code-preview .ln { color: #6B6B6B; display: inline-block; width: 18px; }
  .code-preview .kw { color: #c5a3ff; }
  .code-preview .st { color: #9ce0a0; }
  .code-preview .cm { color: #6B6B6B; font-style: italic; }
  .code-preview .fn { color: #f0c674; }

  /* Stat card — cream block */
  .stat-card { background: oklch(97% 0.012 80); border-radius: 12px; overflow: hidden; padding: 18px 18px 16px; transition: box-shadow 220ms ease-out; }
  .stat-card:hover { box-shadow: 0 8px 24px -14px rgba(0,0,0,0.12); }
  .stat-card .stat-eyebrow { font-size: 10px; color: var(--text-secondary); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
  .stat-big { font-family: var(--font-serif); font-style: italic; font-weight: 500; font-size: 56px; line-height: 1; letter-spacing: -0.03em; color: var(--text-primary); margin: 4px 0 2px; }
  .stat-sub { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 10px; }
  .spark-line { width: 100%; height: 36px; margin: 6px 0; }
  .stat-detail { font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 10px; }

  /* Thread inside cream block */
  .thread { padding: 4px 0; }
  .thread-line { display: flex; gap: 8px; padding: 6px 0; font-size: 12.5px; color: var(--text-secondary); line-height: 1.45; }
  .thread-line .av { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; background: linear-gradient(135deg,#aaa,#555); color: #fff; font-size: 9px; font-weight: 700; display: grid; place-items: center; }
  .thread-line .who { color: var(--text-primary); font-weight: 600; }
  .thread-more { font-size: 12px; color: var(--text-tertiary); padding-left: 26px; margin-top: 2px; }

  .cv { width: 100%; height: 100%; display: block; }
  .topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px; background: linear-gradient(180deg, rgba(0,0,0,0.04), transparent); opacity: 0; transition: opacity 200ms; pointer-events: none; }
  .topbar.scrolled::after { opacity: 1; }

  /* ── Loading skeletons ── */
  .skeleton { background: var(--bg-elevated); border-radius: 6px; animation: shimmer 1.4s ease-in-out infinite; }
  @keyframes shimmer {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.45; }
  }
  .skel-card { break-inside: avoid; -webkit-column-break-inside: avoid; display: inline-block; width: 100%; margin: 0 0 24px; }
  .skel-cover { aspect-ratio: 4/3; border-radius: 12px; }
  .skel-body { padding: 12px 2px 4px; display: flex; flex-direction: column; gap: 10px; }
  .skel-line { height: 10px; border-radius: 4px; }
  .skel-line.w100 { width: 100%; }
  .skel-line.w80  { width: 80%;  }
  .skel-line.w60  { width: 60%;  }
  .skel-line.w40  { width: 40%;  }

  /* ── Empty state ── */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 80px 24px; text-align: center; gap: 16px;
  }
  .empty-icon { width: 52px; height: 52px; border-radius: 14px; background: var(--bg-elevated); display: grid; place-items: center; color: var(--text-tertiary); }
  .empty-title { font-size: 16px; font-weight: 600; color: var(--text-primary); margin: 0; }
  .empty-body { font-size: 13.5px; color: var(--text-secondary); line-height: 1.55; max-width: 340px; margin: 0; }
  .empty-body em { font-style: normal; font-family: var(--font-mono); font-size: 12.5px; color: var(--text-primary); background: var(--bg-elevated); padding: 1px 6px; border-radius: 4px; }
  .empty-actions { display: flex; gap: 8px; margin-top: 4px; }

  /* ── Settings modal ── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.28);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 500;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 160ms ease-out;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--bg-base);
    border-radius: 14px;
    border: 1px solid var(--border-subtle);
    width: 440px;
    max-width: calc(100vw - 32px);
    box-shadow: 0 24px 64px -16px rgba(0,0,0,0.18);
    transform: translateY(8px) scale(0.98);
    transition: transform 160ms ease-out;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-backdrop.open .modal { transform: translateY(0) scale(1); }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border-subtle);
    position: sticky; top: 0; background: var(--bg-base);
    border-radius: 14px 14px 0 0;
    z-index: 1;
  }
  .modal-title { font-size: 14.5px; font-weight: 600; }
  .modal-close { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; color: var(--text-tertiary); transition: background 120ms ease-out, color 120ms ease-out; }
  .modal-close:hover { background: var(--bg-elevated); color: var(--text-primary); }
  .modal-close svg { width: 16px; height: 16px; stroke-width: 2; }
  .modal-body { padding: 0 0 8px; }
  .settings-section { padding: 20px 20px 4px; }
  .settings-section + .settings-section { border-top: 1px solid var(--border-subtle); padding-top: 16px; }
  .section-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 12px; }
  .account-field { display: flex; flex-direction: column; gap: 2px; margin-bottom: 12px; }
  .account-field-label { font-size: 11.5px; font-weight: 500; color: var(--text-secondary); }
  .account-field-value { font-size: 13.5px; font-weight: 500; color: var(--text-primary); }
  .settings-link { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; margin-bottom: 4px; color: var(--text-primary); font-size: 13.5px; font-weight: 500; border-radius: 6px; transition: color 120ms ease-out; cursor: pointer; width: 100%; }
  .settings-link:hover { color: var(--accent-hover); }
  .settings-link:hover .link-arrow { color: var(--text-secondary); }
  .settings-link-text { display: flex; flex-direction: column; gap: 1px; }
  .settings-link-desc { font-size: 11.5px; font-weight: 400; color: var(--text-tertiary); }
  .link-arrow { color: var(--text-tertiary); transition: color 120ms ease-out; }
  .link-arrow svg { width: 14px; height: 14px; stroke-width: 2; display: block; }
  .freq-control { display: flex; border: 1px solid var(--border-default); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
  .freq-btn { flex: 1; padding: 8px 0; font-size: 12.5px; font-weight: 500; color: var(--text-tertiary); background: transparent; text-align: center; transition: background 120ms ease-out, color 120ms ease-out; border-right: 1px solid var(--border-default); }
  .freq-btn:last-child { border-right: 0; }
  .freq-btn.active { background: var(--accent); color: #fff; }
  .freq-btn:not(.active):hover { background: var(--bg-elevated); color: var(--text-primary); }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; gap: 16px; }
  .toggle-row + .toggle-row { border-top: 1px solid var(--border-subtle); }
  .toggle-info { display: flex; flex-direction: column; gap: 2px; }
  .toggle-label { font-size: 13.5px; font-weight: 500; color: var(--text-primary); }

function renderAuthorRow(p) {
  const verified = p.author?.verified
    ? `<svg class="verified" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5 14.2 4l3.3-.5.8 3.2L21 9l-1.4 3 1 3.1-3 1.7-.6 3.3-3.3-.4-2.7 2-2.7-2-3.3.4L4.4 17 1.4 15l1-3.1L1 9l2.7-1.3.8-3.2L7.8 4 12 1.5z"/><path d="m8.5 12 2.5 2.5 4.5-5" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`
    : '';
  return `<div class="author-row"><span class="av">${p.author.initials}</span><span class="name">${p.author.name}${verified}</span><span class="dot-sep">·</span><span class="ago">${p.ago}</span><span class="likes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>${p.likes.toLocaleString()}</span></div>`;
}
function renderCover(p) {
  if (!p.cover) return '';
  const badge = p.badge || {}, dark = p.cover==='network'||p.cover==='orbit';
  const tl = badge.tl ? `<span class="badge-tl ${dark?'dark':''}">${badge.tl}</span>` : '';
  const tr = badge.tr ? `<span class="badge-tr ${dark?'dark':''}">${badge.tr}</span>` : '';
  return `<div class="cover">${Covers[p.cover]()}${tl}${tr}</div>`;
}
function renderCard(p) {
  // Image card: cover + title + author below (bare)
  if (p.cover) {
    return `<article class="card">${renderCover(p)}<div class="card-body"><h2 class="card-title">${p.title}</h2>${renderAuthorRow(p)}</div></article>`;
  }
  // Text card with thread preview: cream block holds eyebrow + title + thread; author bare below
  if (p.threadPreview) {
    const eyebrow = p.eyebrow ? `<div class="eyebrow">${p.eyebrow}</div>` : '';
    let lines = '';
    p.threadPreview.forEach(t => { lines += `<div class="thread-line"><span class="av">${t.who}</span><div><span class="who">${t.name}</span> ${t.txt}</div></div>`; });
    const more = p.moreThread ? `<div class="thread-more">${p.moreThread} →</div>` : '';
    return `<article class="card is-text"><div class="card-text">${eyebrow}<h2 class="card-title" style="margin:0 0 10px;">${p.title}</h2><div class="thread">${lines}${more}</div></div><div class="card-body">${renderAuthorRow(p)}</div></article>`;
  }
  // Text card with quote: cream block with eyebrow + pull-quote; title + author below
  if (p.quote) {
    const eyebrow = p.eyebrow ? `<div class="eyebrow">${p.eyebrow}</div>` : '';
    const quoteCls = p.quote.length < 90 ? 'pull-quote is-short' : 'pull-quote';
    const titleOutside = p.title ? `<h2 class="card-title">${p.title}</h2>` : '';
    return `<article class="card is-text"><div class="card-text">${eyebrow}<blockquote class="${quoteCls}">${p.quote}</blockquote></div><div class="card-body">${titleOutside}${renderAuthorRow(p)}</div></article>`;
  }
  // Text card with summary only: cream block with eyebrow + summary as pull-quote-like; title + author below
  if (p.summary) {
    const eyebrow = p.eyebrow ? `<div class="eyebrow">${p.eyebrow}</div>` : '';
    const titleOutside = p.title ? `<h2 class="card-title">${p.title}</h2>` : '';
    const quoteCls = p.summary.length < 110 ? 'pull-quote is-short' : 'pull-quote';
    return `<article class="card is-text"><div class="card-text">${eyebrow}<blockquote class="${quoteCls}">${p.summary}</blockquote></div><div class="card-body">${titleOutside}${renderAuthorRow(p)}</div></article>`;
  }
  // Fallback: title-only text card
  return `<article class="card is-text"><div class="card-text">${p.eyebrow?`<div class="eyebrow">${p.eyebrow}</div>`:''}<h2 class="card-title" style="margin:0;">${p.title}</h2></div><div class="card-body">${renderAuthorRow(p)}</div></article>`;
}

// ── Skeleton cards ──
function renderSkeletonCards() {
  const configs = [
    { hasCover: true, lines: ['w100','w80'] },
    { hasCover: false, lines: ['w100','w100','w60','w40'] },
    { hasCover: true, lines: ['w100','w80','w60'] },
    { hasCover: false, lines: ['w100','w80'] },
    { hasCover: true, lines: ['w100','w60'] },
    { hasCover: false, lines: ['w100','w80','w80','w40'] },
    { hasCover: true, lines: ['w100','w80'] },
    { hasCover: false, lines: ['w100','w60'] },
  ];
  return configs.map(cfg => {
    const block = cfg.hasCover
      ? `<div class="skel-cover skeleton"></div>`
      : `<div class="skeleton" style="border-radius:12px;height:160px;"></div>`;
    const lines = cfg.lines.map(w => `<div class="skel-line skeleton ${w}"></div>`).join('');
    return `<div class="skel-card">${block}<div class="skel-body">${lines}</div></div>`;
  }).join('');
}

// ── Render states ──
function renderResults() {
  const q = document.getElementById('search-input').value.trim() || QUERY;
  const count = RESULTS.length;
  return `
    <div class="results-header">
      <span class="results-count">${count} results</span>
      <span class="results-query">for <em>${q}</em></span>
    </div>
    <div class="masonry">${RESULTS.map(renderCard).join('')}</div>
  `;
}

function renderLoading() {
  return `
    <div class="results-header">
      <span class="results-count" style="color:var(--text-tertiary);">Searching…</span>
      <span class="results-query">for <em>${document.getElementById('search-input').value.trim() || QUERY}</em></span>
    </div>
    <div class="masonry">${renderSkeletonCards()}</div>
  `;
}

function renderEmpty() {
  const q = document.getElementById('search-input').value.trim() || QUERY;
  return `
    <div class="results-header">
      <span class="results-count">0 results</span>
      <span class="results-query">for <em>${q}</em></span>
    </div>
    <div class="empty-state">
      <div class="empty-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/><path d="M8 11h6M11 8v6" opacity="0.35"/></svg>
      </div>
      <h2 class="empty-title">No results found</h2>
      <p class="empty-body">Nothing matched <em>${q}</em> on Verita yet. Try a different keyword, or clear your search to browse the full feed.</p>
      <div class="empty-actions">
        <button class="btn-ghost" type="button" onclick="clearSearch()">Clear search</button>
        <button class="btn-primary" type="button" onclick="goHome()">Browse feed</button>
      </div>
    </div>
  `;
}

function applyResultsState() {
  const area = document.getElementById('results-area');
  if (resultsState === 'results') area.innerHTML = renderResults();
  else if (resultsState === 'loading') area.innerHTML = renderLoading();
  else area.innerHTML = renderEmpty();

  ['results','loading','empty'].forEach(s => {
    document.getElementById('btn-' + s).classList.toggle('active', resultsState === s);
  });
}

function setResultsState(state) {
  resultsState = state;
  applyResultsState();
}

// ── Auth state ──
function applyAuthState() {
  document.getElementById('sidebar-cta').innerHTML = isLoggedIn
    ? `<a class="nav-cta" href="#"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>New post</a>`
    : `<a class="nav-signin" href="#"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>Sign in</a>`;

  document.getElementById('topbar-auth').innerHTML = isLoggedIn
    ? `<button class="avatar-btn" type="button" aria-label="Profile"></button>`
    : `<button class="signin-btn" type="button">Sign in</button>`;

  document.getElementById('auth-banner-slot').innerHTML = isLoggedIn
    ? ''
    : `<div class="auth-banner"><div class="auth-banner-text">Browsing as guest. <strong>Sign in</strong> to get a personalised feed, save bookmarks, and join the discussion.</div><div class="auth-banner-actions"><button class="btn-ghost" type="button">Log in</button><button class="btn-primary" type="button">Create account</button></div></div>`;

  document.getElementById('digest-badge').style.display = isLoggedIn ? '' : 'none';

  document.getElementById('btn-loggedin').classList.toggle('active', isLoggedIn);
  document.getElementById('btn-loggedout').classList.toggle('active', !isLoggedIn);

  const settingsBtn = document.getElementById('settings-nav-btn');
  if (isLoggedIn) { settingsBtn.classList.remove('disabled'); }
  else { settingsBtn.classList.add('disabled'); closeSettingsModal(); }
}

document.getElementById('btn-loggedin').addEventListener('click', () => { isLoggedIn = true; applyAuthState(); });
document.getElementById('btn-loggedout').addEventListener('click', () => { isLoggedIn = false; applyAuthState(); });

// ── Search input behaviour ──
function clearSearch() {
  document.getElementById('search-input').value = '';
  goHome();
}

function goHome() {
  // In the prototype, simulate navigating home by showing a brief flash
  const main = document.querySelector('.main');
  main.style.opacity = '0.5';
  main.style.transition = 'opacity 120ms ease-out';
  setTimeout(() => {
    main.style.opacity = '1';
    document.getElementById('search-input').value = QUERY;
    setResultsState('results');
  }, 180);
}

document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const val = e.target.value.trim();
    if (!val) { clearSearch(); return; }
    applyResultsState();
  }
});

// ── Settings modal ──
function openSettingsModal() {
  if (!isLoggedIn) return;
  document.getElementById('settingsModal').classList.add('open');
  document.addEventListener('keydown', handleSettingsEsc);
}
function closeSettingsModal() {
  document.getElementById('settingsModal').classList.remove('open');
  document.removeEventListener('keydown', handleSettingsEsc);
}
function handleSettingsEsc(e) { if (e.key === 'Escape') closeSettingsModal(); }
function handleBackdropClick(e) { if (e.target === document.getElementById('settingsModal')) closeSettingsModal(); }

let currentFreq = 'daily';
function setFreq(val) {
  if (currentFreq === val) return;
  document.getElementById('freq-' + currentFreq).classList.remove('active');
  document.getElementById('freq-' + val).classList.add('active');
  currentFreq = val;
}

// ── Topbar scroll shadow ──
const topbar = document.getElementById('topbar');
window.addEventListener('scroll', () => { topbar.classList.toggle('scrolled', window.scrollY > 6); });

// ── Init ──
applyAuthState();
applyResultsState();

// ── Demo navigation intercept ──
(function() {
  function nav(page) {
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'verita-navigate', page }, '*');
    } else {
      window.location.href = page;
    }
  }

  document.addEventListener('click', function(e) {
    const el = e.target.closest('a, button');
    if (!el) return;

    if (el.closest('.brand')) { e.preventDefault(); nav('Verita Home.html'); return; }

    const navItem = el.closest('.nav-item');
    if (navItem) {
      const label = navItem.textContent.trim().toLowerCase();
      if (label.startsWith('explore')) { e.preventDefault(); nav('Verita Home.html'); return; }
      if (label.startsWith('digest')) { e.preventDefault(); nav('Verita Digest Post.html'); return; }
      if (label.startsWith('settings')) { e.preventDefault(); nav('Verita Settings.html'); return; }
    }

    if (el.closest('.back-btn') || el.closest('.topbar-back')) { e.preventDefault(); nav('Verita Home.html'); return; }
    if (el.closest('.nav-cta')) { e.preventDefault(); nav('Verita Post Editor.html'); return; }
    if (el.closest('.avatar-btn')) { e.preventDefault(); nav('Verita User Profile.html'); return; }

    // Result cards → Post Detail
    if (el.closest('.result-card') || el.closest('.result-item')) {
      e.preventDefault(); nav('Verita Post Detail.html'); return;
    }
  }, true);
})();
</script>
</body>
</html>
