server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Keep internal observability endpoints off the public surface. Prometheus scrapes the
    # backends directly (in-cluster / on the compose network), never through this gateway.
    # Regex and exact-match locations take precedence over the /<service>/ prefix proxies below.
    location ~ ^/(user|content|recommendation)/actuator(/|$) { return 404; }
    location = /genai/metrics { return 404; }

    location /user/ {
        proxy_pass ${USER_SERVICE_URL}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /content/ {
        proxy_pass ${CONTENT_SERVICE_URL}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /recommendation/ {
        proxy_pass ${RECOMMENDATION_SERVICE_URL}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /genai/ {
        proxy_pass ${GENAI_SERVICE_URL}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /storage/ {
        proxy_pass ${MINIO_URL}/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
