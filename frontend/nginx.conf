server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Allow uploads up to the backend's limit (content-service app.storage.max-file-bytes=5MB).
    # nginx defaults to 1MB and would reject larger images with 413 before they reach the service.
    client_max_body_size 10m;

    location /user/ {
        proxy_pass ${USER_SERVICE_URL}/;
        # The refresh-token cookie is scoped to /api/v1/auth upstream, but the browser
        # reaches it under the /user prefix. Rewrite the cookie path so it is sent back.
        proxy_cookie_path /api/v1/auth /user/api/v1/auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /content/ {
        proxy_pass ${CONTENT_SERVICE_URL}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /recommendation/ {
        proxy_pass ${RECOMMENDATION_SERVICE_URL}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /genai/ {
        proxy_pass ${GENAI_SERVICE_URL}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /storage/ {
        proxy_pass ${MINIO_URL}/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
