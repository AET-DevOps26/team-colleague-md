services:
  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: verita_users
      POSTGRES_USER: verita_user
      POSTGRES_PASSWORD: verita_password
    ports:
      - "5432:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verita_user -d verita_users"]
      interval: 10s
      timeout: 5s
      retries: 5

  content-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: verita_content
      POSTGRES_USER: verita_content_user
      POSTGRES_PASSWORD: verita_content_password
    ports:
      - "5433:5432"
    volumes:
      - content-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verita_content_user -d verita_content"]
      interval: 10s
      timeout: 5s
      retries: 5

  recommendation-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: verita_recommendations
      POSTGRES_USER: verita_user
      POSTGRES_PASSWORD: verita_password
    ports:
      - "5434:5432"
    volumes:
      - recommendation-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verita_user -d verita_recommendations"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: verita_minio
      MINIO_ROOT_PASSWORD: verita_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: verita_minio
      MINIO_ROOT_PASSWORD: verita_minio_password
      MINIO_USER_PORTRAITS_BUCKET: verita-user-portraits
      MINIO_POST_PHOTOS_BUCKET: verita-post-photos
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
        sleep 2;
      done;
      mc mb --ignore-existing local/$${MINIO_USER_PORTRAITS_BUCKET};
      mc mb --ignore-existing local/$${MINIO_POST_PHOTOS_BUCKET};
      mc anonymous set download local/$${MINIO_USER_PORTRAITS_BUCKET};
      mc anonymous set download local/$${MINIO_POST_PHOTOS_BUCKET};
      "

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # Shared HS256 secret — all services sign/verify with the same value so tokens interoperate.
      - JWT_SECRET=dev-only-insecure-secret-replace-in-production!!
      - DB_HOST=user-db
      - DB_PORT=5432
      - DB_NAME=verita_users
      - DB_USER=verita_user
      - DB_PASSWORD=verita_password
      - STORAGE_S3_ENDPOINT=http://minio:9000
    depends_on:
      user-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # Poll Spring Actuator health endpoint; non-200 response marks container unhealthy
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s      # Run the check every 30 seconds
      timeout: 10s       # Fail the check if it takes longer than 10 seconds
      retries: 3         # Mark unhealthy after 3 consecutive failures
      start_period: 40s  # Grace period at startup before failures count

  content-service:
    build:
      context: ./backend/content-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # Shared HS256 secret — must match the value used by user-service / recommendation-service.
      - JWT_SECRET=dev-only-insecure-secret-replace-in-production!!
      - DB_URL=jdbc:postgresql://content-db:5432/verita_content
      - DB_USERNAME=verita_content_user
      - DB_PASSWORD=verita_content_password
      - STORAGE_S3_ENDPOINT=http://minio:9000
      # Cross-service calls (Clients.java): reach peers by compose service name, not localhost.
      - USER_SERVICE_BASE_URL=http://user-service:8081
      - GENAI_SERVICE_BASE_URL=http://genai-service:8000
    depends_on:
      content-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  recommendation-service:
    build:
      context: ./backend/recommendation-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # Shared HS256 secret — must match the value used by user-service / content-service.
      - JWT_SECRET=dev-only-insecure-secret-replace-in-production!!
      - DB_HOST=recommendation-db
      - DB_PORT=5432
      - DB_NAME=verita_recommendations
      - DB_USER=verita_user
      - DB_PASSWORD=verita_password
      - CONTENT_SERVICE_BASE_URL=http://content-service:8082
    depends_on:
      recommendation-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  genai-service:
    build:
      context: ./genai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./genai-service/.env
    healthcheck:
      # Poll FastAPI health endpoint; non-200 response marks container unhealthy
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s  # FastAPI starts faster than Spring Boot, shorter grace period

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"  # nginx listens on 80 inside the container, exposed on 3000 to match dev server
    healthcheck:
      # wget is available in nginx:alpine; curl is not
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s  # nginx starts faster than backend services

volumes:
  user-db-data:
  content-db-data:
  recommendation-db-data:
  minio-data:
