# NOTE: Postgres only applies POSTGRES_USER/DB/PASSWORD on the FIRST init of an empty data
# volume. If you change a DB name/role/password below against an existing volume, the running
# container keeps the old credentials and services fail to connect. Wipe volumes to re-init:
#   docker compose down -v && docker compose up --build
services:
  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: verita_users
      POSTGRES_USER: svc_user
      POSTGRES_PASSWORD: svc_user_password
    ports:
      - "5432:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svc_user -d verita_users"]
      interval: 10s
      timeout: 5s
      retries: 5

  content-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: verita_contents
      POSTGRES_USER: svc_content
      POSTGRES_PASSWORD: svc_content_password
    ports:
      - "5433:5432"
    volumes:
      - content-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svc_content -d verita_contents"]
      interval: 10s
      timeout: 5s
      retries: 5

  recommendation-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: verita_recommendations
      POSTGRES_USER: svc_recommendation
      POSTGRES_PASSWORD: svc_recommendation_password
    ports:
      - "5434:5432"
    volumes:
      - recommendation-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svc_recommendation -d verita_recommendations"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: verita_minio
      MINIO_ROOT_PASSWORD: verita_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: verita_minio
      MINIO_ROOT_PASSWORD: verita_minio_password
      MINIO_USER_PORTRAITS_BUCKET: verita-user-portraits
      MINIO_POST_PHOTOS_BUCKET: verita-post-photos
      # Per-service scoped S3 users (least-privilege; mirrors prod). Dev plaintext keys match the
      # STORAGE_S3_ACCESS_KEY/SECRET_KEY defaults in each service's application-dev.properties.
      USER_SERVICE_S3_ACCESS_KEY: user-service
      USER_SERVICE_S3_SECRET_KEY: user-service-s3-secret
      CONTENT_SERVICE_S3_ACCESS_KEY: content-service
      CONTENT_SERVICE_S3_SECRET_KEY: content-service-s3-secret
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2
        done

        mc mb --ignore-existing "local/$${MINIO_USER_PORTRAITS_BUCKET}"
        mc mb --ignore-existing "local/$${MINIO_POST_PHOTOS_BUCKET}"

        cat > /tmp/user-service-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"],
              "Resource": ["arn:aws:s3:::$${MINIO_USER_PORTRAITS_BUCKET}"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
              "Resource": ["arn:aws:s3:::$${MINIO_USER_PORTRAITS_BUCKET}/*"]
            }
          ]
        }
        EOF

        cat > /tmp/content-service-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"],
              "Resource": ["arn:aws:s3:::$${MINIO_POST_PHOTOS_BUCKET}"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
              "Resource": ["arn:aws:s3:::$${MINIO_POST_PHOTOS_BUCKET}/*"]
            }
          ]
        }
        EOF

        mc admin policy create local user-service-portraits-rw /tmp/user-service-policy.json || true
        mc admin policy create local content-service-posts-rw /tmp/content-service-policy.json || true

        mc admin user info local "$${USER_SERVICE_S3_ACCESS_KEY}" >/dev/null 2>&1 ||
          mc admin user add local "$${USER_SERVICE_S3_ACCESS_KEY}" "$${USER_SERVICE_S3_SECRET_KEY}"
        mc admin user info local "$${CONTENT_SERVICE_S3_ACCESS_KEY}" >/dev/null 2>&1 ||
          mc admin user add local "$${CONTENT_SERVICE_S3_ACCESS_KEY}" "$${CONTENT_SERVICE_S3_SECRET_KEY}"

        mc admin policy attach local user-service-portraits-rw --user "$${USER_SERVICE_S3_ACCESS_KEY}" || true
        mc admin policy attach local content-service-posts-rw --user "$${CONTENT_SERVICE_S3_ACCESS_KEY}" || true

        mc anonymous set download "local/$${MINIO_USER_PORTRAITS_BUCKET}"
        mc anonymous set download "local/$${MINIO_POST_PHOTOS_BUCKET}"

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # Shared HS256 secret — all services sign/verify with the same value so tokens interoperate.
      - JWT_SECRET=dev-only-insecure-secret-replace-in-production!!
      - DB_HOST=user-db
      - DB_PORT=5432
      - DB_NAME=verita_users
      - DB_USER=svc_user
      - DB_PASSWORD=svc_user_password
      - STORAGE_S3_ENDPOINT=http://minio:9000
      - STORAGE_S3_ACCESS_KEY=user-service
      - STORAGE_S3_SECRET_KEY=user-service-s3-secret
    depends_on:
      user-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # Poll Spring Actuator health endpoint; non-200 response marks container unhealthy
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s      # Run the check every 30 seconds
      timeout: 10s       # Fail the check if it takes longer than 10 seconds
      retries: 3         # Mark unhealthy after 3 consecutive failures
      start_period: 40s  # Grace period at startup before failures count

  content-service:
    build:
      context: ./backend/content-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # Shared HS256 secret — must match the value used by user-service / recommendation-service.
      - JWT_SECRET=dev-only-insecure-secret-replace-in-production!!
      - DB_HOST=content-db
      - DB_PORT=5432
      - DB_NAME=verita_contents
      - DB_USER=svc_content
      - DB_PASSWORD=svc_content_password
      - STORAGE_S3_ENDPOINT=http://minio:9000
      - STORAGE_S3_ACCESS_KEY=content-service
      - STORAGE_S3_SECRET_KEY=content-service-s3-secret
      # Cross-service calls (Clients.java): reach peers by compose service name, not localhost.
      - USER_SERVICE_BASE_URL=http://user-service:8081
      - GENAI_SERVICE_BASE_URL=http://genai-service:8000
    depends_on:
      content-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  recommendation-service:
    build:
      context: ./backend/recommendation-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # Shared HS256 secret — must match the value used by user-service / content-service.
      - JWT_SECRET=dev-only-insecure-secret-replace-in-production!!
      - DB_HOST=recommendation-db
      - DB_PORT=5432
      - DB_NAME=verita_recommendations
      - DB_USER=svc_recommendation
      - DB_PASSWORD=svc_recommendation_password
      - CONTENT_SERVICE_BASE_URL=http://content-service:8082
    depends_on:
      recommendation-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  genai-service:
    build:
      context: ./genai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./genai-service/.env
    healthcheck:
      # Poll FastAPI health endpoint via the bundled Python runtime — the slim base ships no curl/wget.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s  # FastAPI starts faster than Spring Boot, shorter grace period

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"  # nginx listens on 80 inside the container, exposed on 3000 to match dev server
    healthcheck:
      # wget is available in nginx:alpine; curl is not
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s  # nginx starts faster than backend services

volumes:
  user-db-data:
  content-db-data:
  recommendation-db-data:
  minio-data:
