spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:verita_recommendations}
spring.datasource.username=${DB_USER:svc_recommendation}
spring.datasource.password=${DB_PASSWORD:svc_recommendation_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Shared dev fallbacks (used only when the env vars are unset, e.g. a bare ./gradlew bootRun).
# Both literals match content-service's and user-service's dev defaults so the services
# verify each other's JWTs and pass the ADR-0007 internal-token check out of the box.
app.jwt-secret=${JWT_SECRET:dev-only-insecure-secret-replace-in-production!!}
app.internal-service-token=${INTERNAL_SERVICE_TOKEN:dev-only-internal-service-token}
