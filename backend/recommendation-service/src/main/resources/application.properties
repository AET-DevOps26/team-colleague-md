spring.application.name=recommendation-service
logging.structured.format.console=ecs
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:verita_recommendations}
spring.datasource.username=${DB_USER:verita_user}
spring.datasource.password=${DB_PASSWORD:verita_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=recommendation-pool

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Batched interaction inserts: turn buffered saveAll calls into multi-row INSERTs
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Interaction write buffer (see InteractionBuffer)
recommendation.interactions.buffer.capacity=10000
recommendation.interactions.buffer.batch-size=100
recommendation.interactions.buffer.flush-interval-ms=2000

# Per-user rate limit for POST /api/v1/interactions/track (token bucket)
recommendation.rate-limit.interactions.capacity=100
recommendation.rate-limit.interactions.refill-per-second=20

server.port=8083
server.shutdown=graceful

# Actuator / Micrometer — health probes + Prometheus scraping. Metrics live on the app
# port (8083); the nginx gateway denies /recommendation/actuator so they stay internal.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
