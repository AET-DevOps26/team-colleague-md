spring.application.name=recommendation-service
spring.profiles.default=dev
logging.structured.format.console=ecs

# Datasource connection identity lives in the dev/prod profiles (12-Factor: per-environment).
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=recommendation-pool

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Batched interaction inserts: turn buffered saveAll calls into multi-row INSERTs
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Interaction write buffer (see InteractionBuffer)
recommendation.interactions.buffer.capacity=10000
recommendation.interactions.buffer.batch-size=100
recommendation.interactions.buffer.flush-interval-ms=2000

# Per-user rate limit for POST /api/v1/interactions/track (token bucket)
recommendation.rate-limit.interactions.capacity=100
recommendation.rate-limit.interactions.refill-per-second=20

server.port=8083
server.shutdown=graceful

# Actuator / Micrometer — health probes + Prometheus scraping on the main server port (8083),
# so the k8s probes and the docker-compose healthcheck (both hitting /actuator/health on 8083)
# succeed. The nginx gateway denies /recommendation/actuator so metrics stay internal.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

# Shared HS256 secret (issue #150) used to verify access tokens issued by user-service.
# No default here (fail-closed): every environment must inject JWT_SECRET. The dev profile
# (application-dev.properties) supplies the shared dev fallback so local runs interoperate.
app.jwt-secret=${JWT_SECRET}

# Shared service-to-service secret (ADR-0007); must match the value content-service validates.
# No default here (fail-closed) — the dev profile carries the shared dev fallback.
app.internal-service-token=${INTERNAL_SERVICE_TOKEN}

# Cross-service base URL for content-service (see ContentClient). In docker-compose set
# CONTENT_SERVICE_BASE_URL=http://content-service:8082.
app.content-service-base-url=${CONTENT_SERVICE_BASE_URL:http://localhost:8082}

# Trending ranking inputs (see FeedService): candidate pool size and engagement-score weights.
recommendation.trending.candidate-pool-size=500
recommendation.trending.weight.like=1.0
recommendation.trending.weight.comment=2.0
recommendation.trending.weight.view=0.15
recommendation.trending.gravity=1.5

# Personal-feed interaction-driven topic affinity (#164): score x (1 + weight * min(affinity/cap, 1)).
recommendation.personal.affinity-weight=0.5
recommendation.personal.affinity-cap=5

# Topic id->name resolution cache TTL (see ContentClient / getSubscribedTopics).
recommendation.topic-name-cache.ttl-minutes=10
