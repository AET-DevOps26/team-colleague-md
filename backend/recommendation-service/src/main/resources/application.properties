spring.application.name=recommendation-service
logging.structured.format.console=ecs
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:verita_recommendations}
spring.datasource.username=${DB_USER:verita_user}
spring.datasource.password=${DB_PASSWORD:verita_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=recommendation-pool

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Batched interaction inserts: turn buffered saveAll calls into multi-row INSERTs
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Interaction write buffer (see InteractionBuffer)
recommendation.interactions.buffer.capacity=10000
recommendation.interactions.buffer.batch-size=100
recommendation.interactions.buffer.flush-interval-ms=2000

# Per-user rate limit for POST /api/v1/interactions/track (token bucket)
recommendation.rate-limit.interactions.capacity=100
recommendation.rate-limit.interactions.refill-per-second=20

server.port=8083
server.shutdown=graceful
management.server.port=8090
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoint.health.probes.enabled=true

# Shared HS256 secret used to verify access tokens issued by user-service (issue #150).
# Must match user-service's signing secret; the default mirrors user-service's dev default
# so the services interoperate out of the box. Override via JWT_SECRET in every environment.
app.jwt-secret=${JWT_SECRET:9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9}

# Cross-service base URL for content-service (see ContentClient). In docker-compose set
# CONTENT_SERVICE_BASE_URL=http://content-service:8082.
app.content-service-base-url=${CONTENT_SERVICE_BASE_URL:http://localhost:8082}

# Trending ranking inputs (see FeedService): candidate pool size and engagement-score weights.
recommendation.trending.candidate-pool-size=500
recommendation.trending.weight.like=1.0
recommendation.trending.weight.comment=2.0
recommendation.trending.weight.view=0.15
recommendation.trending.gravity=1.5

# Topic id->name resolution cache TTL (see ContentClient / getSubscribedTopics).
recommendation.topic-name-cache.ttl-minutes=10
