openapi: 3.0.3
info:
  title: Verita Recommendation & Notification Service API
  description: |
    Discovery and signaling layer for the Verita platform.
    Handles personalized and trending feeds, user/tag subscriptions, notifications,
    and behavioral interaction tracking for the recommendation engine.

    Feed endpoints return a `postIds` list. The frontend fetches card data by
    calling `GET /api/v1/posts/cards?ids=...` in content-service.
  version: 1.1.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: 'http://api.verita.local/recommendation'
    description: Production-style internal URL

paths:
  # --- FEEDS & DISCOVERY ---
  /api/v1/feed/personal:
    get:
      operationId: getPersonalFeed
      summary: Get personalized post feed for the logged-in user
      description: |
        Returns posts ranked by the personalization algorithm based on the user's
        tag subscriptions and behavioral history. Tag filter is intentionally absent —
        the personal feed is already scoped to subscribed topics.

        Uses cursor-based pagination for stable infinite scroll: pass the `nextCursor`
        from the previous response to load the next batch. Omit `cursor` for the first request.
      tags: [Discovery]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          description: Opaque cursor from the previous response. Omit for the first page.
          schema: { type: string }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: Personalized feed retrieved successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/feed/trending:
    get:
      operationId: getTrendingFeed
      summary: Get globally trending content
      description: |
        Returns posts ranked by engagement score (likes, comments, views, recency).
        Supply `tag` to browse trending posts within a topic — this is the ranked
        alternative to `GET /api/v1/posts?tag=` in content-service.
        Authenticated requests populate `isLikedByMe`; unauthenticated requests return `false`.

        Uses cursor-based pagination for stable infinite scroll: pass the `nextCursor`
        from the previous response to load the next batch. Omit `cursor` for the first request.
      tags: [Discovery]
      security: []
      parameters:
        - name: tag
          in: query
          description: Filter by tag name (case-insensitive).
          schema: { type: string, example: 'LLMs' }
        - name: cursor
          in: query
          description: Opaque cursor from the previous response. Omit for the first page.
          schema: { type: string }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: Trending feed retrieved successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedPage' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # --- SUBSCRIPTIONS (Follow Users) ---
  /api/v1/subscriptions/users/{userId}:
    post:
      operationId: subscribeToUser
      summary: Follow another user
      tags: [Subscriptions]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Subscription created successfully
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: unsubscribeFromUser
      summary: Unfollow a user
      tags: [Subscriptions]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Unsubscribed successfully
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --- SUBSCRIPTIONS (Follow Tags) ---
  /api/v1/subscriptions/tags:
    get:
      operationId: getSubscribedTags
      summary: List tags the current user is subscribed to
      tags: [Subscriptions]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of subscribed tags
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tag' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/subscriptions/tags/{tagId}:
    post:
      operationId: subscribeToTag
      summary: Subscribe to a tag
      tags: [Subscriptions]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: tagId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Tag subscription created successfully
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: unsubscribeFromTag
      summary: Unsubscribe from a tag
      tags: [Subscriptions]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: tagId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Tag subscription removed successfully
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --- NOTIFICATIONS ---
  /api/v1/notifications:
    get:
      operationId: getUserNotifications
      summary: Retrieve notification history
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
        - name: page
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: Paginated list of notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items: { $ref: '#/components/schemas/NotificationResponse' }
                  page: { type: integer }
                  size: { type: integer }
                  totalPages: { type: integer }
                  totalElements: { type: integer, format: int64 }
                  hasNext: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      summary: Mark a specific notification as read
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Notification marked as read
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      summary: Mark all notifications as read
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: All notifications marked as read
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --- ANALYTICS / INTERACTION TRACKING ---
  /api/v1/interactions/track:
    post:
      operationId: trackInteraction
      summary: Signal user interaction for the recommendation engine
      description: |
        Records implicit behavioral signals (dwell, scroll, clicks, shares) for the
        personalization model. Populate `durationSeconds` for `DWELL` events and
        `scrollDepth` (0–100) for `SCROLL` events.
      tags: [Interactions]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InteractionRequest' }
      responses:
        '202':
          description: Interaction queued for processing
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    Tag:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    FeedPage:
      type: object
      required: [postIds, nextCursor]
      properties:
        postIds:
          type: array
          items: { type: string, format: uuid }
          description: Ordered list of post IDs. Fetch card data via `GET /api/v1/posts/cards?ids=...` in content-service.
        nextCursor:
          type: string
          nullable: true
          description: Pass this value as `cursor` in the next request. Null means no more pages.

    NotificationResponse:
      type: object
      required: [id, type, content, isRead, createdAt]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [COMMENT, LIKE, VERIFICATION_APPROVED, DAILY_DIGEST, NEW_POST_IN_SUBSCRIBED_TAG]
        content:
          type: string
          example: 'Chris Olah liked your post'
        relatedPostId:
          type: string
          format: uuid
          nullable: true
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }

    InteractionRequest:
      type: object
      required: [postId, interactionType]
      properties:
        postId: { type: string, format: uuid }
        interactionType:
          type: string
          enum: [CLICK, VIEW, DWELL, SCROLL, SHARE]
        durationSeconds:
          type: integer
          minimum: 0
          nullable: true
          description: Seconds in viewport. Relevant for DWELL events.
        scrollDepth:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: Scroll percentage reached (0–100). Relevant for SCROLL events.
        metadata:
          type: object
          additionalProperties: true
          nullable: true

    ErrorResponse:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
