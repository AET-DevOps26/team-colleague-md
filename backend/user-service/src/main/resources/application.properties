server.port=8081

spring.application.name=user-service
spring.profiles.default=dev

# Actuator config for healthcheck
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# CORS
app.corsAllowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Downstream services
app.content-service-base-url=${CONTENT_SERVICE_BASE_URL:http://localhost:8082}

# JWT Configuration
app.jwtSecret=${JWT_SECRET:9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9}
# 24 hours in MS
app.jwtExpirationMs=86400000
app.jwtRefreshExpirationMs=604800000

# Flyway owns the schema (see db/migration). Databases previously created by ddl-auto=update
# are baselined at V1 (the baseline script is skipped there); fresh databases run every migration.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
