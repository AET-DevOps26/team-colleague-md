server.port=8081

spring.application.name=user-service
spring.profiles.default=dev

# Actuator config for healthcheck
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# CORS
app.corsAllowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Downstream services
app.content-service-base-url=${CONTENT_SERVICE_BASE_URL:http://localhost:8082}
app.recommendation-service-base-url=${RECOMMENDATION_SERVICE_BASE_URL:http://localhost:8083}

# Shared internal-service secret (ADR-0007). No default here (fail-closed): every environment
# must inject INTERNAL_SERVICE_TOKEN. The dev profile supplies the shared dev fallback.
app.internal-service-token=${INTERNAL_SERVICE_TOKEN}

# JWT Configuration. No default here (fail-closed): every environment must inject JWT_SECRET.
# The dev profile (application-dev.properties) supplies the shared dev fallback for local runs.
app.jwt-secret=${JWT_SECRET}
# 24 hours in MS
app.jwt-expiration-ms=86400000
app.jwt-refresh-expiration-ms=604800000

# Flyway owns the schema (see db/migration). Databases previously created by ddl-auto=update
# are baselined at V1 (the baseline script is skipped there); fresh databases run every migration.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
