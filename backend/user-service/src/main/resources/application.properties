server.port=8081

# Expose the health endpoint via Spring Boot Actuator for Docker and monitoring
management.endpoints.web.exposure.include=health

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/verita}
spring.datasource.username=${DB_USER:verita}
spring.datasource.password=${DB_PASSWORD:verita}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
app.jwt.expiration-ms=86400000
