spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Schema is owned by Flyway (db/migration); Hibernate only validates it on startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# S3-compatible object storage for user portrait uploads.
app.storage.s3.endpoint=${STORAGE_S3_ENDPOINT}
app.storage.s3.public-endpoint=${STORAGE_S3_PUBLIC_ENDPOINT}
app.storage.s3.region=${STORAGE_S3_REGION:us-east-1}
app.storage.s3.access-key=${STORAGE_S3_ACCESS_KEY}
app.storage.s3.secret-key=${STORAGE_S3_SECRET_KEY}
app.storage.s3.path-style-access=${STORAGE_S3_PATH_STYLE_ACCESS:true}
app.storage.buckets.user-portraits=${STORAGE_USER_PORTRAITS_BUCKET:verita-user-portraits}
