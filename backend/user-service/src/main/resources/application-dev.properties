spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:verita_users}
spring.datasource.username=${DB_USER:svc_user}
spring.datasource.password=${DB_PASSWORD:svc_user_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Shared dev fallback (used only when JWT_SECRET is unset, e.g. a bare ./gradlew bootRun).
# Matches content-service's and recommendation-service's dev defaults so JWTs interoperate.
app.jwt-secret=${JWT_SECRET:dev-only-insecure-secret-replace-in-production!!}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# S3-compatible object storage for user portrait uploads.
app.storage.s3.endpoint=${STORAGE_S3_ENDPOINT:http://localhost:9000}
app.storage.s3.public-endpoint=${STORAGE_S3_PUBLIC_ENDPOINT:http://localhost:9000}
app.storage.s3.region=${STORAGE_S3_REGION:us-east-1}
app.storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:user-service}
app.storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:user-service-s3-secret}
app.storage.s3.path-style-access=${STORAGE_S3_PATH_STYLE_ACCESS:true}
app.storage.buckets.user-portraits=${STORAGE_USER_PORTRAITS_BUCKET:verita-user-portraits}
