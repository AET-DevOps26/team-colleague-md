openapi: 3.0.3
info:
  title: Verita User Service API
  description: |
    User identity, authentication, and profile management for the Verita platform.
    Handles registration, login, profile updates, account preferences, and admin user management.
  version: 1.1.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: 'http://api.verita.local/user'
    description: Production-style internal URL

paths:
  # --- AUTHENTICATION ---
  /api/v1/auth/register:
    post:
      operationId: registerUser
      summary: Register a new user
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Username or email already taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/auth/login:
    post:
      operationId: loginUser
      summary: Log in and receive JWT tokens
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/logout:
    post:
      operationId: logoutUser
      summary: Invalidate the current session token
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Logged out successfully
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      summary: Exchange a refresh token for a new access token
      tags: [Authentication]
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request a password reset code by email
      description: |
        Sends a 6-digit reset code to the address if it belongs to a registered account.
        Always returns 204 regardless of whether the email exists, to avoid account enumeration.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '204':
          description: Password reset code sent if the address is registered
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/auth/verify-reset-code:
    post:
      operationId: verifyResetCode
      summary: Verify a password reset code and obtain a reset token
      description: |
        Exchanges the email + 6-digit code from the reset email for a short-lived,
        single-use reset token, which is then passed to /reset-password.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyResetCodeRequest' }
      responses:
        '200':
          description: Code verified; reset token issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyResetCodeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Reset password using a token from /verify-reset-code
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204':
          description: Password reset successful
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/auth/check-username:
    get:
      operationId: checkUsername
      summary: Check if a username is available
      tags: [Authentication]
      security: []
      parameters:
        - name: username
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Availability result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/auth/check-email:
    get:
      operationId: checkEmail
      summary: Check if an email address is available
      tags: [Authentication]
      security: []
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: Availability result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # --- INTERNAL (service-to-service) ---
  /internal/v1/users/{userId}/preferences:
    get:
      operationId: getUserPreferencesByUserId
      summary: Read another user's preferences (internal)
      description: |
        Internal endpoint called by content-service to enforce the bookmark/like privacy
        toggles when serving another user's profile tabs. Gated by the shared
        X-Internal-Service-Token (ADR-0007), not a user JWT.
      tags: [Internal]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: User preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferences' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/users/digest-recipients:
    get:
      operationId: getDigestRecipients
      summary: List users eligible for digest generation (internal)
      description: |
        Internal endpoint called by content-service's scheduled digest job. Returns users whose
        digest preference matches the requested frequency. Gated by X-Internal-Service-Token
        (ADR-0007), not a user JWT.
      tags: [Internal]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: frequency
          in: query
          required: true
          schema: { $ref: '#/components/schemas/DigestFrequency' }
        - name: page
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: Digest recipients
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedDigestRecipients' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /internal/v1/users/{userId}/stats/deltas:
    post:
      operationId: applyUserStatsDelta
      summary: Apply deltas to a user's profile stat counts (internal)
      description: |
        Internal endpoint called by content-service to keep an author's profile aggregate counts
        (postCount, likeReceivedCount) in sync as posts are published/unpublished and likes are
        added/removed. Gated by the shared X-Internal-Service-Token (ADR-0007), not a user JWT.
        Counts are clamped at zero; unknown user IDs are a no-op.
        TODO(#178): followerCount/followingCount deltas are intentionally not handled yet — the
        follow graph aggregate is not maintained (those two counts stay hidden in the UI).
      tags: [Internal]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserStatsDelta' }
      responses:
        '204': { description: Deltas applied }

  # --- CURRENT USER ---
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      summary: Get the current user's full profile
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateCurrentUser
      summary: Update the current user's profile
      tags: [Users]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: deleteCurrentUser
      summary: Delete the current user's account
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Account deleted
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/users/me/avatar:
    put:
      operationId: updateCurrentUserAvatar
      summary: Replace the current user's avatar
      tags: [Users]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: deleteCurrentUserAvatar
      summary: Remove the current user's avatar
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Avatar removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/users/me/preferences:
    get:
      operationId: getUserPreferences
      summary: Get the current user's preferences
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: updateUserPreferences
      summary: Update the current user's preferences
      tags: [Users]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPreferences' }
      responses:
        '200':
          description: Preferences updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferences' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --- PUBLIC USER PROFILES ---
  /api/v1/users/by-username/{username}:
    get:
      operationId: getUserByUsername
      summary: Get a user's public profile by username
      tags: [Users]
      security: []
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/users/{userId}:
    get:
      operationId: getUserById
      summary: Get a user's public profile
      tags: [Users]
      security: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --- ADMIN ---
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List all users with optional search filter (admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          description: Filter by username or display name (case-insensitive).
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedUsers' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/users/{userId}/role:
    patch:
      operationId: updateUserRole
      summary: Change a user's role (admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleRequest' }
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/users/{userId}/ban:
    patch:
      operationId: updateUserBanStatus
      summary: Ban or unban a user (admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBanStatusRequest' }
      responses:
        '200':
          description: Ban status updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    AvailabilityResponse:
      type: object
      description: Result of a username or email availability check.
      required: [available]
      properties:
        available:
          type: boolean
          description: True if the value is not yet taken.

    UserRole:
      type: string
      enum: [USER, VERIFIED, ADMIN]

    User:
      type: object
      required: [id, username, displayName, role, isBanned, postCount, followerCount, followingCount, likeReceivedCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        email:
          type: string
          format: email
          description: Only returned for the authenticated user themselves or admins.
        avatarUrl: { type: string, format: uri, nullable: true }
        bio: { type: string, nullable: true }
        website: { type: string, format: uri, nullable: true }
        organisation: { type: string, nullable: true }
        expertiseAreas:
          type: array
          items: { type: string }
          nullable: true
        role: { $ref: '#/components/schemas/UserRole' }
        isBanned: { type: boolean }
        postCount: { type: integer }
        # TODO(#178): followerCount/followingCount are not yet maintained (no follow-graph
        # aggregate) and are hidden in the UI. Kept in the contract so re-enabling is additive.
        followerCount: { type: integer }
        followingCount: { type: integer }
        likeReceivedCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserStatsDelta:
      type: object
      description: |
        Signed deltas to apply to a user's profile stat counts. Omitted or zero fields are no-ops.
        Only the counts maintained via write-back (ADR-0007 internal call) are represented.
      properties:
        postCountDelta: { type: integer, default: 0 }
        likeReceivedCountDelta: { type: integer, default: 0 }

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 20, pattern: '^[a-zA-Z0-9_]+$' }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, pattern: '^(?=.*[a-zA-Z])(?=.*\d).+$' }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AuthResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, description: Token lifetime in seconds., example: 3600 }
        user: { $ref: '#/components/schemas/User' }

    RefreshTokenRequest:
      type: object
      description: Body is optional — the refresh token is read from the httpOnly cookie.
      properties:
        refreshToken: { type: string }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    VerifyResetCodeRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: '^[0-9]{6}$', description: The 6-digit code from the reset email. }

    VerifyResetCodeResponse:
      type: object
      required: [resetToken]
      properties:
        resetToken:
          type: string
          description: Short-lived, single-use token to pass to /reset-password.

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string, description: The reset token returned by /verify-reset-code. }
        newPassword: { type: string, minLength: 8, pattern: '^(?=.*[a-zA-Z])(?=.*\d).+$' }

    UpdateUserRequest:
      type: object
      properties:
        displayName: { type: string }
        bio: { type: string, maxLength: 250, nullable: true }
        website: { type: string, format: uri, nullable: true }
        organisation: { type: string, nullable: true }
        expertiseAreas:
          type: array
          items: { type: string }
          nullable: true

    DigestFrequency:
      type: string
      enum: [DAILY, WEEKLY, OFF]

    UserPreferences:
      type: object
      required: [digestFrequency, showBookmarks, showLikes]
      properties:
        digestFrequency: { $ref: '#/components/schemas/DigestFrequency' }
        showBookmarks:
          type: boolean
          description: Whether other users can see this user's bookmarks.
        showLikes:
          type: boolean
          description: Whether other users can see this user's liked posts.

    UpdateRoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/UserRole' }

    UpdateBanStatusRequest:
      type: object
      required: [banned]
      properties:
        banned: { type: boolean }

    PaginatedUsers:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/User' }
        page: { type: integer }
        size: { type: integer }
        totalPages: { type: integer }
        totalElements: { type: integer, format: int64 }
        hasNext: { type: boolean }

    DigestRecipient:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }

    PaginatedDigestRecipients:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/DigestRecipient' }
        page: { type: integer }
        size: { type: integer }
        totalPages: { type: integer }
        totalElements: { type: integer, format: int64 }
        hasNext: { type: boolean }

    ErrorResponse:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
