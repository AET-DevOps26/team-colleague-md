spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# S3-compatible object storage for post photo uploads.
app.storage.s3.endpoint=${STORAGE_S3_ENDPOINT}
app.storage.s3.public-endpoint=${STORAGE_S3_PUBLIC_ENDPOINT}
app.storage.s3.region=${STORAGE_S3_REGION:us-east-1}
app.storage.s3.access-key=${STORAGE_S3_ACCESS_KEY}
app.storage.s3.secret-key=${STORAGE_S3_SECRET_KEY}
app.storage.s3.path-style-access=${STORAGE_S3_PATH_STYLE_ACCESS:true}
app.storage.buckets.post-photos=${STORAGE_POST_PHOTOS_BUCKET:verita-post-photos}
