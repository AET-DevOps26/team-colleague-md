spring.application.name=content-service
server.port=8082
management.endpoints.web.exposure.include=health

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/contentdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt-secret=${JWT_SECRET}
app.internal-service-token=${INTERNAL_SERVICE_TOKEN}
app.user-service-base-url=${USER_SERVICE_BASE_URL:http://localhost:8081}
app.genai-service-base-url=${GENAI_SERVICE_BASE_URL:http://localhost:8000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Object storage for post image/cover uploads (MinIO/S3). dev/test profiles supply local defaults.
app.storage.s3.endpoint=${STORAGE_S3_ENDPOINT}
app.storage.s3.public-endpoint=${STORAGE_S3_PUBLIC_ENDPOINT}
app.storage.s3.region=${STORAGE_S3_REGION:us-east-1}
app.storage.s3.access-key=${STORAGE_S3_ACCESS_KEY}
app.storage.s3.secret-key=${STORAGE_S3_SECRET_KEY}
app.storage.s3.path-style-access=${STORAGE_S3_PATH_STYLE_ACCESS:true}
app.storage.buckets.post-photos=${STORAGE_POST_PHOTOS_BUCKET:verita-post-photos}
app.storage.max-file-bytes=${MAX_FILE_BYTES:5242880}
app.digest.system-author-id=${DIGEST_SYSTEM_AUTHOR_ID:00000000-0000-0000-0000-000000000000}
