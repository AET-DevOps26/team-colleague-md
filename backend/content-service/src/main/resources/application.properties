spring.application.name=content-service
spring.profiles.default=dev
server.port=8082

# Actuator / Micrometer — health probes + Prometheus scraping. Metrics live on the app
# port (8082); the nginx gateway denies /content/actuator so they stay internal.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

# Datasource connection identity lives in the dev/prod profiles (12-Factor: per-environment).
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Secrets have no defaults here (fail-closed): every environment must inject them. The dev
# profile (application-dev.properties) supplies the shared dev fallbacks for local runs.
app.jwt-secret=${JWT_SECRET}
# Shared service-to-service secret (ADR-0007); must match the value recommendation-service sends.
app.internal-service-token=${INTERNAL_SERVICE_TOKEN}
app.user-service-base-url=${USER_SERVICE_BASE_URL:http://localhost:8081}
app.genai-service-base-url=${GENAI_SERVICE_BASE_URL:http://localhost:8000}
app.recommendation-service-base-url=${RECOMMENDATION_SERVICE_BASE_URL:http://localhost:8083}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Object-storage connection identity lives in the dev/prod/test profiles (12-Factor: per-environment).
# These two are non-secret tunables with safe defaults, so they stay in the shared base.
app.storage.max-file-bytes=${MAX_FILE_BYTES:5242880}
# Multipart parser ceiling must sit ABOVE app.storage.max-file-bytes (5 MiB), otherwise Spring
# rejects 1–5 MiB uploads with MaxUploadSizeExceededException before FileStorageService can return
# the friendly 400. 10 MiB hard ceiling = DoS guard; the 5 MiB business rule stays the user-facing gate.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.digest.system-author-id=${DIGEST_SYSTEM_AUTHOR_ID:00000000-0000-0000-0000-000000000000}
app.digest.timezone=${DIGEST_TIMEZONE:Europe/Berlin}
app.digest.poll-interval-ms=${DIGEST_POLL_INTERVAL_MS:5000}
app.digest.max-wait-ms=${DIGEST_MAX_WAIT_MS:120000}
app.genai-service-read-timeout-seconds=${GENAI_READ_TIMEOUT_SECONDS:60}
spring.task.scheduling.pool.size=${CONTENT_SCHEDULER_POOL_SIZE:2}
