spring.application.name=content-service
server.port=8082

# Actuator / Micrometer — health probes + Prometheus scraping. Metrics live on the app
# port (8082); the nginx gateway denies /content/actuator so they stay internal.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/contentdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt-secret=${JWT_SECRET}
app.user-service-base-url=${USER_SERVICE_BASE_URL:http://localhost:8081}
app.genai-service-base-url=${GENAI_SERVICE_BASE_URL:http://localhost:8000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
