spring.application.name=content-service
server.port=8082
management.endpoints.web.exposure.include=health

spring.datasource.url=${DB_URL:jdbc:h2:mem:contentdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.user-service-base-url=${USER_SERVICE_BASE_URL:http://localhost:8081}
app.genai-service-base-url=${GENAI_SERVICE_BASE_URL:http://localhost:8000}

