spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Reads the shared JWT_SECRET env so all services validate each other's tokens; falls back to a
# dev-only literal when unset. Production must set JWT_SECRET (base application.properties has no default).
app.jwt-secret=${JWT_SECRET:dev-only-insecure-secret-replace-in-production!!}
# Shared service-to-service secret (ADR-0007); must match the value recommendation-service sends.
app.internal-service-token=${INTERNAL_SERVICE_TOKEN:dev-only-internal-service-token}
# S3-compatible object storage for post photo uploads.
app.storage.s3.endpoint=${STORAGE_S3_ENDPOINT:http://localhost:9000}
app.storage.s3.public-endpoint=${STORAGE_S3_PUBLIC_ENDPOINT:http://localhost:9000}
app.storage.s3.region=${STORAGE_S3_REGION:us-east-1}
app.storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:verita_minio}
app.storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:verita_minio_password}
app.storage.s3.path-style-access=${STORAGE_S3_PATH_STYLE_ACCESS:true}
app.storage.buckets.post-photos=${STORAGE_POST_PHOTOS_BUCKET:verita-post-photos}
