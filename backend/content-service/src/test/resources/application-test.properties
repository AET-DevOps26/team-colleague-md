# Placeholder so the property resolver does not fail on startup.
# @ServiceConnection replaces the actual JDBC connection details at runtime.
spring.datasource.password=test

# Test-only value; never used in production.
app.jwt-secret=test-only-secret-not-for-production
app.internal-service-token=test-internal-service-token

# Flyway runs all three migrations on the Testcontainer, producing an identical schema to
# production. Hibernate's validate mode fails on the tsvector column added by V3 because
# that PostgreSQL-specific JDBC type has no standard mapping. Using none skips Hibernate's
# redundant check while keeping the real schema under test.
spring.jpa.hibernate.ddl-auto=none
