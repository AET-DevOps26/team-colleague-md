openapi: 3.0.3
info:
  title: Verita Content Service API
  description: |
    Comprehensive service for managing the lifecycle of posts, hierarchical comments,
    adding topic, user interactions (likes/bookmarks), and content moderation.
  version: 1.1.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: 'http://api.verita.local/content'
    description: Production-style internal URL

paths:
  # --- INTERNAL USER CLEANUP ---
  /internal/v1/users/{userId}/data:
    delete:
      operationId: deleteUserContentData
      summary: Delete all content-service data owned by a user
      description: |
        Internal endpoint called by user-service during account deletion.
        Soft-deletes authored posts and comments, removes user-owned bookmarks and votes,
        and refreshes affected counters. The operation is idempotent.
      tags: [Internal]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: User content data cleaned up successfully
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --- POSTS MANAGEMENT ---
  /api/v1/posts:
    get:
      operationId: getAllPosts
      summary: Retrieve a paginated list of posts
      description: |
        General-purpose endpoint for fetching a batch of posts with optional topic filtering.
        Intended for use cases such as topic-based browsing, admin tooling, or any client
        that needs raw paginated post data.

        **Not** the homepage feed — the personalised and trending feeds are served by the
        Recommendation Service (`GET /api/v1/feed/personal` and `GET /api/v1/feed/trending`).
        Those endpoints apply algorithmic ranking and return enriched post payloads.

        The `topic` parameter performs an exact-match filter and returns results in
        reverse-chronological order. For popularity-ranked topic browsing, use
        `GET /api/v1/feed/trending?topic=` in the Recommendation Service instead.
      tags: [Posts]
      security: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
        - name: topic
          in: query
          schema: { type: string }
      responses:
        '200':
          description: A paginated list of posts retrieved successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '400': { $ref: '#/components/responses/BadRequest' }

    post:
      operationId: createPost
      summary: Create a new post or draft
      tags: [Posts]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostRequest' }
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/posts/cards:
    get:
      operationId: getPostCards
      summary: Fetch lightweight PostCard objects for multiple posts by ID
      description: |
        Returns `PostCard` objects (no article body) for the given post IDs, preserving
        the order of the `ids` parameter. Called by the frontend after receiving a `postIds`
        list from the Recommendation Service to populate feed cards.
      tags: [Posts]
      security: []
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated list of post UUIDs, e.g. `ids=id1,id2,id3`.
          schema:
            type: array
            items: { type: string, format: uuid }
            maxItems: 50
          style: form
          explode: false
      responses:
        '200':
          description: Posts retrieved successfully. Missing IDs are silently omitted.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PostCard' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/posts/search:
    get:
      operationId: searchPosts
      summary: Search posts by keyword
      description: |
        Full-text keyword search across post titles and content.
        Returns results ranked by relevance to the query string, not by time or popularity.

        This endpoint is driven by user intent (the user typed something to find) and is
        distinct from feed discovery. Future iterations may back this with a dedicated
        search engine (e.g. Elasticsearch) without changing the contract.

        Authentication is optional. When a valid Bearer token is present, `isLikedByMe`
        and `isBookmarkedByMe` are populated per the authenticated user; otherwise they
        default to `false`.
      tags: [Posts]
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Search results retrieved successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # --- DIGESTS (standalone entity, ADR-0019) ---
  /api/v1/digests:
    get:
      operationId: getMyDigests
      summary: Get the current user's digest history
      description: >
        Union of the caller's personal digests (`digest_type = PERSONAL`, `target_user_id = me`)
        and the public digests assigned to the caller on days they had no subscriptions, newest
        first, paginated. Auth-required (fails closed).
      tags: [Digests]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Digests retrieved successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DigestSummaryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/digests/public/today:
    get:
      operationId: getPublicTodayDigest
      summary: Get today's public digest
      description: >
        Returns the newest `PUBLIC` digest, readable without authentication so the logged-out
        `/digest` surface has something to show (ADR-0018/0019). Responds `404` when none exists.
      tags: [Digests]
      security: []
      responses:
        '200':
          description: Public digest retrieved successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DigestSummary' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/digests/{id}:
    get:
      operationId: getDigestById
      summary: Get one digest with its full event stream
      description: >
        Optional authentication (ADR-0006/0016). A `PERSONAL` digest whose `target_user_id` is not
        the caller responds `404`; a `PUBLIC` digest is open (including logged-out).
      tags: [Digests]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Digest retrieved successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DigestDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/posts/{id}:
    get:
      operationId: getPostById
      summary: Get detailed post by ID
      tags: [Posts]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Post details retrieved successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

    put:
      operationId: updatePost
      summary: Update an existing post
      tags: [Posts]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostRequest' }
      responses:
        '200':
          description: Post updated successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      operationId: patchPost
      summary: Partially update an existing post
      description: |
        Updates only the fields provided in the request body; omitted fields are left
        unchanged. Use this for single-field updates such as unpublishing a post
        (`{"status": "DRAFT"}`) without re-sending the full post payload.
        For full replacement (e.g. the post editor), use `PUT`.

        Only the post author may patch a post.
      tags: [Posts]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostPatchRequest' }
      responses:
        '200':
          description: Post updated successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      operationId: deletePost
      summary: Soft-delete a post
      tags: [Posts]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Post deleted successfully
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/posts/{id}/summary:
    get:
      operationId: getPostSummary
      summary: Get post AI summary status
      description: |
        Returns the AI summary state for a single post. Uses the same visibility
        rules as post detail: published posts are public, drafts are visible only
        to their author, and non-visible posts return 404.
      tags: [Posts]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Post summary state retrieved successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostSummaryResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --- LIKES ---
  /api/v1/posts/{id}/like:
    post:
      operationId: likePost
      summary: Like or dislike a post
      description: Send LIKE or DISLIKE to cast/change a reaction. Send NONE to remove any existing reaction.
      tags: [Interactions]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LikeRequest' }
      responses:
        '200':
          description: Like processed successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostLikeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --- BOOKMARKS ---
  /api/v1/posts/{id}/bookmark:
    post:
      operationId: bookmarkPost
      summary: Save a post to the current user's bookmarks
      tags: [Interactions]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Post bookmarked successfully
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      operationId: unbookmarkPost
      summary: Remove a post from the current user's bookmarks
      tags: [Interactions]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Post removed from bookmarks successfully
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --- COMMENTS ---
  /api/v1/posts/{id}/comments:
    get:
      operationId: getCommentsByPost
      summary: Get all comments for a post
      tags: [Comments]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Hierarchical list of comments retrieved
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CommentResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

    post:
      operationId: createComment
      summary: Post a comment or reply
      tags: [Comments]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentRequest' }
      responses:
        '201':
          description: Comment created successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/comments/{id}:
    delete:
      operationId: deleteComment
      summary: Delete a comment owned by the current user, or any comment on a post they authored
      tags: [Comments]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Comment deleted successfully
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/comments/{id}/like:
    post:
      operationId: likeComment
      summary: Like or un-like a comment
      description: Send LIKE to cast a like. Send NONE to remove an existing like.
      tags: [Interactions]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentLikeRequest' }
      responses:
        '200':
          description: Comment like processed successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentLikeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --- CURRENT USER PRIVATE RESOURCES (/me/) ---
  /api/v1/me/drafts:
    get:
      operationId: getMyDrafts
      summary: Get current user's draft posts
      tags: [Me]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Drafts retrieved successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --- USER PUBLIC RESOURCES (/users/{id}/) ---
  /api/v1/users/{id}/posts:
    get:
      operationId: getUserPosts
      summary: Get published posts authored by a user
      tags: [Users]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: User posts retrieved successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/users/{id}/bookmarks:
    get:
      operationId: getUserBookmarks
      summary: Get a user's bookmarked posts
      description: |
        Returns bookmarked posts for the given user. Visibility is controlled by the user's
        `showBookmarks` preference (from UserPreferences). The current user can always access
        their own bookmarks; other users' bookmarks are only visible when `showBookmarks` is true.
      tags: [Users]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Bookmarked posts retrieved successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/users/{id}/likes:
    get:
      operationId: getUserLikes
      summary: Get posts liked by a user
      description: |
        Returns liked posts for the given user. Visibility is controlled by the user's
        `showLikes` preference (from UserPreferences). The current user can always access
        their own likes; other users' likes are only visible when `showLikes` is true.
      tags: [Users]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Liked posts retrieved successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --- TOPICS ---
  /api/v1/topics:
    get:
      operationId: getTopics
      summary: Get all topics grouped by category
      description: Returns all topics with full stats, grouped by category. Used by the Manage Topics page.
      tags: [Topics]
      security: []
      responses:
        '200':
          description: Topics grouped by category
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TopicCategoryGroup' } }

  /api/v1/topics/by-ids:
    get:
      operationId: getTopicsByIds
      summary: Batch-resolve topic names by ID
      description: |
        Returns minimal `{ id, name }` objects for the given topic IDs — for callers that only
        need to resolve names (e.g. recommendation-service populating subscribed-topic names).
        Unknown IDs are silently omitted; the caller tolerates gaps.

        This is a dedicated sibling of `GET /api/v1/topics` (which returns the full
        category-grouped catalog with stats), mirroring the `GET /api/v1/posts/cards?ids=`
        pattern: one operation, one response shape.
      tags: [Topics]
      security: []
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated list of topic UUIDs, e.g. `ids=id1,id2,id3`. Max 100.
          schema:
            type: array
            items: { type: string, format: uuid }
            minItems: 1
            maxItems: 100
          style: form
          explode: false
      responses:
        '200':
          description: Matching topics retrieved. Unknown IDs are silently omitted.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Topic' } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/topics/search:
    get:
      operationId: searchTopics
      summary: Autocomplete topic search
      tags: [Topics]
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Matching topics (max 20)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TopicResponse' } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /internal/v1/topics/follower-counts:
    post:
      operationId: updateTopicFollowerCounts
      summary: Apply batch follower-count deltas (internal, service-authenticated)
      description: >
        Service-only endpoint (gated by X-Internal-Service-Token, ADR-0007). Increments or
        decrements follower_count for each named topic. +1 = follow, -1 = unfollow.
      tags: [Topics]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FollowerCountDeltaRequest' }
      responses:
        '204':
          description: Deltas applied
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/topics/trending:
    get:
      operationId: getTrendingTopics
      summary: Get popular topics
      tags: [Topics]
      security: []
      responses:
        '200':
          description: List of trending topics retrieved
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TopicResponse' } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/files:
    post:
      operationId: uploadFile
      summary: Upload an image, returning its public URL
      description: >
        Accepts a single image as multipart/form-data, validates type and size, stores it in
        object storage, and returns its public URL for use as a cover image or inline post image.
      tags: [Files]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: File uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileUploadResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /internal/v1/digests:
    post:
      operationId: createDigest
      summary: Create a digest (internal, service-authenticated)
      deprecated: true
      description: >
        Deprecated service-only endpoint (gated by X-Internal-Service-Token, ADR-0007). Existing
        callers may still persist an already-generated digest, but content-service ignores the
        request title and applies its deterministic personal/public title rule. Scheduled and admin
        generation persist in-process and do not call this endpoint.
      tags: [Digests]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDigestRequest' }
      responses:
        '201':
          description: Digest created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DigestDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/digests/generate/users/{userId}:
    post:
      operationId: generateUserDigest
      summary: Generate one user's AI Daily Digest (internal)
      description: >
        Service-only manual trigger for the same generation orchestration used by the scheduled
        daily digest job. Branches on whether the user has topic subscriptions: subscribers get a
        freshly generated `PERSONAL` digest; zero-subscription users are assigned the day's `PUBLIC`
        digest (ADR-0018/0019). By default, skips when the user already has a digest for the current
        Platform Day; force=true regenerates.
      tags: [Digests]
      security: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: force
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Digest generation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DigestGenerationResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }

  # --- ADMIN OPS (ADR-0020) ---
  # Browser-facing, ADMIN-JWT only. The GenAI routes are a thin front door: content-service
  # forwards them to genai-service over the X-Internal-Service-Token channel (ADR-0007), so the
  # browser never talks to GenAI directly and GenAI needs no JWT awareness.
  /api/v1/admin/genai/llm-config:
    get:
      operationId: getLlmConfig
      summary: Get the active GenAI LLM configuration (admin only)
      description: >
        Returns the live `(provider, model)` pair GenAI is currently using — the in-memory
        override when an admin has set one, otherwise GenAI's environment default — plus every
        supported provider and whether its API key is configured.
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active LLM configuration retrieved successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LlmConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
    put:
      operationId: updateLlmConfig
      summary: Switch the GenAI provider/model at runtime (admin only)
      description: >
        Sets GenAI's in-memory `(provider, model)` override. The override is deliberately not
        persisted: it resets to the environment default when genai-service restarts (ADR-0020).
        Selecting a provider whose API key is absent is rejected with `400`.
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LlmConfigUpdateRequest' }
      responses:
        '200':
          description: Override applied; the new active configuration is returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LlmConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /api/v1/admin/posts/summaries/failed:
    get:
      operationId: listFailedSummaries
      summary: List posts whose AI summary failed (admin only)
      description: >
        Paged list of posts left in `summaryStatus = FAILED` after the retrying summary listener
        gave up. Feeds the admin Operations tab, where each row can be re-triggered.
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Failed-summary posts retrieved successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FailedSummaryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/posts/{id}/summarize:
    post:
      operationId: resummarizePost
      summary: Re-trigger AI summarization for a post (admin only)
      description: >
        Moves the post to `summaryStatus = PENDING` and republishes the summary event, reusing the
        same retrying listener as authoring (there is no separate synchronous overwrite path). The
        call returns `202` immediately; poll `GET /api/v1/posts/{id}/summary` for the outcome.
        Admin-gated because it spends LLM budget on demand.
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Summarization queued
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The post's content is not eligible for summarization (too short or empty)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/admin/digests/generate/users/{userId}:
    post:
      operationId: adminGenerateUserDigest
      summary: Generate a user's digest for a given day on demand (admin only)
      description: >
        Admin-JWT front door to the same orchestration the scheduled daily job runs
        (ADR-0018/0019). The work blocks on a GenAI job plus external news fetches, so it is run
        in the background and the call returns `202` immediately rather than risking a gateway or
        browser timeout — with a `DigestGenerationJob` whose id is polled via
        `GET /api/v1/admin/digests/jobs/{jobId}` for the outcome.

        `date` selects the day to generate for and defaults to **yesterday**: the current Platform
        Day is still accumulating news, so the day worth (re)generating is the last complete one.
        By default a user who already has a digest for that day is left alone (job status
        `SKIPPED`); `force=true` regenerates.
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: date
          in: query
          description: Platform Day to generate for; defaults to yesterday in the digest timezone.
          schema: { type: string, format: date }
        - name: force
          in: query
          schema: { type: boolean, default: false }
      responses:
        '202':
          description: Digest generation started; poll the returned job for the outcome
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DigestGenerationJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/digests/jobs/{jobId}:
    get:
      operationId: getDigestGenerationJob
      summary: Poll an admin-triggered digest generation (admin only)
      description: >
        Outcome of a run started by `POST /api/v1/admin/digests/generate/users/{userId}`. A digest
        row only exists once generation succeeds, so this job — not the digest — is where a
        `PENDING`, `SKIPPED` or `FAILED` run reports itself.
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Job retrieved successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DigestGenerationJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request parameters or body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: The user is not allowed to perform this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadGateway:
      description: Downstream service failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # --- SHARED ---
    FileUploadResponse:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri, description: "Public URL of the stored file" }

    DigestType:
      type: string
      enum: [PERSONAL, PUBLIC]
      description: "PERSONAL = generated for one subscriber (target set); PUBLIC = shared platform digest (target null)."

    DigestSource:
      type: object
      required: [url]
      description: A single external source cited by a digest event.
      properties:
        url: { type: string, format: uri }
        sourceName: { type: string, nullable: true, description: "Human-readable source/domain name" }
        provider: { type: string, nullable: true, description: "Upstream provider (github, gnews, huggingface)" }
        publishedAt: { type: string, format: date-time, nullable: true, description: "Absolute publish time; the client computes the relative label" }
        title: { type: string, nullable: true, description: "Source article/item title" }

    DigestEvent:
      type: object
      required: [headline, summaryBullets, topicIds, sources]
      description: One newly observed development in the digest, with its structured sources.
      properties:
        headline: { type: string }
        summaryBullets: { type: array, items: { type: string } }
        topicIds: { type: array, items: { type: string, format: uuid } }
        sources: { type: array, items: { $ref: '#/components/schemas/DigestSource' } }

    DigestSummary:
      type: object
      description: Lightweight digest projection for list/card reads — no events JSONB loaded.
      required: [id, digestType, digestDate, title]
      properties:
        id: { type: string, format: uuid }
        digestType: { $ref: '#/components/schemas/DigestType' }
        digestDate: { type: string, format: date }
        title: { type: string }
        subtitle: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        eventCount: { type: integer }
        sourceCount: { type: integer }
        readTimeMinutes: { type: integer }
        previewHeadlines: { type: array, items: { type: string }, description: "First 3 event headlines, denormalized at write time" }
        topics: { type: array, items: { $ref: '#/components/schemas/Topic' } }
        generatedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    DigestDetail:
      type: object
      description: Full digest including the event stream.
      required: [id, digestType, digestDate, title, events]
      properties:
        id: { type: string, format: uuid }
        digestType: { $ref: '#/components/schemas/DigestType' }
        digestDate: { type: string, format: date }
        title: { type: string }
        subtitle: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        eventCount: { type: integer }
        sourceCount: { type: integer }
        readTimeMinutes: { type: integer }
        previewHeadlines: { type: array, items: { type: string } }
        topics: { type: array, items: { $ref: '#/components/schemas/Topic' } }
        events: { type: array, items: { $ref: '#/components/schemas/DigestEvent' } }
        model: { type: string, nullable: true }
        generatedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    DigestSummaryPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/DigestSummary' } }
        page: { type: integer }
        size: { type: integer }
        totalPages: { type: integer }
        totalElements: { type: integer }

    CreateDigestRequest:
      type: object
      required: [digestType, digestDate, events]
      description: Persist an already-generated digest. topicIds live inside events; topics carries names for display.
      properties:
        digestType: { $ref: '#/components/schemas/DigestType' }
        targetUserId:
          type: string
          format: uuid
          nullable: true
          description: "Required when digestType=PERSONAL; must be null when PUBLIC."
        digestDate: { type: string, format: date }
        title:
          type: string
          nullable: true
          deprecated: true
          description: Deprecated compatibility field. Content-service ignores it and constructs the digest title.
        subtitle: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        events: { type: array, items: { $ref: '#/components/schemas/DigestEvent' } }
        topics: { type: array, items: { $ref: '#/components/schemas/DigestTopicRef' } }
        eventCount: { type: integer, nullable: true }
        sourceCount: { type: integer, nullable: true }
        readTimeMinutes: { type: integer, nullable: true }
        model: { type: string, nullable: true }
        generatedAt: { type: string, format: date-time, nullable: true }

    DigestTopicRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    DigestGenerationResponse:
      type: object
      required: [status, message]
      properties:
        status: { type: string, enum: [GENERATED, ASSIGNED_PUBLIC, SKIPPED] }
        message: { type: string }
        digest: { $ref: '#/components/schemas/DigestDetail' }

    DigestJobStatus:
      type: string
      enum: [PENDING, COMPLETED, SKIPPED, FAILED]
      description: >
        Lifecycle of an admin-triggered digest generation. `SKIPPED` is terminal but not a failure:
        the user already had a digest for that day and `force` was off.

    DigestGenerationJob:
      type: object
      description: One admin-triggered digest generation run (ADR-0020).
      required: [id, targetUserId, digestDate, status]
      properties:
        id: { type: string, format: uuid }
        targetUserId: { type: string, format: uuid }
        digestDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/DigestJobStatus' }
        message: { type: string, nullable: true, description: "Why it was skipped, or what broke" }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }

    AuthorSummary:
      type: object
      description: Lightweight author info embedded in posts and comments to avoid extra lookups
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string, format: uri, nullable: true }
        role: { type: string, enum: [USER, VERIFIED, ADMIN] }
        organisation: { type: string, nullable: true }

    Topic:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    # --- POSTS ---
    SummaryStatus:
      type: string
      enum: [PENDING, COMPLETED, FAILED, NONE]
      description: Current lifecycle state of a post's AI summary.

    PostCard:
      type: object
      description: Lightweight post shape for feed cards. Omits full body content.
      properties:
        id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/AuthorSummary' }
        title: { type: string }
        excerpt: { type: string, nullable: true }
        coverImageUrl: { type: string, format: uri, nullable: true }
        topics: { type: array, items: { $ref: '#/components/schemas/Topic' } }
        readTimeMinutes: { type: integer, nullable: true }
        likeCount: { type: integer }
        commentCount: { type: integer }
        viewCount: { type: integer }
        isLikedByMe: { type: boolean, description: "False when request is unauthenticated" }
        createdAt: { type: string, format: date-time }

    PostRequest:
      type: object
      required: [title, content]
      properties:
        title: { type: string, minLength: 5, maxLength: 100 }
        content: { type: string, minLength: 1, maxLength: 50000 }
        excerpt: { type: string, maxLength: 500, description: "Short preview shown in feed cards. Auto-generated from content if omitted." }
        coverImageUrl: { type: string, format: uri, nullable: true }
        sourceUrl: { type: array, items: { type: string, format: uri } }
        topics: { type: array, items: { type: string }, description: "Topic names. New topics are created automatically." }
        status: { type: string, enum: [DRAFT, PUBLISHED], default: PUBLISHED }

    PostPatchRequest:
      type: object
      description: |
        Partial update payload. All fields are optional — only provided fields are applied.
        Nullable fields (`excerpt`, `coverImageUrl`) can be cleared by sending an explicit null.
      properties:
        title: { type: string, minLength: 5, maxLength: 100 }
        content: { type: string, minLength: 1, maxLength: 50000 }
        excerpt: { type: string, maxLength: 500, nullable: true }
        coverImageUrl: { type: string, format: uri, nullable: true }
        sourceUrl: { type: array, items: { type: string, format: uri } }
        topics: { type: array, items: { type: string }, description: "Topic names. Replaces the post's topics. New topics are created automatically." }
        status: { type: string, enum: [DRAFT, PUBLISHED] }

    PostResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/AuthorSummary' }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        title: { type: string }
        excerpt: { type: string, description: "Short preview text for feed cards" }
        summary: { type: string, nullable: true, description: "AI-generated key-points summary (newline-separated bullets); null until generated" }
        summaryStatus: { $ref: '#/components/schemas/SummaryStatus' }
        summaryGeneratedAt: { type: string, format: date-time, nullable: true, description: "When the current summary was generated; null for historical or not-yet-generated summaries" }
        summaryModel: { type: string, nullable: true, description: "LLM model used for the current summary; null when unknown or not generated" }
        content: { type: string, description: "Full post body (Markdown)" }
        coverImageUrl: { type: string, format: uri, nullable: true }
        topics: { type: array, items: { $ref: '#/components/schemas/Topic' } }
        sourceUrl: { type: array, items: { type: string, format: uri } }
        readTimeMinutes: { type: integer }
        likeCount: { type: integer }
        dislikeCount: { type: integer }
        commentCount: { type: integer }
        viewCount: { type: integer }
        saveCount: { type: integer, description: "Number of times this post has been bookmarked" }
        isLikedByMe: { type: boolean, description: "True if the authenticated user liked this post" }
        isDislikedByMe: { type: boolean, description: "True if the authenticated user disliked this post" }
        isBookmarkedByMe: { type: boolean, description: "True if the authenticated user bookmarked this post" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PostSummaryResponse:
      type: object
      properties:
        status: { $ref: '#/components/schemas/SummaryStatus' }
        summary: { type: string, nullable: true, description: "AI-generated key-points summary (newline-separated bullets), if available" }
        generatedAt: { type: string, format: date-time, nullable: true }
        model: { type: string, nullable: true }

    # --- ADMIN OPS (ADR-0020) ---
    LlmProviderAvailability:
      type: object
      required: [name, configured]
      properties:
        name: { type: string, description: "Provider key, e.g. `nvidia`" }
        configured: { type: boolean, description: "False when the provider lacks its required connection setting; it cannot be selected" }

    LlmConfig:
      type: object
      properties:
        provider: { type: string }
        model: { type: string }
        temperature: { type: number, format: float }
        availableProviders:
          type: array
          items: { $ref: '#/components/schemas/LlmProviderAvailability' }

    LlmConfigUpdateRequest:
      type: object
      required: [provider, model]
      properties:
        provider: { type: string, minLength: 1, description: "Must be a provider reported as `configured`" }
        model: { type: string, minLength: 1, description: "Free-text model id for that provider" }

    FailedSummaryPost:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        authorId: { type: string, format: uuid }
        summaryStatus: { $ref: '#/components/schemas/SummaryStatus' }
        updatedAt: { type: string, format: date-time }

    FailedSummaryPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/FailedSummaryPost' } }
        page: { type: integer }
        size: { type: integer }
        totalPages: { type: integer }
        totalElements: { type: integer }

    PostPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/PostResponse' } }
        page: { type: integer }
        size: { type: integer }
        totalPages: { type: integer }
        totalElements: { type: integer }

    # --- COMMENTS ---
    CommentRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }
        parentId: { type: string, format: uuid, nullable: true, description: "ID of parent comment for replies" }

    CommentResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/AuthorSummary' }
        text: { type: string }
        likeCount: { type: integer }
        isLikedByMe: { type: boolean }
        createdAt: { type: string, format: date-time }
        replies: { type: array, items: { $ref: '#/components/schemas/CommentResponse' } }

    # --- INTERACTIONS ---
    LikeRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [LIKE, DISLIKE, NONE]
          description: "LIKE or DISLIKE to cast/change reaction. NONE to remove any existing reaction."

    PostLikeResponse:
      type: object
      properties:
        likeCount: { type: integer }
        dislikeCount: { type: integer }
        isLikedByMe: { type: boolean }
        isDislikedByMe: { type: boolean }

    CommentLikeRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [LIKE, NONE]
          description: "LIKE to cast a like. NONE to remove an existing like."

    CommentLikeResponse:
      type: object
      properties:
        likeCount: { type: integer }
        isLikedByMe: { type: boolean }

    # --- TOPICS ---
    TopicResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        displayName: { type: string, nullable: true }
        categoryId: { type: string, nullable: true }
        sortOrder: { type: integer }
        totalPostCount: { type: integer }
        postsThisWeek: { type: integer }
        postsPrevWeek: { type: integer }
        activityScore: { type: number, description: "Normalised 0.000–1.000" }
        isHot: { type: boolean }
        followerCount: { type: integer }

    TopicCategoryGroup:
      type: object
      description: A category with all its topics, used by the Manage Topics page.
      properties:
        id: { type: string, description: "Category slug, e.g. 'research'" }
        label: { type: string }
        sortOrder: { type: integer }
        topics:
          type: array
          items: { $ref: '#/components/schemas/TopicResponse' }

    FollowerCountDeltaRequest:
      type: object
      required: [deltas]
      description: Batch follower-count adjustment. Keys are topic name slugs, values are +1 (follow) or -1 (unfollow).
      properties:
        deltas:
          type: object
          additionalProperties: { type: integer }

    # --- ERRORS ---
    ErrorResponse:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
