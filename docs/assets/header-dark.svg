<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Verita — AI knowledge sharing, auto-summarized news digests, personalized for you">
  <defs>
    <style>
      .serif { font-family: "Newsreader", "Iowan Old Style", Georgia, "Times New Roman", serif; }
      .sans  { font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono  { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; }
      @keyframes verita-sweep {
        0%   { transform: translateX(-360px); }
        100% { transform: translateX(1280px); }
      }
      .beam { animation: verita-sweep 4.2s cubic-bezier(0.45,0,0.55,1) infinite; }
      @media (prefers-reduced-motion: reduce) {
        .beam { animation: none; transform: translateX(460px); }
      }
    </style>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#9FB0C4" stop-opacity="0"/>
      <stop offset="0.5"  stop-color="#9FB0C4" stop-opacity="1"/>
      <stop offset="1"    stop-color="#9FB0C4" stop-opacity="0"/>
    </linearGradient>
    <filter id="beamGlow" x="-50%" y="-400%" width="200%" height="900%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <clipPath id="barClip"><rect x="0" y="315" width="1280" height="5"/></clipPath>
  </defs>

  <!-- Surface -->
  <rect width="1280" height="320" fill="#0A0A0A"/>
  <!-- Hairline inner frame -->
  <rect x="0.5" y="0.5" width="1279" height="319" fill="none" stroke="#262626" stroke-width="1"/>

  <!-- ============ Dynamic light bar ============ -->
  <g clip-path="url(#barClip)">
    <rect x="0" y="315" width="1280" height="5" fill="#E5E5E5"/>
    <g class="beam">
      <rect x="0" y="312" width="360" height="11" fill="url(#beamGrad)" filter="url(#beamGlow)"/>
      <rect x="130" y="315" width="100" height="5"  fill="#C8D2DE"/>
    </g>
  </g>

  <!-- ============ Logo mark: many sources → one distilled point ============ -->
  <g transform="translate(120, 116)" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none">
    <line x1="0"  y1="0"  x2="34" y2="0"/>
    <line x1="0"  y1="16" x2="52" y2="16"/>
    <line x1="0"  y1="32" x2="26" y2="32"/>
    <line x1="0"  y1="48" x2="44" y2="48"/>
    <line x1="0"  y1="64" x2="34" y2="64"/>
    <line x1="0"  y1="80" x2="52" y2="80"/>
    <line x1="0"  y1="96" x2="30" y2="96"/>
    <path d="M60 4  C 78 20, 84 34, 88 48" opacity="0.40"/>
    <path d="M60 48 L 88 48" opacity="0.60"/>
    <path d="M60 92 C 78 76, 84 62, 88 48" opacity="0.40"/>
  </g>
  <circle cx="210" cy="164" r="7" fill="#FFFFFF"/>
  <circle cx="210" cy="164" r="15" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.40"/>

  <!-- Eyebrow / kicker -->
  <text class="mono" x="290" y="84" font-size="16" letter-spacing="4.5" fill="#6B6B6B">AI&#160;&#183;&#160;KNOWLEDGE&#160;DIGEST</text>

  <!-- ============ Wordmark ============ -->
  <text class="serif" x="285" y="196" font-size="96" font-weight="600" letter-spacing="-1.5" fill="#FFFFFF">Verita</text>

  <!-- Tagline -->
  <text class="sans" x="290" y="244" font-size="24" font-weight="400" fill="#ABABAB">AI knowledge sharing — auto-summarized news digests, personalized for you.</text>

  <!-- ============ Right-side quiet metadata (right-aligned) ============ -->
  <line x1="1174" y1="116" x2="1174" y2="204" stroke="#262626" stroke-width="1"/>
  <text class="mono" x="1158" y="146" text-anchor="end" font-size="16" letter-spacing="1" fill="#6B6B6B">summarize</text>
  <text class="mono" x="1158" y="171" text-anchor="end" font-size="16" letter-spacing="1" fill="#6B6B6B">personalize</text>
  <text class="mono" x="1158" y="196" text-anchor="end" font-size="16" letter-spacing="1" fill="#FFFFFF">read.</text>
</svg>
