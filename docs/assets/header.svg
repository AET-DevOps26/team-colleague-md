<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 180" width="940" height="180" role="img" aria-labelledby="title desc">
  <title id="title">Verita</title>
  <desc id="desc">Verita — an AI-focused knowledge-sharing platform. Five services: React frontend, three Spring Boot microservices, and a FastAPI GenAI service.</desc>

  <defs>
    <!-- Tiles seamlessly across 940 units so the translate loop has no visible seam. -->
    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="940" y2="0" spreadMethod="repeat">
      <stop offset="0"    stop-color="var(--ink)" />
      <stop offset="0.35" stop-color="var(--faint)" />
      <stop offset="0.5"  stop-color="var(--faint)" />
      <stop offset="0.85" stop-color="var(--ink)" />
      <stop offset="1"    stop-color="var(--ink)" />
    </linearGradient>

    <clipPath id="banner">
      <rect x="1" y="1" width="938" height="178" rx="12" />
    </clipPath>
  </defs>

  <style>
    /* Monochrome, mirroring the app's design tokens (frontend/src/styles/globals.css):
       --text-primary #0A0A0A, --text-secondary #6B6B6B, --text-tertiary #ABABAB,
       --border-subtle #EBEBEB, --radius-card 12px. The app is light-only; here the palette
       simply inverts for dark-theme readers, since it carries no hue to preserve. */
    :root {
      --paper: #FFFFFF;
      --ink: #0A0A0A;
      --muted: #6B6B6B;
      --faint: #ABABAB;
      --rule: #EBEBEB;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0A0A0A;
        --ink: #F5F5F5;
        --muted: #ABABAB;
        --faint: #5A5A5A;
        --rule: #262626;
      }
    }

    /* One CSS transform on a group — no SMIL, no animated gradientTransform, both of which
       are unreliable through GitHub's image proxy. */
    .sweep { animation: sweep 14s linear infinite; }
    @keyframes sweep { from { transform: translateX(-940px); } to { transform: translateX(0); } }

    /* Newsreader is a webfont the app loads from Google Fonts; an SVG rendered as an image on
       GitHub cannot fetch it, so this falls back to Georgia — the app's own declared fallback. */
    .brand {
      fill: var(--ink);
      font-family: "Newsreader", "Iowan Old Style", Georgia, serif;
      font-style: italic;
      letter-spacing: -0.025em;
    }
    .brand-v { font-size: 54px; font-weight: 600; }
    .brand-rest { font-size: 46px; font-weight: 500; }

    .tag  { fill: var(--muted); font: 400 15px "Inter", system-ui, -apple-system, sans-serif; }
    .chip { fill: var(--faint); font: 400 11px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }

    @media (prefers-reduced-motion: reduce) {
      .sweep { animation: none; }
    }
  </style>

  <g clip-path="url(#banner)">
    <rect x="0" y="0" width="940" height="180" fill="var(--paper)" />

    <!-- Wordmark: serif italic with an oversized V, matching Sidebar.module.css .brandV/.brandErita -->
    <text class="brand" x="48" y="86">
      <tspan class="brand-v">V</tspan><tspan class="brand-rest">erita</tspan>
    </text>

    <text class="tag" x="50" y="116">AI-focused knowledge sharing — intelligent curation, automated summarization,</text>
    <text class="tag" x="50" y="137">and personalized recommendations.</text>

    <text class="chip" x="50" y="164">React 19  ·  Spring Boot 4 / Java 25  ·  FastAPI  ·  PostgreSQL  ·  Kubernetes</text>

    <!-- Hairline shimmer along the base: the only motion, in greyscale only. -->
    <g class="sweep">
      <rect x="0" y="176" width="1880" height="4" fill="url(#shimmer)" />
    </g>
  </g>

  <rect x="1" y="1" width="938" height="178" rx="12" fill="none" stroke="var(--rule)" stroke-width="1.5" />
</svg>
