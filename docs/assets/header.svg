<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Verita</title>
  <desc id="desc">Verita — an AI-focused knowledge-sharing platform. Five services: React frontend, three Spring Boot microservices, and a FastAPI GenAI service.</desc>

  <defs>
    <!-- Tiles seamlessly across 1200 units so the translate loop has no visible seam. -->
    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="repeat">
      <stop offset="0"    stop-color="#2A2A2A" />
      <stop offset="0.4"  stop-color="#FFFFFF" />
      <stop offset="0.5"  stop-color="#FFFFFF" />
      <stop offset="0.9"  stop-color="#2A2A2A" />
      <stop offset="1"    stop-color="#2A2A2A" />
    </linearGradient>
  </defs>

  <style>
    /* Ink-on-white is the app's own contrast (--text-primary / --accent #0A0A0A over white);
       this banner inverts it deliberately, so it reads as a header rather than a card and
       holds up under both GitHub themes. Full bleed: no border, no corner radius. */

    /* One CSS transform on a group — no SMIL, no animated gradientTransform, both of which
       are unreliable through GitHub's image proxy. */
    .sweep { animation: sweep 14s linear infinite; }
    @keyframes sweep { from { transform: translateX(-1200px); } to { transform: translateX(0); } }

    /* Newsreader is a webfont the app loads from Google Fonts; an SVG rendered as an image on
       GitHub cannot fetch it, so this falls back to Georgia — the app's own declared fallback. */
    .brand {
      fill: #FFFFFF;
      font-family: "Newsreader", "Iowan Old Style", Georgia, serif;
      font-style: italic;
      letter-spacing: -0.025em;
    }
    .brand-v { font-size: 82px; font-weight: 600; }
    .brand-rest { font-size: 70px; font-weight: 500; }

    .tag  { fill: #B4B4B4; font: 400 18px "Inter", system-ui, -apple-system, sans-serif; }
    .chip { fill: #7A7A7A; font: 400 12.5px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.04em; }

    @media (prefers-reduced-motion: reduce) {
      .sweep { animation: none; }
    }
  </style>

  <rect x="0" y="0" width="1200" height="300" fill="#0A0A0A" />

  <!-- Wordmark: serif italic with an oversized V, matching Sidebar.module.css .brandV/.brandErita -->
  <text class="brand" x="600" y="152" text-anchor="middle">
    <tspan class="brand-v">V</tspan><tspan class="brand-rest">erita</tspan>
  </text>

  <text class="tag" x="600" y="196" text-anchor="middle">AI-focused knowledge sharing — intelligent curation, automated summarization, and personalized recommendations.</text>

  <text class="chip" x="600" y="234" text-anchor="middle">React 19  ·  Spring Boot 4 / Java 25  ·  FastAPI  ·  PostgreSQL  ·  Kubernetes</text>

  <!-- Hairline shimmer along the base: the only motion, in greyscale only. -->
  <g class="sweep">
    <rect x="0" y="296" width="2400" height="4" fill="url(#shimmer)" />
  </g>
</svg>
