<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img" aria-labelledby="title desc">
  <title id="title">Verita request flow</title>
  <desc id="desc">A browser calls the API gateway, which routes by path prefix to the user, content, and recommendation Spring Boot services, each with its own PostgreSQL database. Content-service forwards to the FastAPI GenAI service over an internal service token channel.</desc>

  <style>
    :root {
      --bg: #ffffff;
      --box: #f6f8fa;
      --box-stroke: #d0d7de;
      --text: #1f2328;
      --muted: #656d76;
      --wire: #d0d7de;
      --java: #6e40c9;
      --python: #1a7f37;
      --db: #0969da;
      --client: #bc4c00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --box: #161b22;
        --box-stroke: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --wire: #30363d;
        --java: #a371f7;
        --python: #3fb950;
        --db: #58a6ff;
        --client: #db6d28;
      }
    }

    .bg { fill: var(--bg); }
    .box { fill: var(--box); stroke: var(--box-stroke); stroke-width: 1.5; rx: 8; }
    .label { fill: var(--text); font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sub { fill: var(--muted); font: 400 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .note { fill: var(--muted); font: 400 10px system-ui, -apple-system, sans-serif; }
    .accent-java { stroke: var(--java); }
    .accent-python { stroke: var(--python); }
    .accent-db { stroke: var(--db); }
    .accent-client { stroke: var(--client); }

    /* Connectors: marching-ants flow. Pure CSS — survives GitHub's SVG sanitizer,
       where SMIL is not dependable. */
    .wire {
      fill: none;
      stroke: var(--wire);
      stroke-width: 2;
      stroke-linecap: round;
    }
    .flow {
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 7 11;
      animation: march 1.1s linear infinite;
    }
    .flow-internal {
      stroke-dasharray: 4 8;
      animation: march 1.6s linear infinite;
    }
    @keyframes march { to { stroke-dashoffset: -18; } }

    .f1 { animation-delay: 0s; }
    .f2 { animation-delay: -.15s; }
    .f3 { animation-delay: -.3s; }
    .f4 { animation-delay: -.45s; }

    @media (prefers-reduced-motion: reduce) {
      .flow { animation: none; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="940" height="450" />

  <!-- ============ connectors (drawn first, under the boxes) ============ -->

  <!-- browser -> gateway -->
  <path class="wire" d="M 170 205 H 232" />
  <path class="flow accent-client f1" d="M 170 205 H 232" />

  <!-- gateway -> user-service -->
  <path class="wire" d="M 382 190 C 412 190 402 78 432 78" />
  <path class="flow accent-java f1" d="M 382 190 C 412 190 402 78 432 78" />
  <!-- gateway -> content-service -->
  <path class="wire" d="M 382 205 H 432" />
  <path class="flow accent-java f2" d="M 382 205 H 432" />
  <!-- gateway -> recommendation-service -->
  <path class="wire" d="M 382 220 C 412 220 402 332 432 332" />
  <path class="flow accent-java f3" d="M 382 220 C 412 220 402 332 432 332" />

  <!-- services -> their databases -->
  <path class="wire" d="M 592 78 H 700" />
  <path class="flow accent-db f2" d="M 592 78 H 700" />
  <path class="wire" d="M 592 205 H 700" />
  <path class="flow accent-db f3" d="M 592 205 H 700" />
  <path class="wire" d="M 592 332 H 700" />
  <path class="flow accent-db f4" d="M 592 332 H 700" />

  <!-- content-service -> genai-service. Sweeps down-left into open space so it can never be
       misread as originating at the gateway. -->
  <path class="wire" d="M 432 228 C 380 228 380 413 310 413" stroke-dasharray="5 5" />
  <path class="flow flow-internal accent-python f1" d="M 432 228 C 380 228 380 413 310 413" />

  <!-- ============ nodes ============ -->

  <!-- browser -->
  <rect class="box" x="20" y="177" width="150" height="56" />
  <rect x="20" y="177" width="4" height="56" rx="2" fill="var(--client)" />
  <text class="label" x="38" y="200">Browser</text>
  <text class="sub" x="38" y="217">React 19 · :3000</text>

  <!-- gateway -->
  <rect class="box" x="232" y="177" width="150" height="56" />
  <rect x="232" y="177" width="4" height="56" rx="2" fill="var(--client)" />
  <text class="label" x="250" y="200">API Gateway</text>
  <text class="sub" x="250" y="217">path-prefix routing</text>

  <!-- user-service -->
  <rect class="box" x="432" y="50" width="160" height="56" />
  <rect x="432" y="50" width="4" height="56" rx="2" fill="var(--java)" />
  <text class="label" x="450" y="73">user-service</text>
  <text class="sub" x="450" y="90">/user · :8081</text>

  <!-- content-service -->
  <rect class="box" x="432" y="177" width="160" height="56" />
  <rect x="432" y="177" width="4" height="56" rx="2" fill="var(--java)" />
  <text class="label" x="450" y="200">content-service</text>
  <text class="sub" x="450" y="217">/content · :8082</text>

  <!-- recommendation-service -->
  <rect class="box" x="432" y="304" width="160" height="56" />
  <rect x="432" y="304" width="4" height="56" rx="2" fill="var(--java)" />
  <text class="label" x="450" y="327">recommendation</text>
  <text class="sub" x="450" y="344">/recommendation · :8083</text>

  <!-- genai-service, sitting in the open lower-left so the internal hop reads clearly -->
  <rect class="box" x="150" y="385" width="160" height="56" />
  <rect x="150" y="385" width="4" height="56" rx="2" fill="var(--python)" />
  <text class="label" x="168" y="408">genai-service</text>
  <text class="sub" x="168" y="425">FastAPI · :8000</text>

  <!-- databases -->
  <rect class="box" x="700" y="50" width="165" height="56" />
  <rect x="700" y="50" width="4" height="56" rx="2" fill="var(--db)" />
  <text class="label" x="718" y="73">user-db</text>
  <text class="sub" x="718" y="90">PostgreSQL</text>

  <rect class="box" x="700" y="177" width="165" height="56" />
  <rect x="700" y="177" width="4" height="56" rx="2" fill="var(--db)" />
  <text class="label" x="718" y="200">content-db</text>
  <text class="sub" x="718" y="217">PostgreSQL</text>

  <rect class="box" x="700" y="304" width="165" height="56" />
  <rect x="700" y="304" width="4" height="56" rx="2" fill="var(--db)" />
  <text class="label" x="718" y="327" style="font-size:12px">recommendation-db</text>
  <text class="sub" x="718" y="344">PostgreSQL</text>

  <!-- ============ annotations ============ -->
  <text class="note" x="782" y="38" text-anchor="middle">database per service</text>
</svg>
