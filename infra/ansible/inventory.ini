# Template — overwritten by ansible-deploy.yml workflow with real AZURE_PUBLIC_IP.
# For local use: replace PLACEHOLDER_IP with the VM's actual public IP.
[verita]
verita-vm ansible_host=PLACEHOLDER_IP ansible_user=azureuser ansible_ssh_private_key_file=~/.ssh/verita_key ansible_ssh_common_args='-o StrictHostKeyChecking=no'
