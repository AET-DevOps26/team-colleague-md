---
# Deploys all Verita services to the Azure VM.
# Requires: github_actor, github_token, user_db_password, content_db_password,
# recommendation_db_password, jwt_secret, minio_root_password,
# user_service_s3_access_key, user_service_s3_secret_key,
# content_service_s3_access_key, content_service_s3_secret_key,
# mail_username, mail_password, mail_from, nvidia_nim_api_key, logos_api_key,
# and gnews_api_key passed as --extra-vars by the caller.
- name: Deploy Verita services
  hosts: all
  become: true

  tasks:
    - name: Install Docker prerequisites
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine and Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add azureuser to docker group
      user:
        name: azureuser
        groups: docker
        append: true

    - name: Reset SSH connection to apply group membership
      meta: reset_connection

    - name: Create deployment directory
      file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: azureuser
        group: azureuser
        mode: "0755"

    - name: Copy docker-compose.prod.yml to VM
      copy:
        src: ../../docker-compose.prod.yml
        dest: "{{ deploy_dir }}/docker-compose.prod.yml"
        owner: azureuser
        group: azureuser
        mode: "0644"

    # Emits only secrets and VM-specific values. Non-secret DB names/users (USER_DB_NAME,
    # USER_DB_USER, …) and other non-secrets (MINIO_ROOT_USER, STORAGE_S3_ENDPOINT/REGION,
    # buckets) carry committed defaults in docker-compose.prod.yml — keeping them out of .env
    # preserves reviewability. S3 access keys stay here as they pair with their secret keys.
    - name: Write .env file with secrets and VM-specific credentials
      copy:
        dest: "{{ deploy_dir }}/.env"
        content: |
          USER_DB_PASSWORD={{ user_db_password }}
          CONTENT_DB_PASSWORD={{ content_db_password }}
          RECOMMENDATION_DB_PASSWORD={{ recommendation_db_password }}
          JWT_SECRET={{ jwt_secret }}
          INTERNAL_SERVICE_TOKEN={{ internal_service_token }}
          CORS_ALLOWED_ORIGINS={{ cors_allowed_origins | default('http://' ~ ansible_host) }}
          MINIO_ROOT_PASSWORD={{ minio_root_password }}
          USER_SERVICE_S3_ACCESS_KEY={{ user_service_s3_access_key }}
          USER_SERVICE_S3_SECRET_KEY={{ user_service_s3_secret_key }}
          CONTENT_SERVICE_S3_ACCESS_KEY={{ content_service_s3_access_key }}
          CONTENT_SERVICE_S3_SECRET_KEY={{ content_service_s3_secret_key }}
          STORAGE_S3_PUBLIC_ENDPOINT={{ storage_s3_public_endpoint | default('http://' ~ ansible_host ~ '/storage') }}
          MAIL_USERNAME={{ mail_username }}
          MAIL_PASSWORD={{ mail_password }}
          MAIL_FROM={{ mail_from }}
          LLM_PROVIDER=logos
          LLM_MODEL=openai/gpt-oss-120b
          OLLAMA_BASE_URL={{ ollama_base_url | default('') }}
          GENAI_READ_TIMEOUT_SECONDS={{ genai_read_timeout_seconds | default(60) }}
          DIGEST_MAX_WAIT_MS={{ digest_max_wait_ms | default(120000) }}
          NVIDIA_NIM_API_KEY={{ nvidia_nim_api_key }}
          LOGOS_API_KEY={{ logos_api_key }}
          GNEWS_API_KEY={{ gnews_api_key }}
        owner: azureuser
        group: azureuser
        mode: "0600"
      no_log: true

    - name: Log in to GitHub Container Registry
      become_user: azureuser
      shell: "echo '{{ github_token }}' | docker login ghcr.io -u {{ github_actor }} --password-stdin"
      no_log: true

    - name: Pull latest images from ghcr.io
      become_user: azureuser
      command: docker compose -f {{ deploy_dir }}/docker-compose.prod.yml pull

    - name: Tear down existing stack (removes containers and volumes for a clean redeploy)
      become_user: azureuser
      command: docker compose -f {{ deploy_dir }}/docker-compose.prod.yml down -v --remove-orphans

    - name: Start all services
      become_user: azureuser
      command: docker compose -f {{ deploy_dir }}/docker-compose.prod.yml up -d
