---
# Deploys all Verita services to the Azure VM.
# Requires: github_actor and github_token passed as --extra-vars by the caller.
- name: Deploy Verita services
  hosts: all
  become: true

  tasks:
    - name: Install Docker prerequisites
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine and Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add azureuser to docker group
      user:
        name: azureuser
        groups: docker
        append: true

    - name: Reset SSH connection to apply group membership
      meta: reset_connection

    - name: Create deployment directory
      file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: azureuser
        group: azureuser
        mode: "0755"

    - name: Copy docker-compose.prod.yml to VM
      copy:
        src: ../../docker-compose.prod.yml
        dest: "{{ deploy_dir }}/docker-compose.prod.yml"
        owner: azureuser
        group: azureuser
        mode: "0644"

    - name: Log in to GitHub Container Registry
      become_user: azureuser
      shell: "echo '{{ github_token }}' | docker login ghcr.io -u {{ github_actor }} --password-stdin"
      no_log: true

    - name: Pull latest images from ghcr.io
      become_user: azureuser
      command: docker compose -f {{ deploy_dir }}/docker-compose.prod.yml pull

    - name: Start all services
      become_user: azureuser
      command: docker compose -f {{ deploy_dir }}/docker-compose.prod.yml up -d --remove-orphans
