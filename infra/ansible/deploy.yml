---
# Deploys all Verita services to the Azure VM.
# Requires: github_actor, github_token, db_password, minio_root_password,
# user_service_s3_access_key, user_service_s3_secret_key,
# content_service_s3_access_key, content_service_s3_secret_key passed as --extra-vars by the caller.
- name: Deploy Verita services
  hosts: all
  become: true

  tasks:
    - name: Install Docker prerequisites
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine and Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add azureuser to docker group
      user:
        name: azureuser
        groups: docker
        append: true

    - name: Reset SSH connection to apply group membership
      meta: reset_connection

    - name: Create deployment directory
      file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: azureuser
        group: azureuser
        mode: "0755"

    - name: Copy docker-compose.prod.yml to VM
      copy:
        src: ../../docker-compose.prod.yml
        dest: "{{ deploy_dir }}/docker-compose.prod.yml"
        owner: azureuser
        group: azureuser
        mode: "0644"

    - name: Write .env file with database and object storage credentials
      copy:
        dest: "{{ deploy_dir }}/.env"
        content: |
          DB_NAME=verita_users
          DB_USER=verita_user
          DB_PASSWORD={{ db_password }}
          MINIO_ROOT_USER={{ minio_root_user | default('verita_minio') }}
          MINIO_ROOT_PASSWORD={{ minio_root_password }}
          USER_SERVICE_S3_ACCESS_KEY={{ user_service_s3_access_key }}
          USER_SERVICE_S3_SECRET_KEY={{ user_service_s3_secret_key }}
          CONTENT_SERVICE_S3_ACCESS_KEY={{ content_service_s3_access_key }}
          CONTENT_SERVICE_S3_SECRET_KEY={{ content_service_s3_secret_key }}
          STORAGE_S3_ENDPOINT=http://minio:9000
          STORAGE_S3_PUBLIC_ENDPOINT={{ storage_s3_public_endpoint | default('http://' ~ ansible_host ~ '/storage') }}
          STORAGE_S3_REGION={{ storage_s3_region | default('us-east-1') }}
          STORAGE_USER_PORTRAITS_BUCKET={{ storage_user_portraits_bucket | default('verita-user-portraits') }}
          STORAGE_POST_PHOTOS_BUCKET={{ storage_post_photos_bucket | default('verita-post-photos') }}
        owner: azureuser
        group: azureuser
        mode: "0600"
      no_log: true

    - name: Log in to GitHub Container Registry
      become_user: azureuser
      shell: "echo '{{ github_token }}' | docker login ghcr.io -u {{ github_actor }} --password-stdin"
      no_log: true

    - name: Pull latest images from ghcr.io
      become_user: azureuser
      command: docker compose -f {{ deploy_dir }}/docker-compose.prod.yml pull

    - name: Start all services
      become_user: azureuser
      command: docker compose -f {{ deploy_dir }}/docker-compose.prod.yml up -d --remove-orphans
