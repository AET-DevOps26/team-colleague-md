apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "user.fullname" . }}
  labels:
    {{- include "user.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "user.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "user.selectorLabels" . | nindent 8 }}
      annotations:
        github.com/rollout-id: {{ .Values.image.rolloutId | default "1" | quote }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ include "user.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: DB_HOST
              value: {{ printf "%s-user-postgresql" .Release.Name | quote }}
            - name: DB_PORT
              value: {{ .Values.db.port | default 5432 | quote }}
            - name: DB_NAME
              value: {{ .Values.db.name | quote }}
            - name: DB_USER
              value: {{ .Values.db.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-user-postgresql" .Release.Name | quote }}
                  key: {{ .Values.db.secretKey | quote }}
