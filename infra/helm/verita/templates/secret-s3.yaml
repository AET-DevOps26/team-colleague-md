{{- if .Values.minio.enabled }}
{{- /*
  One Secret per scoped MinIO user, keyed off the same minio.users[] entries the
  MinIO make-user job consumes — so a single --set minio.users[N].secretKey=...
  feeds both the IAM user creation and the service's STORAGE_S3_SECRET_KEY (see
  deployment.yaml). Dev defaults live in values.yaml; prod overrides via --set.
*/}}
{{- range .Values.minio.users }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-s3-{{ .accessKey }}
  labels:
    helm.sh/chart: {{ include "verita.chart" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
type: Opaque
stringData:
  secretKey: {{ .secretKey | required "minio.users[].secretKey is required" | quote }}
{{- end }}
{{- end }}
