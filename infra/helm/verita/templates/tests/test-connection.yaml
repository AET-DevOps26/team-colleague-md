apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "verita.fullname" . }}-test-connection"
  labels:
    {{- include "verita.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - sh
        - -c
        - wget -qO- http://{{ printf "%s-%s" .Release.Name "frontend" }}:{{ .Values.frontend.service.port }}/
  restartPolicy: Never
