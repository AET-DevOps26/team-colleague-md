{{- if .Values.ingress.enabled }}
# A single Ingress routes everything to the frontend. The frontend nginx is the
# API gateway: it proxies /user, /content, /recommendation, /genai and /storage
# to the in-cluster services (same nginx.conf used on the Azure VM). This keeps
# the Ingress trivial (no rewrite, no regex), avoids the nginx admission-webhook
# conflict that two same-host Ingresses trigger on upgrade, and keeps backends
# off the public Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "verita.fullname" . }}-ingress
  labels:
    {{- include "verita.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
spec:
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if and .Values.monitoring.enabled .Values.monitoring.grafana.ingress.enabled }}
          # Grafana lives on the same host (a second same-host Ingress would trip
          # the nginx admission webhook on upgrade — see note above). nginx routes
          # by longest matching prefix, so this sub-path wins over the "/" frontend
          # rule. Grafana serves from the sub-path via GF_SERVER_* (grafana.yaml).
          - path: {{ .Values.monitoring.grafana.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-grafana" .Release.Name }}
                port:
                  number: 3000
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-frontend" .Release.Name }}
                port:
                  number: {{ .Values.services.frontend.port }}
{{- end }}
