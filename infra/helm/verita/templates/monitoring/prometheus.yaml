{{- if .Values.monitoring.enabled }}
{{- $m := .Values.monitoring }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-prometheus-config
  labels:
    {{- include "verita.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ $m.prometheus.scrapeInterval | default "30s" }}
      scrape_timeout: 10s
      external_labels:
        deployment: rancher
    rule_files:
      - /etc/prometheus/rules/alerts.yml
    scrape_configs:
      # Self
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
        relabel_configs:
          - target_label: deployment
            replacement: rancher

      # App services (Spring /actuator/prometheus, genai /metrics) discovered via the
      # prometheus.io/* annotations set on each Service. Restricted to this namespace so
      # the namespaced RBAC Role is sufficient.
      - job_name: verita-app-services
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ["{{ .Release.Namespace }}"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - source_labels: [__meta_kubernetes_service_name]
            target_label: job
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - target_label: deployment
            replacement: rancher

      # Bitnami PostgreSQL exporters. Discovered by any endpoint whose port name contains
      # "metrics" (the postgres_exporter sidecar port, 9187) — robust to the chart's exact
      # service naming. Verify with: kubectl get endpoints -n <ns>
      - job_name: verita-postgres
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ["{{ .Release.Namespace }}"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: .*metrics.*
          - source_labels: [__meta_kubernetes_service_name]
            target_label: job
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - target_label: deployment
            replacement: rancher
  alerts.yml: |
{{ .Files.Get "files/verita-alerts.yml" | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-prometheus
  labels:
    {{- include "verita.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if $m.storageClass }}
  storageClassName: {{ $m.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $m.prometheus.persistence.size | default "5Gi" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-prometheus
  labels:
    {{- include "verita.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ printf "%s|%s|%s" ($m.prometheus | toYaml) (.Files.Get "files/verita-alerts.yml") .Release.Namespace | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}-prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: "Always"
      containers:
        - name: prometheus
          image: {{ $m.prometheus.image | quote }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time={{ $m.prometheus.retention | default "7d" }}"
            - "--web.enable-lifecycle"
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            initialDelaySeconds: 30
          resources:
            {{- toYaml $m.prometheus.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /etc/prometheus/rules/alerts.yml
              subPath: alerts.yml
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-prometheus
  labels:
    {{- include "verita.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
