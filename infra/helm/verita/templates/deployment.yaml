{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    helm.sh/chart: {{ include "verita.chart" $ }}
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  replicas: {{ $svc.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
      annotations:
        github.com/rollout-id: {{ $svc.rolloutId | default "1" | quote }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.registry }}/{{ $svc.image }}:{{ $svc.tag }}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          {{- if $svc.health }}
          readinessProbe:
            httpGet:
              path: {{ $svc.health.path }}
              port: http
            initialDelaySeconds: {{ $svc.health.initialDelaySeconds | default 10 }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: {{ $svc.health.path }}
              port: http
            initialDelaySeconds: {{ $svc.health.initialDelaySeconds | default 10 }}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}
          env:
            {{- if $svc.springProfile }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ $svc.springProfile | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: "https://{{ $.Values.ingress.host }}"
            # Shared HS256 secret — every backend service reads the same value so JWTs interoperate.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ $.Release.Name }}-jwt"
                  key: secret
            {{- end }}
            {{- if $svc.internalToken }}
            # ADR-0007 shared service-to-service secret. Same value for all internal callers/callees.
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "{{ $.Release.Name }}-internal-token"
                  key: token
            {{- end }}
            {{- if $svc.mail }}
            # Password-reset SMTP (Brevo). Host/port/sender are non-secret; the SMTP login and
            # key come from the {{ $.Release.Name }}-mail Secret (only minted when creds are set).
            - name: MAIL_HOST
              value: {{ $svc.mail.host | quote }}
            - name: MAIL_PORT
              value: {{ $svc.mail.port | quote }}
            - name: MAIL_FROM
              value: {{ $svc.mail.from | quote }}
            - name: MAIL_SMTP_AUTH
              value: "true"
            - name: MAIL_SMTP_STARTTLS
              value: "true"
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: "{{ $.Release.Name }}-mail"
                  key: username
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ $.Release.Name }}-mail"
                  key: password
            {{- end }}
            {{- range $k, $v := $svc.extraEnv }}
            - name: {{ $k }}
              value: {{ tpl $v $ | quote }}
            {{- end }}
            {{- if $svc.db }}
            - name: DB_HOST
              value: "{{ $.Release.Name }}-{{ $name }}-postgresql"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: {{ $svc.db.name | quote }}
            - name: DB_USER
              value: {{ $svc.db.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ $.Release.Name }}-{{ $name }}-postgresql"
                  key: password
            {{- end }}
            {{- if $svc.proxyBackend }}
            - name: USER_SERVICE_URL
              value: "http://{{ $.Release.Name }}-user:{{ (index $.Values.services "user").port }}"
            - name: CONTENT_SERVICE_URL
              value: "http://{{ $.Release.Name }}-content:{{ (index $.Values.services "content").port }}"
            - name: RECOMMENDATION_SERVICE_URL
              value: "http://{{ $.Release.Name }}-recommendation:{{ (index $.Values.services "recommendation").port }}"
            - name: GENAI_SERVICE_URL
              value: "http://{{ $.Release.Name }}-genai:{{ (index $.Values.services "genai").port }}"
            - name: MINIO_URL
              value: "http://{{ $.Release.Name }}-minio:9000"
            {{- end }}
            {{- if $svc.storage }}
            - name: STORAGE_S3_ENDPOINT
              value: "http://{{ $.Release.Name }}-minio:9000"
            - name: STORAGE_S3_PUBLIC_ENDPOINT
              value: "https://{{ $.Values.ingress.host }}/storage"
            - name: STORAGE_S3_REGION
              value: "us-east-1"
            - name: STORAGE_S3_PATH_STYLE_ACCESS
              value: "true"
            # Scoped least-privilege S3 user (not the MinIO root) — restricted to this
            # service's own bucket via its policy. accessKey is non-secret; the secretKey
            # comes from the per-user Secret minted by secret-s3.yaml.
            - name: STORAGE_S3_ACCESS_KEY
              value: {{ $svc.storage.s3User | quote }}
            - name: STORAGE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ $.Release.Name }}-s3-{{ $svc.storage.s3User }}"
                  key: secretKey
            {{- end }}
{{- end }}
