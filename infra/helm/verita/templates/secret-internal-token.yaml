apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-internal-token
  labels:
    helm.sh/chart: {{ include "verita.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  # Shared service-to-service secret (ADR-0007). recommendation-service sends it as the
  # X-Internal-Service-Token header; content-service validates it. Override
  # global.internalServiceToken via --set for prod — the default is dev-only.
  token: {{ .Values.global.internalServiceToken | required "global.internalServiceToken is required" | quote }}
