apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-jwt
  labels:
    helm.sh/chart: {{ include "verita.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  # The HS256 secret shared by user-, content-, and recommendation-service. Override
  # global.jwtSecret in values-prod.yaml (or via --set) — the default is dev-only.
  secret: {{ .Values.global.jwtSecret | required "global.jwtSecret is required" | quote }}
