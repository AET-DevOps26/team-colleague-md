{{- if .Values.global.mailPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mail
  labels:
    helm.sh/chart: {{ include "verita.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  # Brevo SMTP credentials for the password-reset mail. Only rendered when global.mailPassword is
  # set (prod) — credential-less dev installs skip mail. Inject at deploy time, e.g.
  #   helm upgrade ... --set global.mailUsername=... --set global.mailPassword=...
  username: {{ .Values.global.mailUsername | required "global.mailUsername is required when global.mailPassword is set" | quote }}
  password: {{ .Values.global.mailPassword | quote }}
{{- end }}
