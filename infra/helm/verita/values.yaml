global:
  registry: ghcr.io/aet-devops26/team-colleague-md
  imagePullSecrets: []

services:
  user:
    image: user-service
    tag: latest
    port: 8081
    metrics:
      path: /actuator/prometheus
    springProfile: dev
    health:
      path: /actuator/health
      initialDelaySeconds: 45
    db:
      name: verita_users
      user: verita_user
    storage: true
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "300m"
        memory: "512Mi"

  content:
    image: content-service
    tag: latest
    port: 8082
    metrics:
      path: /actuator/prometheus
    springProfile: dev
    health:
      path: /actuator/health
      initialDelaySeconds: 45
    db:
      name: verita_content
      user: verita_user
    storage: true
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "300m"
        memory: "512Mi"

  recommendation:
    image: recommendation-service
    tag: latest
    port: 8083
    metrics:
      path: /actuator/prometheus
    springProfile: dev
    health:
      path: /actuator/health
      initialDelaySeconds: 45
    db:
      name: verita_recommendations
      user: verita_user
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "300m"
        memory: "512Mi"

  genai:
    image: genai-service
    tag: latest
    port: 8000
    metrics:
      path: /metrics
    replicaCount: 2
    health:
      path: /health
      initialDelaySeconds: 15
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

  frontend:
    image: frontend
    tag: latest
    port: 80
    replicaCount: 2
    proxyBackend: true
    health:
      path: /
      initialDelaySeconds: 5
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

ingress:
  enabled: true
  host: verita.stud.k8s.aet.cit.tum.de
  clusterIssuer: letsencrypt-staging
  tls:
    secretName: verita-tls

user-postgresql:
  enabled: true
  # postgres_exporter sidecar (port 9187, service port named "metrics"). The Prometheus
  # job discovers it by that port name. resources.limits are mandatory — the namespace
  # ResourceQuota rejects any pod whose containers do not declare limits.
  metrics:
    enabled: true
    resources:
      requests:
        cpu: "25m"
        memory: "32Mi"
      limits:
        cpu: "50m"
        memory: "64Mi"
  auth:
    username: verita_user
    password: verita_password
    database: verita_users
  primary:
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "150m"
        memory: "256Mi"

content-postgresql:
  enabled: true
  metrics:
    enabled: true
    resources:
      requests:
        cpu: "25m"
        memory: "32Mi"
      limits:
        cpu: "50m"
        memory: "64Mi"
  auth:
    username: verita_user
    password: verita_password
    database: verita_content
  primary:
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "150m"
        memory: "256Mi"

recommendation-postgresql:
  enabled: true
  metrics:
    enabled: true
    resources:
      requests:
        cpu: "25m"
        memory: "32Mi"
      limits:
        cpu: "50m"
        memory: "64Mi"
  auth:
    username: verita_user
    password: verita_password
    database: verita_recommendations
  primary:
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "150m"
        memory: "256Mi"

# MinIO via the official chart (https://charts.min.io/). The Bitnami subchart
# was dropped because Bitnami removed all free images. Single standalone
# instance is plenty for our lightweight usage (user-service avatars and
# content-service post photos). The chart provisions buckets via the
# post-install job and exposes a Secret named "<release>-minio" with keys
# rootUser/rootPassword, consumed by the storage env in deployment.yaml.
minio:
  enabled: true
  mode: standalone
  replicas: 1
  rootUser: verita_minio
  rootPassword: verita_minio_password
  # The default fsGroupChangePolicy "OnRootMismatch" does not trigger the
  # volume chown on the csi-rbd storage class (the root dir already has a
  # lost+found owned by root), so MinIO (uid 1000) cannot write to /export.
  # "Always" forces the recursive chown, matching what the PostgreSQL pods use.
  securityContext:
    enabled: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: "Always"
  persistence:
    enabled: true
    size: 8Gi
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "150m"
      memory: "256Mi"
  # We use the root credentials directly (services read them from the
  # <release>-minio Secret), so clear the chart's default "console" user —
  # it ships with a known default password and we do not need it.
  users: []
  # Buckets created by the post-install job; "download" allows anonymous
  # GET so public asset URLs (/storage/...) resolve.
  buckets:
    - name: verita-user-portraits
      policy: download
      purge: false
    - name: verita-post-photos
      policy: download
      purge: false
  # The namespace ResourceQuota requires every pod to declare limits. The
  # post-install job runs two containers (make-bucket and make-user), so both
  # need an explicit resources block with limits.
  makeBucketJob:
    resources:
      requests:
        cpu: "25m"
        memory: "32Mi"
      limits:
        cpu: "50m"
        memory: "64Mi"
  makeUserJob:
    resources:
      requests:
        cpu: "25m"
        memory: "32Mi"
      limits:
        cpu: "50m"
        memory: "64Mi"

# ---------------------------------------------------------------------------
# Self-hosted, namespace-scoped monitoring (Prometheus + Grafana) — "Model B".
# No Prometheus Operator / CRDs and no cluster-scoped RBAC, so it runs inside a
# shared student namespace. Service discovery is annotation-based (see service.yaml,
# kept namespace-restricted in the Prometheus config) and RBAC is a namespaced Role.
# Set enabled: false to instead rely on a cluster-provided Prometheus.
# ---------------------------------------------------------------------------
monitoring:
  enabled: true
  # "" uses the cluster default StorageClass; set explicitly (e.g. csi-rbd) if the
  # namespace has no default, matching what the postgresql/minio subcharts use.
  storageClass: ""
  prometheus:
    image: prom/prometheus:v3.1.0
    retention: 7d
    scrapeInterval: 30s
    persistence:
      size: 5Gi
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "250m", memory: "512Mi" }
  grafana:
    image: grafana/grafana:11.4.0
    adminUser: admin
    # Override per environment and rotate; consider sourcing from a Secret instead.
    adminPassword: verita_grafana_admin
    persistence:
      size: 1Gi
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits: { cpu: "150m", memory: "256Mi" }
