global:
  registry: ghcr.io/aet-devops26/team-colleague-md
  imagePullSecrets: []

services:
  user:
    image: user-service
    tag: latest
    port: 8081
    springProfile: dev
    health:
      path: /actuator/health
      initialDelaySeconds: 45
    db:
      name: verita_users
      user: verita_user
    storage: true
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "300m"
        memory: "512Mi"

  content:
    image: content-service
    tag: latest
    port: 8082
    springProfile: dev
    health:
      path: /actuator/health
      initialDelaySeconds: 45
    db:
      name: verita_content
      user: verita_user
    storage: true
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "300m"
        memory: "512Mi"

  recommendation:
    image: recommendation-service
    tag: latest
    port: 8083
    springProfile: dev
    health:
      path: /actuator/health
      initialDelaySeconds: 45
    db:
      name: verita_recommendations
      user: verita_user
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "300m"
        memory: "512Mi"

  genai:
    image: genai-service
    tag: latest
    port: 8000
    replicaCount: 2
    health:
      path: /health
      initialDelaySeconds: 15
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

  frontend:
    image: frontend
    tag: latest
    port: 80
    replicaCount: 2
    proxyBackend: true
    health:
      path: /
      initialDelaySeconds: 5
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

ingress:
  enabled: true
  host: verita.stud.k8s.aet.cit.tum.de
  clusterIssuer: letsencrypt-staging
  tls:
    secretName: verita-tls

user-postgresql:
  enabled: true
  auth:
    username: verita_user
    password: verita_password
    database: verita_users
  primary:
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "150m"
        memory: "256Mi"

content-postgresql:
  enabled: true
  auth:
    username: verita_user
    password: verita_password
    database: verita_content
  primary:
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "150m"
        memory: "256Mi"

recommendation-postgresql:
  enabled: true
  auth:
    username: verita_user
    password: verita_password
    database: verita_recommendations
  primary:
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "150m"
        memory: "256Mi"

minio:
  enabled: true
  auth:
    rootUser: verita_minio
    rootPassword: verita_minio_password
  defaultBuckets: "verita-user-portraits,verita-post-photos"
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "150m"
      memory: "256Mi"
