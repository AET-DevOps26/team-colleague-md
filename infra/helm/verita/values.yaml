global:
  registry: ghcr.io/aet-devops26/team-colleague-md
  imagePullSecrets: []
  # Shared HS256 secret for user-/content-/recommendation-service. DEV DEFAULT ONLY —
  # override in values-prod.yaml or via --set global.jwtSecret=... for real deployments.
  jwtSecret: "dev-only-insecure-secret-replace-in-production!!"

services:
  user:
    image: user-service
    tag: latest
    port: 8081
    springProfile: dev
    health:
      path: /actuator/health
      initialDelaySeconds: 45
    db:
      name: verita_users
      user: verita_user
    storage: true
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "300m"
        memory: "512Mi"

  content:
    image: content-service
    tag: latest
    port: 8082
    springProfile: dev
    # Cross-service calls (Clients.java) reach peers by their in-cluster Service name.
    extraEnv:
      USER_SERVICE_BASE_URL: "http://{{ .Release.Name }}-user:8081"
      GENAI_SERVICE_BASE_URL: "http://{{ .Release.Name }}-genai:8000"
    health:
      path: /actuator/health
      initialDelaySeconds: 45
    db:
      name: verita_content
      user: verita_user
    storage: true
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "300m"
        memory: "512Mi"

  recommendation:
    image: recommendation-service
    tag: latest
    port: 8083
    springProfile: dev
    # ContentClient reaches content-service by its in-cluster Service name.
    extraEnv:
      CONTENT_SERVICE_BASE_URL: "http://{{ .Release.Name }}-content:8082"
    health:
      path: /actuator/health
      initialDelaySeconds: 45
    db:
      name: verita_recommendations
      user: verita_user
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "300m"
        memory: "512Mi"

  genai:
    image: genai-service
    tag: latest
    port: 8000
    replicaCount: 2
    health:
      path: /health
      initialDelaySeconds: 15
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

  frontend:
    image: frontend
    tag: latest
    port: 80
    replicaCount: 2
    proxyBackend: true
    health:
      path: /
      initialDelaySeconds: 5
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

ingress:
  enabled: true
  host: verita.stud.k8s.aet.cit.tum.de
  clusterIssuer: letsencrypt-staging
  tls:
    secretName: verita-tls

user-postgresql:
  enabled: true
  auth:
    username: verita_user
    password: verita_password
    database: verita_users
  primary:
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "150m"
        memory: "256Mi"

content-postgresql:
  enabled: true
  auth:
    username: verita_user
    password: verita_password
    database: verita_content
  primary:
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "150m"
        memory: "256Mi"

recommendation-postgresql:
  enabled: true
  auth:
    username: verita_user
    password: verita_password
    database: verita_recommendations
  primary:
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "150m"
        memory: "256Mi"

# MinIO via the official chart (https://charts.min.io/). The Bitnami subchart
# was dropped because Bitnami removed all free images. Single standalone
# instance is plenty for our lightweight usage (user-service avatars and
# content-service post photos). The chart provisions buckets via the
# post-install job and exposes a Secret named "<release>-minio" with keys
# rootUser/rootPassword, consumed by the storage env in deployment.yaml.
minio:
  enabled: true
  mode: standalone
  replicas: 1
  rootUser: verita_minio
  rootPassword: verita_minio_password
  # The default fsGroupChangePolicy "OnRootMismatch" does not trigger the
  # volume chown on the csi-rbd storage class (the root dir already has a
  # lost+found owned by root), so MinIO (uid 1000) cannot write to /export.
  # "Always" forces the recursive chown, matching what the PostgreSQL pods use.
  securityContext:
    enabled: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: "Always"
  persistence:
    enabled: true
    size: 8Gi
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "150m"
      memory: "256Mi"
  # We use the root credentials directly (services read them from the
  # <release>-minio Secret), so clear the chart's default "console" user —
  # it ships with a known default password and we do not need it.
  users: []
  # Buckets created by the post-install job; "download" allows anonymous
  # GET so public asset URLs (/storage/...) resolve.
  buckets:
    - name: verita-user-portraits
      policy: download
      purge: false
    - name: verita-post-photos
      policy: download
      purge: false
  # The namespace ResourceQuota requires every pod to declare limits. The
  # post-install job runs two containers (make-bucket and make-user), so both
  # need an explicit resources block with limits.
  makeBucketJob:
    resources:
      requests:
        cpu: "25m"
        memory: "32Mi"
      limits:
        cpu: "50m"
        memory: "64Mi"
  makeUserJob:
    resources:
      requests:
        cpu: "25m"
        memory: "32Mi"
      limits:
        cpu: "50m"
        memory: "64Mi"
