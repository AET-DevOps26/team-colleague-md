# Prometheus config for the Azure (Docker Compose) deployment. Targets are resolved by
# Docker Compose service name on the shared project network. Run merged with the app stack:
#   docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  external_labels:
    deployment: azure

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: { deployment: azure }

  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["user-service:8081"]
        labels: { deployment: azure }

  - job_name: content-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["content-service:8082"]
        labels: { deployment: azure }

  - job_name: recommendation-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["recommendation-service:8083"]
        labels: { deployment: azure }

  - job_name: genai-service
    metrics_path: /metrics
    static_configs:
      - targets: ["genai-service:8000"]
        labels: { deployment: azure }

  # One job per database so `by (job)` in alerts/dashboards stays per-DB.
  - job_name: postgres-user
    static_configs:
      - targets: ["user-db-exporter:9187"]
        labels: { deployment: azure }
  - job_name: postgres-content
    static_configs:
      - targets: ["content-db-exporter:9187"]
        labels: { deployment: azure }
  - job_name: postgres-recommendation
    static_configs:
      - targets: ["recommendation-db-exporter:9187"]
        labels: { deployment: azure }

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: { deployment: azure }

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels: { deployment: azure }
